<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lue cha POS | Payment Master Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-scale:active { transform: scale(0.95); transition: 0.1s; }
        .luecha-blue { background-color: #003399; }
        .luecha-blue-text { color: #003399; }
        .luecha-orange { background-color: #FF6600; }
        .luecha-orange-text { color: #FF6600; }
        .bg-luecha-light { background-color: #f0f4ff; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 1. Database Schema (Master DB) ---
        const db = new Dexie("LueCha_Master_DB");
        db.version(3).stores({
            products: "++id, name, price, cost, category",
            ingredients: "++id, name, unit, stock, minStock",
            orders: "++id, total, timestamp, staff, paymentMethod",
            auditLogs: "++id, timestamp, action, staff"
        });

        const TOPPINGS = [
            { name: "ครีมชีส", price: 20 }, { name: "ชีสขูด", price: 20 },
            { name: "บิสคอฟ", price: 20 }, { name: "วิปครีม", price: 20 },
            { name: "ช็อกขูด", price: 20 }, { name: "ชาคิวบ์", price: 20 }
        ];

        function App() {
            const [view, setView] = useState('pos');
            const [cart, setCart] = useState([]);
            const [products, setProducts] = useState([]);
            const [ingredients, setIngredients] = useState([]);
            const [orders, setOrders] = useState([]);
            const [selectedItem, setSelectedItem] = useState(null);
            const [showAddModal, setShowAddModal] = useState(false);
            
            // Payment States
            const [showPayment, setShowPayment] = useState(false);
            const [paymentMethod, setPaymentMethod] = useState('cash'); // cash, transfer, delivery
            const [cashReceived, setCashReceived] = useState(0);
            const [queueNumber, setQueueNumber] = useState(1);
            const [showSuccess, setShowSuccess] = useState(false);

            const [formData, setFormData] = useState({ name: '', price: '', cost: '', category: 'เครื่องดื่ม' });

            useEffect(() => { refreshData(); }, []);

            const refreshData = async () => {
                setProducts(await db.products.toArray());
                setIngredients(await db.ingredients.toArray());
                setOrders(await db.orders.toArray());
            };

            const totalAmount = useMemo(() => cart.reduce((s, i) => s + i.price, 0), [cart]);
            const changeAmount = useMemo(() => Math.max(0, cashReceived - totalAmount), [cashReceived, totalAmount]);

            const handleQuickCash = (amount) => {
                if (amount === 'exact') setCashReceived(totalAmount);
                else setCashReceived(prev => prev + amount);
            };

            const confirmPayment = async () => {
                if (paymentMethod === 'cash' && cashReceived < totalAmount) {
                    alert("ยอดเงินรับมาไม่เพียงพอ");
                    return;
                }
                const orderData = {
                    total: totalAmount,
                    timestamp: new Date(),
                    staff: 'พนักงานบูธ',
                    paymentMethod: paymentMethod,
                    queue: queueNumber
                };
                await db.orders.add(orderData);
                setQueueNumber(prev => prev + 1);
                setShowSuccess(true);
                setTimeout(() => {
                    setShowSuccess(false);
                    setShowPayment(false);
                    setCart([]);
                    setCashReceived(0);
                    refreshData();
                }, 2000);
            };

            return (
                <div className="h-screen flex flex-col overflow-hidden">
                    {/* Header */}
                    <header className="luecha-blue p-4 text-white flex justify-between items-center shadow-lg z-10">
                        <div className="flex items-center gap-3">
                            <span className="font-bold text-xl tracking-tight">เลื่องชื่อลือชา POS</span>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setView('pos')} className={`px-4 py-1 rounded-full text-sm transition-all ${view==='pos'?'luecha-orange shadow-inner':'opacity-50'}`}>หน้าขาย</button>
                            <button onClick={() => setView('admin')} className={`px-4 py-1 rounded-full text-sm transition-all ${view==='admin'?'luecha-orange shadow-inner':'opacity-50'}`}>จัดการร้าน</button>
                            <button onClick={() => setView('report')} className={`px-4 py-1 rounded-full text-sm transition-all ${view==='report'?'luecha-orange shadow-inner':'opacity-50'}`}>รายงาน</button>
                        </div>
                    </header>

                    {/* VIEW: POS */}
                    {view === 'pos' && (
                        <div className="flex-1 flex overflow-hidden">
                            <div className="flex-1 p-4 grid grid-cols-2 md:grid-cols-4 gap-4 overflow-y-auto no-scrollbar bg-slate-100">
                                {products.map(p => (
                                    <button key={p.id} onClick={() => setSelectedItem({...p, currentSize: 'S', selectedToppings: []})}
                                        className="bg-white p-4 rounded-[2rem] shadow-sm active-scale flex flex-col items-center justify-center h-44 border-2 border-transparent hover:border-orange-500 transition-all">
                                        <span className="font-bold text-slate-800 text-center mb-2">{p.name}</span>
                                        <span className="luecha-blue-text font-black text-2xl">{p.price}฿</span>
                                    </button>
                                ))}
                            </div>
                            <div className="w-80 md:w-96 bg-white shadow-2xl flex flex-col">
                                <div className="p-6 border-b font-bold text-lg text-slate-700">ออเดอร์ปัจจุบัน</div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {cart.map(item => (
                                        <div key={item.cartId} className="bg-slate-50 p-4 rounded-2xl relative">
                                            <div className="flex justify-between font-bold text-slate-800">
                                                <span>{item.name} ({item.size})</span>
                                                <span>{item.price}฿</span>
                                            </div>
                                            <button onClick={() => setCart(cart.filter(i => i.cartId !== item.cartId))} className="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full text-xs">✕</button>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-6 bg-slate-50 border-t space-y-4">
                                    <div className="flex justify-between text-3xl font-black luecha-blue-text">
                                        <span>รวม</span>
                                        <span>{totalAmount}฿</span>
                                    </div>
                                    <button onClick={() => setShowPayment(true)} disabled={cart.length===0} 
                                        className="w-full luecha-orange text-white py-5 rounded-3xl font-bold text-xl shadow-lg active-scale disabled:opacity-30">
                                        ชำระเงิน
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* VIEW: ADMIN & REPORT (คงเดิมตาม Master) */}
                    {view === 'admin' && (
                        <div className="flex-1 p-8 overflow-y-auto bg-white">
                            <div className="max-w-5xl mx-auto space-y-8">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-3xl font-bold text-slate-800">จัดการร้านค้า</h2>
                                    <button onClick={() => setShowAddModal(true)} className="luecha-blue text-white px-8 py-3 rounded-2xl font-bold active-scale shadow-lg">+ เพิ่มสินค้า</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {ingredients.map(ing => (
                                        <div key={ing.id} className="bg-slate-50 p-6 rounded-[2rem] border border-slate-100">
                                            <p className="text-slate-500 text-sm">{ing.name}</p>
                                            <p className={`text-3xl font-black ${ing.stock <= ing.minStock ? 'text-red-500' : 'text-slate-800'}`}>{ing.stock} {ing.unit}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- NEW PAYMENT MODAL (ตามรูปที่คุณส่งมา) --- */}
                    {showPayment && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center z-[60] p-4">
                            <div className="bg-white w-full max-w-4xl rounded-[2rem] overflow-hidden shadow-2xl animate-in zoom-in-95 duration-200">
                                {/* Header */}
                                <div className="flex justify-between items-center p-4 border-b">
                                    <div className="flex items-center gap-2 font-bold text-slate-700">
                                        <span>ชำระเงิน</span>
                                        <div className="w-5 h-5 rounded-full border border-slate-300 flex items-center justify-center text-[10px]">i</div>
                                    </div>
                                    <button onClick={() => {setShowPayment(false); setCashReceived(0);}} className="text-slate-400 text-2xl">✕</button>
                                </div>

                                <div className="flex flex-col md:flex-row">
                                    {/* Left Side: Summary & Methods */}
                                    <div className="flex-1 p-6 border-r border-slate-100 space-y-6">
                                        <div className="luecha-blue rounded-3xl p-8 text-center text-white shadow-inner">
                                            <p className="text-sm opacity-80 mb-1">ยอดรวม</p>
                                            <p className="text-6xl font-black">{totalAmount}</p>
                                        </div>

                                        <div className="grid grid-cols-3 gap-3">
                                            <button onClick={() => setPaymentMethod('cash')} className={`flex flex-col items-center p-4 rounded-3xl border-2 transition-all ${paymentMethod==='cash'?'border-blue-500 bg-blue-50':'border-slate-100'}`}>
                                                <div className={`w-6 h-6 rounded-full mb-2 flex items-center justify-center ${paymentMethod==='cash'?'bg-green-500 text-white':'border border-slate-300'}`}>{paymentMethod==='cash'&&'✓'}</div>
                                                <span className="text-2xl mb-1">💵</span>
                                                <span className="text-xs font-bold">เงินสด</span>
                                            </button>
                                            <button onClick={() => setPaymentMethod('transfer')} className={`flex flex-col items-center p-4 rounded-3xl border-2 transition-all ${paymentMethod==='transfer'?'border-blue-500 bg-blue-50':'border-slate-100'}`}>
                                                <div className={`w-6 h-6 rounded-full mb-2 flex items-center justify-center ${paymentMethod==='transfer'?'bg-green-500 text-white':'border border-slate-300'}`}>{paymentMethod==='transfer'&&'✓'}</div>
                                                <span className="text-2xl mb-1">📲</span>
                                                <span className="text-xs font-bold">โอนเงิน</span>
                                            </button>
                                            <button onClick={() => setPaymentMethod('delivery')} className={`flex flex-col items-center p-4 rounded-3xl border-2 transition-all ${paymentMethod==='delivery'?'border-blue-500 bg-blue-50':'border-slate-100'}`}>
                                                <div className={`w-6 h-6 rounded-full mb-2 flex items-center justify-center ${paymentMethod==='delivery'?'bg-green-500 text-white':'border border-slate-300'}`}>{paymentMethod==='delivery'&&'✓'}</div>
                                                <span className="text-2xl mb-1">🛵</span>
                                                <span className="text-xs font-bold">เดลิเวอรี่</span>
                                            </button>
                                        </div>

                                        <div className="space-y-4">
                                            <div className="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl border-2 border-blue-100">
                                                <span className="text-slate-400">💸 รับมา</span>
                                                <input type="number" className="flex-1 bg-transparent text-3xl font-black text-right outline-none luecha-blue-text" 
                                                    value={cashReceived || ''} onChange={e => setCashReceived(parseFloat(e.target.value) || 0)} placeholder="กรอกที่นี่" />
                                                <span className="text-slate-400">บาท</span>
                                            </div>
                                            <div className="flex justify-between items-center px-4">
                                                <div className="flex items-center gap-2 text-slate-500">
                                                    <span>🔗 ทอน</span>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-4xl font-black text-red-500">{changeAmount}</span>
                                                    <span className="ml-2 text-slate-400">บาท</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Right Side: Quick Cash Buttons */}
                                    <div className="w-full md:w-[400px] p-6 bg-slate-50/50">
                                        <div className="flex justify-between text-xs font-bold text-slate-400 mb-4 uppercase tracking-wider">
                                            <span>รับเงินด่วน</span>
                                            <span>กดซ้ำเพื่อเพิ่มจำนวน</span>
                                        </div>
                                        <div className="grid grid-cols-3 gap-3">
                                            <button onClick={() => handleQuickCash('exact')} className="h-20 rounded-2xl bg-green-100 text-green-700 font-bold border-2 border-green-200 active-scale">พอดี</button>
                                            {[1, 5, 10, 20, 50, 100, 500, 1000].map(val => (
                                                <button key={val} onClick={() => handleQuickCash(val)} className="h-20 rounded-2xl bg-white shadow-sm border border-slate-200 font-bold text-xl text-slate-700 active-scale hover:bg-white transition-all">
                                                    {val}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* Footer Confirm Button */}
                                <div className="p-4 bg-white border-t">
                                    <button onClick={confirmPayment} className="w-full luecha-orange text-white py-6 rounded-2xl font-bold text-2xl shadow-lg active-scale flex items-center justify-center gap-3">
                                        {showSuccess ? '✓ ชำระเงินสำเร็จ' : 'ยืนยันชำระเงิน'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Success Queue (Overlay) */}
                    {showSuccess && (
                        <div className="fixed inset-0 bg-emerald-600 flex flex-col items-center justify-center z-[100] text-white animate-in fade-in duration-300">
                            <div className="text-[12rem] font-black leading-none mb-4">{queueNumber - 1}</div>
                            <h2 className="text-4xl font-bold">คิวของคุณ</h2>
                            <p className="mt-4 opacity-80">กำลังบันทึกข้อมูล...</p>
                        </div>
                    )}

                    {/* MODAL: Size/Topping (คงเดิม) */}
                    {selectedItem && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-end md:items-center justify-center z-50 p-4">
                            <div className="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl">
                                <div className="p-6 border-b flex justify-between items-center">
                                    <h3 className="text-xl font-bold text-slate-800">{selectedItem.name}</h3>
                                    <button onClick={() => setSelectedItem(null)} className="text-slate-400">ปิด</button>
                                </div>
                                <div className="p-6 space-y-6">
                                    <div className="grid grid-cols-3 gap-3">
                                        {['S', 'M', 'L'].map(size => (
                                            <button key={size} onClick={() => setSelectedItem({...selectedItem, currentSize: size})}
                                                className={`py-4 rounded-2xl font-bold border-2 transition-all ${selectedItem.currentSize === size ? 'border-orange-500 bg-orange-50 text-orange-600' : 'border-slate-100 text-slate-400'}`}>
                                                {size}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        {TOPPINGS.map(t => {
                                            const isSelected = (selectedItem.selectedToppings || []).find(st => st.name === t.name);
                                            return (
                                                <button key={t.name} onClick={() => {
                                                    const current = selectedItem.selectedToppings || [];
                                                    const next = isSelected ? current.filter(st => st.name !== t.name) : [...current, t];
                                                    setSelectedItem({...selectedItem, selectedToppings: next});
                                                }} className={`p-3 rounded-xl text-sm border-2 transition-all ${isSelected ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-slate-50 text-slate-500'}`}>
                                                    {t.name} (+{t.price})
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                                <div className="p-6 bg-slate-50">
                                    <button onClick={() => {
                                        const toppingTotal = (selectedItem.selectedToppings || []).reduce((s,t)=>s+t.price,0);
                                        const sizePrice = selectedItem.currentSize === 'M' ? selectedItem.price + 5 : selectedItem.currentSize === 'L' ? selectedItem.price + 10 : selectedItem.price;
                                        setCart([...cart, {...selectedItem, cartId: Date.now(), size: selectedItem.currentSize, price: sizePrice + toppingTotal}]);
                                        setSelectedItem(null);
                                    }} className="w-full luecha-orange text-white py-5 rounded-[1.5rem] font-bold text-xl active-scale">เพิ่มลงตะกร้า</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
