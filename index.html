<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lue cha POS | เลื่องชื่อลือชา</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .active-scale:active { transform: scale(0.95); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 1. Database Configuration (Architect View) ---
        const db = new Dexie("LueChaPOS_DB");
        db.version(2).stores({
            menu: "id, name, price, category, stock",
            orders: "++id, total, timestamp, status, staff, paymentMethod",
            staff: "id, name, pin, role"
        });

        // Initial Data
        const DEFAULT_MENU = [
            { id: 1, name: "ชาไทยเลื่องชื่อ", price: 65, category: "เครื่องดื่ม", stock: 100 },
            { id: 2, name: "ชาเขียวลือชา", price: 65, category: "เครื่องดื่ม", stock: 100 },
            { id: 3, name: "กาแฟสกัดเย็น", price: 85, category: "เครื่องดื่ม", stock: 50 },
            { id: 4, name: "โกโก้พรีเมียม", price: 70, category: "เครื่องดื่ม", stock: 80 },
            { id: 5, name: "ขนมปังปิ้งเนยนม", price: 45, category: "ของหวาน", stock: 30 }
        ];

        const DEFAULT_STAFF = [
            { id: 1, name: "Admin", pin: "1234", role: "owner" },
            { id: 2, name: "Staff A", pin: "0000", role: "staff" }
        ];

        // --- 2. Main Application Component ---
        function App() {
            const [view, setView] = useState('login'); // login, pos, admin
            const [user, setUser] = useState(null);
            const [cart, setCart] = useState([]);
            const [menu, setMenu] = useState([]);
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [showPayment, setShowPayment] = useState(false);
            const [orders, setOrders] = useState([]);

            useEffect(() => {
                const initDB = async () => {
                    if (await db.menu.count() === 0) await db.menu.bulkAdd(DEFAULT_MENU);
                    if (await db.staff.count() === 0) await db.staff.bulkAdd(DEFAULT_STAFF);
                    refreshData();
                };
                initDB();
                window.addEventListener('online', () => setIsOnline(true));
                window.addEventListener('offline', () => setIsOnline(false));
            }, []);

            const refreshData = async () => {
                setMenu(await db.menu.toArray());
                setOrders(await db.orders.toArray());
            };

            // --- Logic: Authentication ---
            const handleLogin = async (pin) => {
                const staff = await db.staff.where("pin").equals(pin).first();
                if (staff) {
                    setUser(staff);
                    setView('pos');
                } else {
                    alert("PIN ไม่ถูกต้อง");
                }
            };

            // --- Logic: POS Operations ---
            const addToCart = (item) => {
                if (item.stock <= 0) return alert("สินค้าหมด!");
                setCart([...cart, { ...item, cartId: Date.now() }]);
            };

            const removeFromCart = (cartId) => {
                setCart(cart.filter(i => i.cartId !== cartId));
            };

            const total = useMemo(() => cart.reduce((sum, i) => sum + i.price, 0), [cart]);

            const processPayment = async (method) => {
                const newOrder = {
                    items: cart,
                    total: total,
                    timestamp: new Date(),
                    status: "completed",
                    staff: user.name,
                    paymentMethod: method
                };

                await db.orders.add(newOrder);
                
                // Update Stock
                for (const item of cart) {
                    await db.menu.where("id").equals(item.id).modify(i => i.stock -= 1);
                }

                setCart([]);
                setShowPayment(false);
                refreshData();
                
                // Voice Feedback (MuayMoney Style)
                const msg = new SpeechSynthesisUtterance(`ชำระเงินสำเร็จ ยอดรวม ${total} บาท`);
                msg.lang = 'th-TH';
                window.speechSynthesis.speak(msg);
            };

            // --- UI: Login Screen ---
            if (view === 'login') return (
                <div className="h-screen flex items-center justify-center bg-slate-900 p-6">
                    <div className="w-full max-w-sm text-center">
                        <h1 className="text-4xl font-bold text-white mb-8">Lue cha POS</h1>
                        <div className="grid grid-cols-3 gap-4">
                            {[1,2,3,4,5,6,7,8,9,'C',0,'OK'].map(num => (
                                <button key={num} 
                                    onClick={() => {
                                        if(num === 'OK') handleLogin(document.getElementById('pin').value);
                                        else if(num === 'C') document.getElementById('pin').value = '';
                                        else document.getElementById('pin').value += num;
                                    }}
                                    className="h-20 bg-slate-800 text-white text-2xl rounded-2xl active-scale border border-slate-700">
                                    {num}
                                </button>
                            ))}
                        </div>
                        <input id="pin" type="password" disabled className="mt-6 bg-transparent text-white text-center text-3xl tracking-widest w-full" placeholder="••••" />
                    </div>
                </div>
            );

            // --- UI: POS Screen ---
            return (
                <div className="h-screen flex flex-col overflow-hidden">
                    {/* Top Bar */}
                    <header className={`p-4 flex justify-between items-center text-white shadow-lg ${isOnline ? 'bg-emerald-600' : 'bg-amber-600'}`}>
                        <div className="flex items-center gap-3">
                            <span className="font-bold text-lg">🍵 Lue cha</span>
                            <span className="text-xs bg-white/20 px-2 py-1 rounded-full">{user.name} ({user.role})</span>
                        </div>
                        <div className="flex gap-4 items-center">
                            <button onClick={() => setView(view === 'admin' ? 'pos' : 'admin')} className="text-sm underline">
                                {view === 'admin' ? 'กลับหน้าขาย' : 'รายงาน'}
                            </button>
                            <button onClick={() => setView('login')} className="text-sm bg-red-500 px-3 py-1 rounded-lg">ออก</button>
                        </div>
                    </header>

                    {view === 'pos' ? (
                        <div className="flex-1 flex overflow-hidden">
                            {/* Menu Grid */}
                            <div className="flex-1 p-4 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 overflow-y-auto no-scrollbar bg-slate-100">
                                {menu.map(item => (
                                    <button key={item.id} onClick={() => addToCart(item)}
                                        className="bg-white p-4 rounded-3xl shadow-sm flex flex-col items-center justify-center relative active-scale border-2 border-transparent hover:border-emerald-500 transition-all h-40">
                                        <span className="text-slate-800 font-semibold text-lg">{item.name}</span>
                                        <span className="text-emerald-600 font-bold text-xl">{item.price}฿</span>
                                        <span className={`text-[10px] mt-2 ${item.stock < 10 ? 'text-red-500 font-bold' : 'text-slate-400'}`}>คงเหลือ: {item.stock}</span>
                                    </button>
                                ))}
                            </div>

                            {/* Cart Sidebar */}
                            <div className="w-80 md:w-96 bg-white shadow-2xl flex flex-col">
                                <div className="p-4 border-b flex justify-between items-center">
                                    <span className="font-bold text-slate-700 text-lg">รายการสั่งซื้อ</span>
                                    <span className="bg-slate-100 px-3 py-1 rounded-full text-sm">{cart.length} รายการ</span>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {cart.map(item => (
                                        <div key={item.cartId} onClick={() => removeFromCart(item.cartId)} className="flex justify-between items-center animate-in fade-in slide-in-from-right-4">
                                            <div className="flex flex-col">
                                                <span className="text-slate-700 font-medium">{item.name}</span>
                                                <span className="text-xs text-slate-400">แตะเพื่อลบ</span>
                                            </div>
                                            <span className="font-bold text-slate-700">{item.price}฿</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-6 bg-slate-50 border-t space-y-4">
                                    <div className="flex justify-between text-2xl font-bold text-slate-800">
                                        <span>รวมทั้งสิ้น</span>
                                        <span className="text-emerald-600">{total.toLocaleString()}฿</span>
                                    </div>
                                    <button onClick={() => setShowPayment(true)} disabled={cart.length === 0}
                                        className="w-full bg-emerald-600 text-white py-5 rounded-3xl font-bold text-xl shadow-lg shadow-emerald-200 active-scale disabled:bg-slate-300 disabled:shadow-none transition-all">
                                        ชำระเงิน
                                    </button>
                                </div>
                            </div>
                        </div>
                    ) : (
                        /* Admin/Report View */
                        <div className="flex-1 p-6 overflow-y-auto bg-white">
                            <h2 className="text-2xl font-bold mb-6">รายงานยอดขายวันนี้</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                <div className="bg-emerald-50 p-6 rounded-3xl border border-emerald-100">
                                    <p className="text-emerald-600 text-sm">ยอดขายรวม</p>
                                    <p className="text-3xl font-bold text-emerald-700">{orders.reduce((sum, o) => sum + o.total, 0).toLocaleString()}฿</p>
                                </div>
                                <div className="bg-blue-50 p-6 rounded-3xl border border-blue-100">
                                    <p className="text-blue-600 text-sm">จำนวนออเดอร์</p>
                                    <p className="text-3xl font-bold text-blue-700">{orders.length}</p>
                                </div>
                                <div className="bg-amber-50 p-6 rounded-3xl border border-amber-100">
                                    <p className="text-amber-600 text-sm">เงินสดที่ต้องมี (No Drawer)</p>
                                    <p className="text-3xl font-bold text-amber-700">{orders.filter(o => o.paymentMethod === 'cash').reduce((sum, o) => sum + o.total, 0).toLocaleString()}฿</p>
                                </div>
                            </div>
                            <table className="w-full text-left">
                                <thead>
                                    <tr className="text-slate-400 border-b text-sm">
                                        <th className="pb-4">เวลา</th>
                                        <th className="pb-4">รายการ</th>
                                        <th className="pb-4 text-right">ยอดรวม</th>
                                        <th className="pb-4 text-right">วิธีจ่าย</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {orders.slice().reverse().map(order => (
                                        <tr key={order.id} className="border-b">
                                            <td className="py-4 text-sm text-slate-500">{new Date(order.timestamp).toLocaleTimeString()}</td>
                                            <td className="py-4 text-sm font-medium">{order.items.length} รายการ</td>
                                            <td className="py-4 text-right font-bold">{order.total}฿</td>
                                            <td className="py-4 text-right uppercase text-xs font-bold text-slate-400">{order.paymentMethod}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* Payment Modal */}
                    {showPayment && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-md rounded-[40px] p-8 animate-in zoom-in-95 duration-200">
                                <div className="text-center mb-8">
                                    <p className="text-slate-400 mb-1">ยอดชำระทั้งหมด</p>
                                    <h2 className="text-5xl font-black text-slate-800">{total.toLocaleString()}฿</h2>
                                </div>
                                
                                <div className="grid grid-cols-1 gap-4">
                                    <button onClick={() => processPayment('qr')} className="flex items-center justify-between bg-blue-50 p-6 rounded-3xl border-2 border-blue-100 active-scale">
                                        <div className="text-left">
                                            <p className="font-bold text-blue-700 text-lg">Thai QR Payment</p>
                                            <p className="text-blue-500 text-xs">สแกนจ่ายผ่าน Mobile Banking</p>
                                        </div>
                                        <span className="text-3xl">📱</span>
                                    </button>
                                    
                                    <button onClick={() => processPayment('cash')} className="flex items-center justify-between bg-amber-50 p-6 rounded-3xl border-2 border-amber-100 active-scale">
                                        <div className="text-left">
                                            <p className="font-bold text-amber-700 text-lg">เงินสด (Cash)</p>
                                            <p className="text-amber-500 text-xs">พนักงานรับเงินสดเข้ากระเป๋า</p>
                                        </div>
                                        <span className="text-3xl">💵</span>
                                    </button>
                                </div>

                                <button onClick={() => setShowPayment(false)} className="w-full mt-8 text-slate-400 font-medium py-2">ยกเลิก</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
