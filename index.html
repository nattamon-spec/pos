<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลื่องชื่อลือชา POS | ร่างทอง 100% (Full System)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #fdfbf7; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        .active-nav { background: #78350f; color: white; box-shadow: 0 10px 15px -3px rgba(120, 53, 15, 0.3); }
        .report-card { transition: all 0.3s ease; cursor: pointer; border: 1px solid #fef3c7; }
        .report-card:hover { transform: translateY(-5px); border-color: #fbbf24; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .status-badge { @apply px-3 py-1 rounded-full text-[10px] font-bold uppercase; }
    </style>
</head>
<body class="text-slate-800">
<div id="app" class="flex h-screen overflow-hidden">
code
Code
</div>
<script>
const { createApp, ref, computed, onMounted, watch } = Vue;

createApp({
    setup() {
        const currentTab = ref('pos');
        const invSubTab = ref('items');
        const reportTimeRange = ref('วันนี้');
        const reportDetail = ref(null);
        const reportDetailTitle = ref('');

        // DATA STATES
        const products = ref([
            { id: 1, name: 'ชาไทยเลื่องชื่อ', sku: 'TH-TEA-01', price: 45, cost: 12, category: 'เมนูชา', stock: 49, minStock: 10, trackStock: true, image: 'https://images.unsplash.com/photo-1594631252845-29fc4cc8cde9?w=400' },
            { id: 2, name: 'กาแฟลือชา', sku: 'CF-SIG-02', price: 60, cost: 15, category: 'เมนูกาแฟ', stock: 20, minStock: 5, trackStock: true, image: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400' }
        ]);
        const stockMovements = ref([]);
        const orders = ref([]);
        const expenses = ref([]);
        const categories = ref(['ทั้งหมด', 'เมนูชา', 'เมนูกาแฟ', 'นมสด', 'โซดา']);

        // UI STATES
        const searchQuery = ref('');
        const cart = ref([]);
        const showProductModal = ref(false);
        const showAdjustModal = ref(false);
        const showPayment = ref(false);
        const showExpenseModal = ref(false);
        const editMode = ref(false);
        const selectedProduct = ref(null);
        
        // FORM STATES
        const formProduct = ref({ name: '', sku: '', price: 0, cost: 0, category: 'เมนูชา', stock: 0, minStock: 5, trackStock: true, image: '' });
        const adjustType = ref('Receive');
        const adjustQty = ref(null);
        const cashReceived = ref(null);

        // REPORT MODULES CONFIG
        const reportModules = [
            { id: 'sales', title: 'ยอดขาย', desc: 'ยอดสด/โอน · ยอดเฉลี่ย · รายชั่วโมง', icon: 'trending-up', color: 'bg-amber-50 text-amber-600' },
            { id: 'payment', title: 'ช่องทางชำระ', desc: 'เงินสด vs เงินโอน', icon: 'credit-card', color: 'bg-blue-50 text-blue-600' },
            { id: 'profit', title: 'ต้นทุน & กำไร', desc: 'Margin และกำไรสุทธิ', icon: 'pie-chart', color: 'bg-green-50 text-green-600' },
            { id: 'delivery', title: 'ยอดขายเดลิเวอรี่', desc: 'Grab, LINE MAN หลังหัก GP', icon: 'bike', color: 'bg-orange-50 text-orange-600' },
            { id: 'expenses', title: 'รายจ่าย', desc: 'ค่าเช่า, ค่าน้ำ, ค่าไฟ, ค่าแรง', icon: 'receipt', color: 'bg-red-50 text-red-600' },
            { id: 'breakeven', title: 'จุดคุ้มทุน', desc: 'ต้องขายเท่าไรถึงจะพอจ่าย', icon: 'target', color: 'bg-indigo-50 text-indigo-600' },
            { id: 'vat', title: 'ภาษี VAT 7%', desc: 'ฐานก่อนภาษี และ VAT', icon: 'percent', color: 'bg-slate-50 text-slate-600' },
            { id: 'bestseller', title: 'สินค้าขายดี', desc: 'อันดับตามจำนวนหรือยอดขาย', icon: 'award', color: 'bg-purple-50 text-purple-600' },
            { id: 'trends', title: 'แนวโน้ม', desc: 'เปรียบเทียบช่วงเวลาก่อนหน้า', icon: 'line-chart', color: 'bg-pink-50 text-pink-600' },
            { id: 'staff', title: 'ยอดขายตามพนักงาน', desc: 'แยกยอดและจำนวนบิลต่อคน', icon: 'users', color: 'bg-cyan-50 text-cyan-600' },
            { id: 'bills', title: 'รายการบิล / ใบเสร็จ', desc: 'ค้นหาและดูใบเสร็จย้อนหลัง', icon: 'file-text', color: 'bg-slate-100 text-slate-800' },
            { id: 'summary', title: 'สรุปยอดขายทั้งหมด', desc: 'ภาพรวมร้านในช่วงเวลาที่เลือก', icon: 'layout', color: 'bg-amber-100 text-amber-900' }
        ];

        // PERSISTENCE
        onMounted(() => {
            const keys = ['products', 'movements', 'orders', 'expenses', 'categories'];
            keys.forEach(k => {
                const saved = localStorage.getItem(`lc_${k}`);
                if (saved) window[k === 'products' ? 'products' : k === 'movements' ? 'stockMovements' : k].value = JSON.parse(saved);
            });
            lucide.createIcons();
        });

        watch([products, stockMovements, orders, expenses], () => {
            localStorage.setItem('lc_products', JSON.stringify(products.value));
            localStorage.setItem('lc_movements', JSON.stringify(stockMovements.value));
            localStorage.setItem('lc_orders', JSON.stringify(orders.value));
            localStorage.setItem('lc_expenses', JSON.stringify(expenses.value));
            setTimeout(() => lucide.createIcons(), 10);
        }, { deep: true });

        // COMPUTED STATS
        const invStats = computed(() => {
            const tracking = products.value.filter(p => p.trackStock);
            return {
                totalSKU: products.value.length,
                trackingCount: tracking.length,
                lowStockCount: tracking.filter(p => p.stock <= p.minStock && p.stock > 0).length,
                outOfStockCount: tracking.filter(p => p.stock <= 0).length,
                totalRemaining: tracking.reduce((sum, p) => sum + p.stock, 0),
                inventoryValue: tracking.reduce((sum, p) => sum + (p.stock * p.cost), 0)
            };
        });

        const stats = computed(() => {
            const totalSales = orders.value.reduce((sum, o) => sum + o.total, 0);
            const totalCost = orders.value.reduce((sum, o) => sum + o.items.reduce((s, i) => s + (i.cost * i.qty), 0), 0);
            const totalExp = expenses.value.reduce((sum, e) => sum + e.amount, 0);
            return {
                totalSales,
                totalBills: orders.value.length,
                netProfit: totalSales - totalCost - totalExp,
                breakEven: 15 // Mock
            };
        });

        const bestSellers = computed(() => {
            const map = {};
            orders.value.forEach(o => o.items.forEach(i => {
                if (!map[i.name]) map[i.name] = { name: i.name, qty: 0, sales: 0 };
                map[i.name].qty += i.qty;
                map[i.name].sales += i.totalPrice * i.qty;
            }));
            return Object.values(map).sort((a, b) => b.qty - a.qty).slice(0, 5);
        });

        // LOGIC FUNCTIONS
        const getProductName = (id) => products.value.find(p => p.id === id)?.name || 'Unknown';

        const logMovement = (productId, type, change, before, after) => {
            stockMovements.value.unshift({ id: Date.now(), productId, type, change, before, after, date: new Date().toLocaleString(), user: 'Admin' });
        };

        const filteredProducts = computed(() => products.value.filter(p => p.name.includes(searchQuery.value)));

        const selectProduct = (p) => {
            if (p.trackStock && p.stock <= 0) return alert('สินค้าหมดสต็อก!');
            const item = cart.value.find(i => i.id === p.id);
            if (item) item.qty++; else cart.value.push({ ...p, qty: 1, totalPrice: p.price });
        };

        const updateCartQty = (idx, delta) => {
            const item = cart.value[idx];
            const p = products.value.find(prod => prod.id === item.id);
            if (delta > 0 && p.trackStock && item.qty + 1 > p.stock) return alert('สต็อกไม่พอ!');
            item.qty += delta;
            if (item.qty <= 0) cart.value.splice(idx, 1);
        };

        const cartTotal = computed(() => cart.value.reduce((sum, i) => sum + (i.totalPrice * i.qty), 0));

        const completeSale = () => {
            cart.value.forEach(item => {
                const p = products.value.find(prod => prod.id === item.id);
                if (p && p.trackStock) {
                    const before = p.stock;
                    p.stock -= item.qty;
                    logMovement(p.id, 'Sale', -item.qty, before, p.stock);
                }
            });
            orders.value.unshift({ id: Date.now(), items: [...cart.value], total: cartTotal.value, date: new Date().toLocaleString() });
            cart.value = []; showPayment.value = false; cashReceived.value = null;
            alert('ขายสำเร็จ!');
        };

        const openProductModal = (p = null) => {
            if (p) { editMode.value = true; formProduct.value = { ...p }; }
            else { editMode.value = false; formProduct.value = { id: Date.now(), name: '', sku: '', price: 0, cost: 0, category: 'เมนูชา', stock: 0, minStock: 5, trackStock: true, image: '' }; }
            showProductModal.value = true;
        };

        const saveProduct = () => {
            if (editMode.value) { const idx = products.value.findIndex(p => p.id === formProduct.value.id); products.value[idx] = { ...formProduct.value }; }
            else products.value.push({ ...formProduct.value });
            showProductModal.value = false;
        };

        const openAdjustModal = (p) => { selectedProduct.value = p; adjustQty.value = null; showAdjustModal.value = true; };

        const confirmAdjustment = () => {
            const p = products.value.find(prod => prod.id === selectedProduct.value.id);
            const before = p.stock;
            const change = adjustType.value === 'Receive' ? adjustQty.value : -adjustQty.value;
            p.stock += change;
            logMovement(p.id, adjustType.value, change, before, p.stock);
            showAdjustModal.value = false;
        };

        const openReportDetail = (id) => {
            reportDetail.value = id;
            reportDetailTitle.value = reportModules.find(m => m.id === id).title;
        };

        return {
            currentTab, invSubTab, reportTimeRange, reportDetail, reportDetailTitle, reportModules,
            products, stockMovements, orders, expenses, categories, invStats, stats, bestSellers,
            searchQuery, cart, cartTotal, updateCartQty, selectProduct, completeSale,
            showProductModal, showAdjustModal, showPayment, showExpenseModal, editMode, formProduct,
            selectedProduct, adjustType, adjustQty, openProductModal, saveProduct, openAdjustModal, confirmAdjustment,
            openReportDetail, getProductName
        };
    }
}).mount('#app');
</script>
</body>
</html>
