<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เลื่องชื่อลือชา POS | Management System</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .sidebar-active { background: #4f46e5; color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .card-hover:hover { transform: translateY(-2px); transition: all 0.2s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- INITIAL DATA (Default if LocalStorage is empty) ---
        const DEFAULT_CATEGORIES = ["ชา", "โกโก้", "นมสด", "โซดา"];
        const DEFAULT_PRODUCTS = [
            { id: 1, name: 'ชาไทย', price: 45, category: 'ชา', image: '🥤', status: 'active' },
            { id: 2, name: 'โกโก้', price: 50, category: 'โกโก้', image: '🍫', status: 'active' }
        ];
        const DEFAULT_MODIFIERS = [
            { id: 1, name: 'ไข่มุก', price: 10, type: 'topping' },
            { id: 2, name: 'ครีมชีส', price: 20, type: 'topping' },
            { id: 3, name: 'หวาน 50%', price: 0, type: 'sweetness' }
        ];

        function App() {
            // --- CORE STATES ---
            const [view, setView] = useState('pos'); // pos, management, reports
            const [categories, setCategories] = useState(() => JSON.parse(localStorage.getItem('mm_cats')) || DEFAULT_CATEGORIES);
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('mm_prods')) || DEFAULT_PRODUCTS);
            const [modifiers, setModifiers] = useState(() => JSON.parse(localStorage.getItem('mm_mods')) || DEFAULT_MODIFIERS);
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('mm_orders')) || []);
            
            // --- POS STATES ---
            const [cart, setCart] = useState([]);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [activeCat, setActiveCat] = useState("ทั้งหมด");

            // --- MANAGEMENT STATES ---
            const [mgmtTab, setMgmtTab] = useState('products'); // products, categories, modifiers

            // Persistence
            useEffect(() => {
                localStorage.setItem('mm_cats', JSON.stringify(categories));
                localStorage.setItem('mm_prods', JSON.stringify(products));
                localStorage.setItem('mm_mods', JSON.stringify(modifiers));
                localStorage.setItem('mm_orders', JSON.stringify(orders));
                if (window.lucide) lucide.createIcons();
            }, [categories, products, modifiers, orders, view, mgmtTab]);

            // --- POS LOGIC ---
            const addToCart = (prod, config) => {
                const item = {
                    ...prod,
                    ...config,
                    tempId: Date.now(),
                    totalPrice: prod.price + config.extraPrice
                };
                setCart([...cart, item]);
                setSelectedProduct(null);
            };

            // --- MANAGEMENT LOGIC ---
            const addProduct = () => {
                const name = prompt("ชื่อสินค้า:");
                const price = prompt("ราคาเริ่มต้น:");
                const cat = prompt("หมวดหมู่ (" + categories.join("/") + "):");
                if (name && price && cat) {
                    setProducts([...products, { id: Date.now(), name, price: parseFloat(price), category: cat, image: '🥤', status: 'active' }]);
                }
            };

            const deleteProduct = (id) => {
                if(confirm('ยืนยันการลบสินค้า?')) setProducts(products.filter(p => p.id !== id));
            };

            // --- UI COMPONENTS ---

            const Sidebar = () => (
                <div className="w-20 md:w-64 bg-white h-screen border-r flex flex-col p-4 space-y-2 z-20">
                    <div className="flex items-center space-x-3 px-2 mb-8">
                        <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black">ล</div>
                        <span className="hidden md:block font-bold text-xl tracking-tight">เลื่องชื่อลือชา</span>
                    </div>
                    <button onClick={() => setView('pos')} className={`flex items-center space-x-3 p-3 rounded-xl transition-all ${view === 'pos' ? 'sidebar-active' : 'text-slate-400 hover:bg-slate-50'}`}>
                        <i data-lucide="layout-grid"></i>
                        <span className="hidden md:block font-medium">หน้าขาย POS</span>
                    </button>
                    <button onClick={() => setView('management')} className={`flex items-center space-x-3 p-3 rounded-xl transition-all ${view === 'management' ? 'sidebar-active' : 'text-slate-400 hover:bg-slate-50'}`}>
                        <i data-lucide="settings-2"></i>
                        <span className="hidden md:block font-medium">จัดการระบบ</span>
                    </button>
                    <button onClick={() => setView('reports')} className={`flex items-center space-x-3 p-3 rounded-xl transition-all ${view === 'reports' ? 'sidebar-active' : 'text-slate-400 hover:bg-slate-50'}`}>
                        <i data-lucide="bar-chart-3"></i>
                        <span className="hidden md:block font-medium">รายงาน</span>
                    </button>
                </div>
            );

            // --- MANAGEMENT VIEW ---
            const ManagementView = () => (
                <div className="flex-1 flex flex-col h-screen overflow-hidden">
                    <div className="p-8 border-b bg-white">
                        <h2 className="text-3xl font-bold mb-6">ศูนย์จัดการระบบ (Back-office)</h2>
                        <div className="flex space-x-6">
                            {['products', 'categories', 'modifiers'].map(t => (
                                <button 
                                    key={t} onClick={() => setMgmtTab(t)}
                                    className={`pb-2 px-1 font-bold capitalize transition-all ${mgmtTab === t ? 'border-b-4 border-indigo-600 text-indigo-600' : 'text-slate-400'}`}
                                >
                                    {t === 'products' ? 'สินค้า' : t === 'categories' ? 'หมวดหมู่' : 'ตัวเลือกเสริม'}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 p-8 overflow-y-auto no-scrollbar">
                        {mgmtTab === 'products' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-xl font-bold text-slate-600">รายการสินค้าทั้งหมด</h3>
                                    <button onClick={addProduct} className="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold flex items-center">
                                        <i data-lucide="plus" className="mr-2 w-4 h-4"></i> เพิ่มสินค้า
                                    </button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {products.map(p => (
                                        <div key={p.id} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                                            <div className="flex items-center space-x-4">
                                                <div className="text-3xl">{p.image}</div>
                                                <div>
                                                    <div className="font-bold text-slate-800">{p.name}</div>
                                                    <div className="text-sm text-slate-400">{p.category} • ฿{p.price}</div>
                                                </div>
                                            </div>
                                            <div className="flex space-x-2">
                                                <button onClick={() => deleteProduct(p.id)} className="p-2 text-red-400 hover:bg-red-50 rounded-lg"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {mgmtTab === 'categories' && (
                            <div className="max-w-md space-y-6">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-xl font-bold text-slate-600">หมวดหมู่</h3>
                                    <button onClick={() => {
                                        const n = prompt("ชื่อหมวดหมู่ใหม่:");
                                        if(n) setCategories([...categories, n]);
                                    }} className="text-indigo-600 font-bold">+ เพิ่ม</button>
                                </div>
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 divide-y">
                                    {categories.map(c => (
                                        <div key={c} className="p-4 flex justify-between items-center">
                                            <span className="font-medium">{c}</span>
                                            <button onClick={() => setCategories(categories.filter(x => x !== c))} className="text-slate-300 hover:text-red-500"><i data-lucide="x" className="w-4 h-4"></i></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {mgmtTab === 'modifiers' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-xl font-bold text-slate-600">ตัวเลือกเสริม (Toppings/Sweetness)</h3>
                                    <button onClick={() => {
                                        const name = prompt("ชื่อตัวเลือก:");
                                        const price = prompt("ราคาบวกเพิ่ม:");
                                        if(name && price) setModifiers([...modifiers, { id: Date.now(), name, price: parseFloat(price), type: 'topping' }]);
                                    }} className="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold">เพิ่มตัวเลือก</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {modifiers.map(m => (
                                        <div key={m.id} className="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center">
                                            <div>
                                                <div className="font-bold">{m.name}</div>
                                                <div className="text-xs text-indigo-600">+ ฿{m.price}</div>
                                            </div>
                                            <button onClick={() => setModifiers(modifiers.filter(x => x.id !== m.id))} className="text-slate-300 hover:text-red-500"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );

            // --- POS VIEW ---
            const POSView = () => (
                <div className="flex-1 flex flex-col md:flex-row h-screen overflow-hidden">
                    {/* Left: Products */}
                    <div className="flex-1 flex flex-col p-6 overflow-y-auto no-scrollbar">
                        <div className="flex space-x-3 mb-8 overflow-x-auto no-scrollbar pb-2">
                            <button 
                                onClick={() => setActiveCat("ทั้งหมด")}
                                className={`px-6 py-2 rounded-full font-bold transition-all whitespace-nowrap ${activeCat === "ทั้งหมด" ? 'bg-indigo-600 text-white shadow-lg' : 'bg-white text-slate-400'}`}
                            >ทั้งหมด</button>
                            {categories.map(c => (
                                <button 
                                    key={c} onClick={() => setActiveCat(c)}
                                    className={`px-6 py-2 rounded-full font-bold transition-all whitespace-nowrap ${activeCat === c ? 'bg-indigo-600 text-white shadow-lg' : 'bg-white text-slate-400'}`}
                                >{c}</button>
                            ))}
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6">
                            {products.filter(p => activeCat === "ทั้งหมด" || p.category === activeCat).map(p => (
                                <div 
                                    key={p.id} onClick={() => setSelectedProduct(p)}
                                    className="bg-white p-6 rounded-[2.5rem] shadow-sm card-hover cursor-pointer flex flex-col items-center text-center border border-transparent hover:border-indigo-200"
                                >
                                    <div className="text-5xl mb-4">{p.image}</div>
                                    <h3 className="font-bold text-slate-800">{p.name}</h3>
                                    <p className="text-indigo-600 font-black mt-1">฿{p.price}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Right: Cart */}
                    <div className="w-full md:w-96 bg-white border-l shadow-2xl flex flex-col">
                        <div className="p-6 border-b flex justify-between items-center">
                            <h3 className="font-bold text-xl">ตะกร้าสินค้า</h3>
                            <span className="bg-indigo-100 text-indigo-600 px-3 py-1 rounded-full text-xs font-bold">{cart.length} รายการ</span>
                        </div>
                        <div className="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar">
                            {cart.map(item => (
                                <div key={item.tempId} className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl">
                                    <div>
                                        <div className="font-bold text-sm">{item.name}</div>
                                        <div className="text-[10px] text-slate-400 uppercase tracking-widest">{item.mods.join(', ') || 'ปกติ'}</div>
                                    </div>
                                    <div className="text-right">
                                        <div className="font-bold text-indigo-600">฿{item.totalPrice}</div>
                                        <button onClick={() => setCart(cart.filter(c => c.tempId !== item.tempId))} className="text-red-300 text-[10px] font-bold hover:text-red-500">ลบ</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="p-8 bg-slate-50 border-t space-y-6">
                            <div className="flex justify-between items-end">
                                <span className="text-slate-400 font-medium">ยอดรวมสุทธิ</span>
                                <span className="text-4xl font-black text-slate-800">฿{cart.reduce((s,i) => s + i.totalPrice, 0)}</span>
                            </div>
                            <button className="w-full py-5 bg-indigo-600 text-white rounded-3xl font-bold text-xl shadow-xl shadow-indigo-200 hover:bg-indigo-700 transition-all">ชำระเงิน</button>
                        </div>
                    </div>
                </div>
            );

            // --- MODIFIER MODAL ---
            const ModifierModal = () => {
                if(!selectedProduct) return null;
                const [selectedMods, setSelectedMods] = useState([]);
                const extraPrice = selectedMods.reduce((s, m) => s + m.price, 0);

                return (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-50">
                        <div className="bg-white w-full max-w-lg rounded-[3rem] overflow-hidden shadow-2xl animate-pop">
                            <div className="p-8 border-b flex justify-between items-center">
                                <div>
                                    <h3 className="text-2xl font-bold text-slate-800">{selectedProduct.name}</h3>
                                    <p className="text-slate-400 text-sm">เลือกตัวเลือกเสริม</p>
                                </div>
                                <button onClick={() => setSelectedProduct(null)} className="text-slate-300 hover:text-slate-600"><i data-lucide="x"></i></button>
                            </div>
                            <div className="p-8 space-y-6 max-h-[50vh] overflow-y-auto no-scrollbar">
                                <div className="grid grid-cols-2 gap-4">
                                    {modifiers.map(m => (
                                        <button 
                                            key={m.id}
                                            onClick={() => {
                                                if(selectedMods.find(x => x.id === m.id)) setSelectedMods(selectedMods.filter(x => x.id !== m.id));
                                                else setSelectedMods([...selectedMods, m]);
                                            }}
                                            className={`p-4 rounded-2xl border-2 text-left transition-all ${selectedMods.find(x => x.id === m.id) ? 'border-indigo-600 bg-indigo-50' : 'border-slate-100'}`}
                                        >
                                            <div className={`font-bold ${selectedMods.find(x => x.id === m.id) ? 'text-indigo-600' : 'text-slate-600'}`}>{m.name}</div>
                                            <div className="text-xs text-slate-400">+ ฿{m.price}</div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div className="p-8 bg-slate-50 flex items-center justify-between">
                                <div>
                                    <div className="text-xs text-slate-400">ราคารวม</div>
                                    <div className="text-2xl font-black text-indigo-600">฿{selectedProduct.price + extraPrice}</div>
                                </div>
                                <button 
                                    onClick={() => addToCart(selectedProduct, { mods: selectedMods.map(m => m.name), extraPrice })}
                                    className="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold shadow-lg shadow-indigo-200"
                                >เพิ่มลงตะกร้า</button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    <Sidebar />
                    <div className="flex-1 flex flex-col bg-slate-50">
                        {view === 'pos' && <POSView />}
                        {view === 'management' && <ManagementView />}
                        {view === 'reports' && <div className="p-20 text-center text-slate-300">ระบบรายงานกำลังพัฒนา...</div>}
                    </div>
                    <ModifierModal />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
