<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เลื่องชื่อลือชา POS Pro</title>
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background: #f3f4f6; overflow-x: hidden; }
        .tab-active { color: #ef4444 !important; }
        .tab-active svg { fill: #ef4444; }
        .btn-tap:active { transform: scale(0.95); transition: 0.1s; }
        input, button { outline: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 pb-20">

    <!-- HEADER -->
    <header class="bg-white p-4 flex justify-between items-center shadow-sm sticky top-0 z-40">
        <h1 class="text-xl font-bold text-red-600 italic">เลื่องชื่อลือชา <span class="text-[10px] text-gray-400 font-normal">POS</span></h1>
        <div id="db-status" class="text-[10px] bg-gray-100 px-2 py-1 rounded-full font-bold">Connecting...</div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <div id="content" class="min-h-screen">
        
        <!-- PAGE: DASHBOARD (รายงาน) -->
        <section id="page-dashboard" class="p-4 hidden animate-fade">
            <h2 class="font-bold text-lg mb-4">สรุปยอดขายวันนี้</h2>
            <div class="grid grid-cols-2 gap-3 mb-6 text-center">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                    <div class="text-[10px] text-gray-400 font-bold uppercase mb-1 tracking-widest">ยอดรวม</div>
                    <div id="stat-total" class="text-2xl font-bold text-red-600">฿0</div>
                </div>
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                    <div class="text-[10px] text-gray-400 font-bold uppercase mb-1 tracking-widest">บิล</div>
                    <div id="stat-count" class="text-2xl font-bold text-blue-600">0</div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex justify-center">
                <canvas id="salesChart" style="max-width: 250px;"></canvas>
            </div>
        </section>

        <!-- PAGE: POS (ขาย) -->
        <section id="page-pos" class="p-3 animate-fade">
            <div class="mb-4">
                <input type="text" id="search-box" oninput="renderPOS()" placeholder="🔍 ค้นหาเมนู..." class="w-full p-4 rounded-2xl bg-white shadow-sm border-none">
            </div>
            <div id="pos-categories" class="flex gap-2 overflow-x-auto pb-4 hide-scroll"></div>
            <div id="pos-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-24"></div>
        </section>

        <!-- PAGE: KITCHEN (ห้องครัว) -->
        <section id="page-kitchen" class="p-4 hidden animate-fade">
            <h2 class="font-bold text-lg mb-4">ออเดอร์รอทำ</h2>
            <div id="kitchen-list" class="space-y-4"></div>
        </section>

        <!-- PAGE: ADMIN (จัดการคลัง/สินค้า) -->
        <section id="page-admin" class="p-4 hidden animate-fade">
            <div class="bg-white p-5 rounded-3xl shadow-sm mb-6 border">
                <h3 class="font-bold mb-4">ตั้งค่า PromptPay</h3>
                <input type="text" id="pp-input" onchange="savePP()" placeholder="เบอร์โทรรับโอนเงิน" class="w-full p-3 bg-gray-50 border-none rounded-xl mb-2">
                <p class="text-[10px] text-gray-400 italic font-bold">ใช้เพื่อเจนเนอเรท QR Code ให้ลูกค้า</p>
            </div>

            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold">จัดการเมนูอาหาร</h3>
                <button onclick="openAddProduct()" class="bg-red-600 text-white px-4 py-2 rounded-xl text-xs font-bold">+ เพิ่มเมนูใหม่</button>
            </div>
            <div id="admin-product-list" class="space-y-3"></div>
        </section>
    </div>

    <!-- CART BOTTOM BAR -->
    <div id="cart-bar" class="fixed bottom-20 left-4 right-4 bg-red-600 text-white p-4 rounded-3xl shadow-2xl flex justify-between items-center hidden z-40 animate-bounce">
        <div class="flex items-center gap-3">
            <div class="bg-white/20 px-3 py-1 rounded-lg font-bold text-sm" id="cart-qty">0</div>
            <div id="cart-total" class="text-xl font-bold">฿0</div>
        </div>
        <button onclick="openPay()" class="bg-white text-red-600 px-6 py-2 rounded-2xl font-bold btn-tap">ชำระเงิน</button>
    </div>

    <!-- BOTTOM TAB NAVIGATION (เหมือน MuayMoney) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 pb-5 z-50">
        <button onclick="showPage('dashboard')" id="nav-dashboard" class="flex flex-col items-center gap-1 text-gray-400">
            <span class="text-xl">📊</span><span class="text-[10px] font-bold uppercase">Report</span>
        </button>
        <button onclick="showPage('pos')" id="nav-pos" class="flex flex-col items-center gap-1 text-gray-400 tab-active">
            <span class="text-xl">🛒</span><span class="text-[10px] font-bold uppercase">Sell</span>
        </button>
        <button onclick="showPage('kitchen')" id="nav-kitchen" class="flex flex-col items-center gap-1 text-gray-400 relative">
            <span class="text-xl">👨‍🍳</span><span class="text-[10px] font-bold uppercase">Kitchen</span>
            <span id="k-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] px-1 rounded-full hidden">0</span>
        </button>
        <button onclick="showPage('admin')" id="nav-admin" class="flex flex-col items-center gap-1 text-gray-400">
            <span class=
