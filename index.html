<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เลื่องชื่อลือชา POS</title>
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .product-card:active { transform: scale(0.95); }
        .bottom-nav-item.active { color: #4f46e5; }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- DATA DEFINITIONS ---
        const CATEGORIES = ["ทั้งหมด", "ชา", "โกโก้", "นมสด", "โซดา"];
        const PRODUCTS = [
            { id: 'p1', name: 'ชาไทย', price: 45, category: 'ชา', image: '🥤', color: 'bg-orange-100' },
            { id: 'p2', name: 'ชาเขียว', price: 45, category: 'ชา', image: '🍵', color: 'bg-green-100' },
            { id: 'p3', name: 'โกโก้', price: 50, category: 'โกโก้', image: '🍫', color: 'bg-amber-900/10' },
            { id: 'p4', name: 'นมสด', price: 40, category: 'นมสด', image: '🥛', color: 'bg-blue-50' },
            { id: 'p5', name: 'โอริโอ้ปั่น', price: 65, category: 'นมสด', image: '🍪', color: 'bg-slate-100' },
            { id: 'p6', name: 'ชาพีช', price: 55, category: 'โซดา', image: '🍑', color: 'bg-pink-50' },
        ];

        const MODIFIERS = {
            sizes: [{ label: 'S', price: 0 }, { label: 'M', price: 10 }, { label: 'L', price: 20 }],
            sweetness: ['0%', '25%', '50%', '100%'],
            toppings: [
                { label: 'วิปครีม', price: 15 }, { label: 'ครีมชีส', price: 20 },
                { label: 'ชีสขูด', price: 15 }, { label: 'ช็อคขูด', price: 10 }
            ]
        };

        const BOM_RECIPES = {
            'p1': { 'S': { 'tea': 15, 'milk': 100, 'cup': 1 }, 'M': { 'tea': 20, 'milk': 150, 'cup': 1 }, 'L': { 'tea': 25, 'milk': 200, 'cup': 1 } },
            'p2': { 'S': { 'green': 15, 'milk': 100, 'cup': 1 }, 'M': { 'green': 20, 'milk': 150, 'cup': 1 }, 'L': { 'green': 25, 'milk': 200, 'cup': 1 } },
            'p3': { 'S': { 'cocoa': 20, 'milk': 100, 'cup': 1 }, 'M': { 'cocoa': 30, 'milk': 150, 'cup': 1 }, 'L': { 'cocoa': 40, 'milk': 200, 'cup': 1 } },
        };

        const INITIAL_STOCK = [
            { id: 'tea', name: 'ผงชาไทย', stock: 1000, unit: 'g', min: 200 },
            { id: 'green', name: 'ผงชาเขียว', stock: 800, unit: 'g', min: 200 },
            { id: 'cocoa', name: 'ผงโกโก้', stock: 1200, unit: 'g', min: 300 },
            { id: 'milk', name: 'นมสด', stock: 5000, unit: 'ml', min: 1000 },
            { id: 'cup', name: 'แก้วรวม', stock: 500, unit: 'ใบ', min: 50 },
        ];

        function App() {
            const [view, setView] = useState('pos'); // pos, kds, inventory, reports
            const [mobileTab, setMobileTab] = useState('menu'); // menu, cart (สำหรับหน้าจอโทรศัพท์)
            const [cart, setCart] = useState([]);
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('mm_orders')) || []);
            const [inventory, setInventory] = useState(() => JSON.parse(localStorage.getItem('mm_stock')) || INITIAL_STOCK);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [showPayment, setShowPayment] = useState(false);
            const [cashReceived, setCashReceived] = useState("");
            const [activeCat, setActiveCat] = useState("ทั้งหมด");
            const [search, setSearch] = useState("");
            const chartRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('mm_orders', JSON.stringify(orders));
                localStorage.setItem('mm_stock', JSON.stringify(inventory));
                if (window.lucide) lucide.createIcons();
            }, [orders, inventory, view, selectedProduct, showPayment, mobileTab]);

            const subtotal = useMemo(() => cart.reduce((s, i) => s + i.totalPrice, 0), [cart]);
            const changeAmount = useMemo(() => {
                const received = parseFloat(cashReceived) || 0;
                return received >= subtotal ? received - subtotal : 0;
            }, [cashReceived, subtotal]);

            const handleAddToCart = (config) => {
                setCart([...cart, { ...config, tempId: Date.now() }]);
                setSelectedProduct(null);
            };

            const handlePayment = (method) => {
                if (method === 'CASH' && (parseFloat(cashReceived) || 0) < subtotal) {
                    alert("จำนวนเงินที่รับมาไม่เพียงพอ!");
                    return;
                }

                const newOrder = {
                    id: `ORD-${Date.now()}`,
                    items: cart,
                    total: subtotal,
                    received: method === 'CASH' ? parseFloat(cashReceived) : subtotal,
                    change: method === 'CASH' ? changeAmount : 0,
                    method,
                    status: 'PENDING',
                    timestamp: new Date().toISOString()
                };

                // ตัดสต็อก BOM
                let nextInv = [...inventory];
                cart.forEach(item => {
                    const recipe = BOM_RECIPES[item.id]?.[item.size];
                    if (recipe) {
                        Object.keys(recipe).forEach(ingId => {
                            const idx = nextInv.findIndex(i => i.id === ingId);
                            if (idx > -1) nextInv[idx].stock -= recipe[ingId];
                        });
                    }
                });

                setInventory(nextInv);
                setOrders([newOrder, ...orders]);
                setCart([]);
                setShowPayment(false);
                setCashReceived("");
                setMobileTab('menu');
                alert(`ชำระเงินสำเร็จ!\nเงินทอน: ฿${newOrder.change.toLocaleString()}`);
            };

            // --- RESPONSIVE POS VIEW ---
            const POSView = () => (
                <div className="flex-1 flex flex-col md:flex-row overflow-hidden h-full">
                    {/* Left: Product Selection (ซ่อนบนมือถือถ้าเลือกแท็บตะกร้า) */}
                    <div className={`flex-1 flex flex-col p-4 md:p-6 overflow-y-auto no-scrollbar ${mobileTab === 'cart' ? 'hidden md:flex' : 'flex'}`}>
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                            <h2 className="text-2xl font-bold text-slate-800">เลื่องชื่อลือชา POS</h2>
                            <div className="relative w-full sm:w-64">
                                <i data-lucide="search" className="absolute left-3 top-2.5 text-slate-400 w-4 h-4"></i>
                                <input 
                                    type="text" placeholder="ค้นหาเมนู..." 
                                    className="w-full pl-10 pr-4 py-2 rounded-xl border-none shadow-sm focus:ring-2 focus:ring-indigo-500 text-sm"
                                    value={search} onChange={(e) => setSearch(e.target.value)}
                                />
                            </div>
                        </div>

                        <div className="flex space-x-2 mb-6 overflow-x-auto no-scrollbar pb-2">
                            {CATEGORIES.map(c => (
                                <button 
                                    key={c} onClick={() => setActiveCat(c)}
                                    className={`px-5 py-2 rounded-full text-xs sm:text-sm font-medium transition-all whitespace-nowrap ${activeCat === c ? 'bg-indigo-600 text-white shadow-lg' : 'bg-white text-slate-600 hover:bg-slate-100'}`}
                                >{c}</button>
                            ))}
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 pb-24 md:pb-6">
                            {PRODUCTS.filter(p => (activeCat === "ทั้งหมด" || p.category === activeCat) && p.name.includes(search)).map(p => (
                                <div 
                                    key={p.id} onClick={() => setSelectedProduct(p)}
                                    className={`product-card ${p.color} p-4 sm:p-6 rounded-[2rem] shadow-sm hover:shadow-md transition-all cursor-pointer flex flex-col items-center text-center`}
                                >
                                    <div className="text-4xl sm:text-5xl mb-3">{p.image}</div>
                                    <h3 className="font-bold text-slate-800 text-sm sm:text-base truncate w-full">{p.name}</h3>
                                    <p className="text-indigo-600 font-black text-sm sm:text-base mt-1">฿{p.price}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Right: Cart Sidebar (ซ่อนบนมือถือถ้าเลือกแท็บเมนู) */}
                    <div className={`w-full md:w-96 bg-white border-l shadow-2xl flex flex-col h-full ${mobileTab === 'menu' ? 'hidden md:flex' : 'flex'}`}>
                        <div className="p-6 border-b flex justify-between items-center bg-slate-50/50">
                            <h3 className="font-bold text-lg flex items-center"><i data-lucide="shopping-basket" className="mr-2"></i> ตะกร้าสินค้า</h3>
                            <button onClick={() => setCart([])} className="text-slate-400 hover:text-red-500"><i data-lucide="trash-2" className="w-5 h-5"></i></button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3 no-scrollbar">
                            {cart.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-300">
                                    <i data-lucide="coffee" className="w-12 h-12 mb-3 opacity-20"></i>
                                    <p className="text-sm">ไม่มีรายการในตะกร้า</p>
                                </div>
                            ) : cart.map(item => (
                                <div key={item.tempId} className="bg-slate-50 p-4 rounded-2xl flex justify-between items-center">
                                    <div>
                                        <p className="font-bold text-sm text-slate-800">{item.name} ({item.size})</p>
                                        <p className="text-[10px] text-slate-500 uppercase tracking-wider">หวาน {item.sweetness} | {item.toppings.join(', ') || 'Original'}</p>
                                        <p className="text-indigo-600 font-bold text-sm mt-1">฿{item.totalPrice}</p>
                                    </div>
                                    <button onClick={() => setCart(cart.filter(c => c.tempId !== item.tempId))} className="text-slate-300 hover:text-red-500"><i data-lucide="x-circle" className="w-5 h-5"></i></button>
                                </div>
                            ))}
                        </div>
                        <div className="p-6 bg-slate-50 border-t space-y-4 pb-24 md:pb-6">
                            <div className="flex justify-between items-end">
                                <span className="text-slate-500 text-sm">ยอดรวมทั้งสิ้น</span>
                                <span className="text-3xl font-black text-slate-800">฿{subtotal.toLocaleString()}</span>
                            </div>
                            <button 
                                disabled={cart.length === 0}
                                onClick={() => setShowPayment(true)}
                                className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-lg shadow-lg hover:bg-indigo-700 disabled:bg-slate-300 transition-all"
                            >ชำระเงิน</button>
                        </div>
                    </div>

                    {/* Mobile Bottom Navigation (แสดงเฉพาะบนมือถือ) */}
                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-3 z-30 shadow-lg">
                        <button onClick={() => setMobileTab('menu')} className={`flex flex-col items-center text-xs font-bold ${mobileTab === 'menu' ? 'text-indigo-600' : 'text-slate-400'}`}>
                            <i data-lucide="coffee" className="w-5 h-5 mb-1"></i> เมนูเครื่องดื่ม
                        </button>
                        <button onClick={() => setMobileTab('cart')} className={`flex flex-col items-center text-xs font-bold relative ${mobileTab === 'cart' ? 'text-indigo-600' : 'text-slate-400'}`}>
                            <i data-lucide="shopping-cart" className="w-5 h-5 mb-1"></i> ตะกร้า
                            {cart.length > 0 && <span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-black">{cart.length}</span>}
                        </button>
                    </div>
                </div>
            );

            // --- KDS VIEW ---
            const KDSView = () => (
                <div className="p-6 h-full overflow-y-auto no-scrollbar pb-24 md:pb-6">
                    <h2 className="text-2xl font-bold text-slate-800 mb-6">จอครัว (KDS)</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        {orders.filter(o => o.status !== 'COMPLETED').map(order => (
                            <div key={order.id} className={`bg-white rounded-3xl overflow-hidden border-t-8 shadow-md ${order.status === 'PENDING' ? 'border-amber-400' : 'border-blue-500'}`}>
                                <div className="p-4 border-b flex justify-between items-center bg-slate-50/50">
                                    <span className="font-black text-base">#{order.id.slice(-4)}</span>
                                    <span className="text-xs text-slate-400">{new Date(order.timestamp).toLocaleTimeString()}</span>
                                </div>
                                <div className="p-4 space-y-3 min-h-[120px]">
                                    {order.items.map((item, idx) => (
                                        <div key={idx} className="border-b border-dashed border-slate-100 pb-2">
                                            <div className="font-bold text-sm text-slate-800">{item.name} <span className="text-indigo-600">[{item.size}]</span></div>
                                            <div className="text-xs text-slate-500">หวาน: {item.sweetness}</div>
                                            {item.toppings.length > 0 && <div className="text-[10px] text-orange-500 font-bold mt-1">เพิ่ม: {item.toppings.join(', ')}</div>}
                                        </div>
                                    ))}
                                </div>
                                <div className="p-4">
                                    {order.status === 'PENDING' ? (
                                        <button onClick={() => setOrders(orders.map(o => o.id === order.id ? {...o, status: 'PREPARING'} : o))} className="w-full py-3 bg-amber-400 text-white rounded-xl font-bold text-sm">เริ่มทำ</button>
                                    ) : (
                                        <button onClick={() => setOrders(orders.map(o => o.id === order.id ? {...o, status: 'COMPLETED'} : o))} className="w-full py-3 bg-blue-500 text-white rounded-xl font-bold text-sm">เสร็จสิ้น</button>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            // --- INVENTORY VIEW ---
            const InventoryView = () => (
                <div className="p-6 h-full overflow-y-auto no-scrollbar pb-24 md:pb-6">
                    <h2 className="text-2xl font-bold text-slate-800 mb-6">คลังวัตถุดิบ (BOM)</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {inventory.map(ing => (
                            <div key={ing.id} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                <div className="flex justify-between items-start mb-4">
                                    <div className="p-3 bg-indigo-50 rounded-xl text-indigo-600"><i data-lucide="package" className="w-5 h-5"></i></div>
                                    {ing.stock <= ing.min && <span className="bg-red-100 text-red-600 text-[10px] font-black px-2.5 py-1 rounded-full animate-pulse">ใกล้หมด</span>}
                                </div>
                                <h3 className="text-slate-400 font-medium text-xs mb-1">{ing.name}</h3>
                                <div className="text-2xl font-black text-slate-800 mb-3">
                                    {ing.stock.toLocaleString()} <span className="text-sm font-normal text-slate-300">{ing.unit}</span>
                                </div>
                                <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                    <div 
                                        className={`h-full transition-all duration-500 ${ing.stock <= ing.min ? 'bg-red-500' : 'bg-indigo-500'}`}
                                        style={{ width: `${Math.min((ing.stock / (ing.min * 5)) * 100, 100)}%` }}
                                    ></div>
                                </div>
                                <button onClick={() => {
                                    const amt = prompt("ระบุจำนวนที่ต้องการเติม:");
                                    if(amt) setInventory(inventory.map(i => i.id === ing.id ? {...i, stock: i.stock + parseInt(amt)} : i));
                                }} className="mt-4 text-indigo-600 text-xs font-bold flex items-center hover:underline"><i data-lucide="plus-circle" className="w-4 h-4 mr-1"></i> เติมสต็อก</button>
                            </div>
                        ))}
                    </div>
                </div>
            );

            // --- REPORTS VIEW ---
            const ReportsView = () => {
                useEffect(() => {
                    const ctx = document.getElementById('salesChart');
                    if (ctx) {
                        if (chartRef.current) chartRef.current.destroy();
                        const last7Days = [...Array(7)].map((_, i) => {
                            const d = new Date(); d.setDate(d.getDate() - i);
                            return d.toISOString().split('T')[0];
                        }).reverse();
                        const data = last7Days.map(d => orders.filter(o => o.timestamp.startsWith(d)).reduce((s, o) => s + o.total, 0));
                        
                        chartRef.current = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: last7Days,
                                datasets: [{
                                    label: 'ยอดขาย', data, borderColor: '#4f46e5', tension: 0.4, fill: true, backgroundColor: 'rgba(79, 70, 229, 0.05)', borderWidth: 3, pointRadius: 0
                                }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
                        });
                    }
                }, []);

                return (
                    <div className="p-6 h-full overflow-y-auto no-scrollbar pb-24 md:pb-6">
                        <h2 className="text-2xl font-bold text-slate-800 mb-6">รายงานวิเคราะห์</h2>
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
                            <div className="lg:col-span-2 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                <h3 className="font-bold text-slate-800 mb-4 text-sm">แนวโน้มยอดขาย</h3>
                                <div className="h-48"><canvas id="salesChart"></canvas></div>
                            </div>
                            <div className="grid grid-cols-2 lg:grid-cols-1 gap-4">
                                <div className="bg-indigo-600 p-6 rounded-3xl text-white shadow-lg">
                                    <p className="text-indigo-100 text-xs">รายได้รวม</p>
                                    <h4 className="text-2xl font-black">฿{orders.reduce((s, o) => s + o.total, 0).toLocaleString()}</h4>
                                </div>
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                    <p className="text-slate-400 text-xs">จำนวนออเดอร์</p>
                                    <h4 className="text-2xl font-black text-slate-800">{orders.length} <span className="text-sm font-normal text-slate-300">บิล</span></h4>
                                </div>
                            </div>
                        </div>
                        <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                            <div className="p-5 border-b font-bold text-sm">ประวัติการขายล่าสุด</div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs">
                                    <thead className="bg-slate-50 text-slate-400 uppercase">
                                        <tr><th className="px-4 py-3">ID</th><th className="px-4 py-3">เวลา</th><th className="px-4 py-3">ยอดรวม</th><th className="px-4 py-3">สถานะ</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {orders.slice(0, 5).map(o => (
                                            <tr key={o.id} className="hover:bg-slate-50 transition-colors">
                                                <td className="px-4 py-3 font-bold">#{o.id.slice(-6)}</td>
                                                <td className="px-4 py-3 text-slate-500">{new Date(o.timestamp).toLocaleString()}</td>
                                                <td className="px-4 py-3 font-black text-indigo-600">฿{o.total}</td>
                                                <td className="px-4 py-3"><span className={`px-2.5 py-0.5 rounded-full text-[9px] font-bold ${o.status === 'COMPLETED' ? 'bg-green-100 text-green-600' : 'bg-amber-100 text-amber-600'}`}>{o.status}</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- MODALS ---
            const ModifierModal = () => {
                if (!selectedProduct) return null;
                const [size, setSize] = useState('M');
                const [sweet, setSweet] = useState('100%');
                const [tops, setTops] = useState([]);

                const price = selectedProduct.price + 
                    (MODIFIERS.sizes.find(s => s.label === size).price) +
                    tops.reduce((s, t) => s + MODIFIERS.toppings.find(mt => mt.label === t).price, 0);

                return (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                        <div className="bg-white w-full max-w-md rounded-[2.5rem] overflow-hidden shadow-2xl animate-slide-in">
                            <div className="p-6 border-b flex justify-between items-center">
                                <div>
                                    <h3 className="text-xl font-bold text-slate-800">{selectedProduct.name}</h3>
                                    <p className="text-slate-400 text-xs">ปรับแต่งเครื่องดื่ม</p>
                                </div>
                                <button onClick={() => setSelectedProduct(null)} className="p-2 hover:bg-slate-100 rounded-full"><i data-lucide="x" className="w-5 h-5 text-slate-400"></i></button>
                            </div>
                            <div className="p-6 space-y-6 max-h-[50vh] overflow-y-auto no-scrollbar">
                                <div>
                                    <label className="block font-bold text-slate-700 text-sm mb-3">ขนาดแก้ว</label>
                                    <div className="grid grid-cols-3 gap-3">
                                        {MODIFIERS.sizes.map(s => (
                                            <button key={s.label} onClick={() => setSize(s.label)} className={`py-3 rounded-xl font-bold border-2 text-sm transition-all ${size === s.label ? 'border-indigo-600 bg-indigo-50 text-indigo-600' : 'border-slate-100 text-slate-400'}`}>
                                                {s.label} <span className="block text-[9px] font-normal">+฿{s.price}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <label className="block font-bold text-slate-700 text-sm mb-3">ความหวาน</label>
                                    <div className="grid grid-cols-4 gap-2">
                                        {MODIFIERS.sweetness.map(sw => (
                                            <button key={sw} onClick={() => setSweet(sw)} className={`py-2 rounded-lg text-xs font-bold border-2 transition-all ${sweet === sw ? 'border-indigo-600 bg-indigo-50 text-indigo-600' : 'border-slate-100 text-slate-400'}`}>{sw}</button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <label className="block font-bold text-slate-700 text-sm mb-3">ท็อปปิ้ง</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        {MODIFIERS.toppings.map(t => (
                                            <button 
                                                key={t.label} 
                                                onClick={() => tops.includes(t.label) ? setTops(tops.filter(x => x !== t.label)) : setTops([...tops, t.label])}
                                                className={`p-3 rounded-xl font-bold border-2 text-xs transition-all flex justify-between items-center ${tops.includes(t.label) ? 'border-indigo-600 bg-indigo-50 text-indigo-600' : 'border-slate-100 text-slate-400'}`}
                                            >
                                                <span>{t.label}</span>
                                                <span className="text-[9px] font-normal">+฿{t.price}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            <div className="p-6 bg-slate-50">
                                <button 
                                    onClick={() => handleAddToCart({ ...selectedProduct, size, sweetness: sweet, toppings: tops, totalPrice: price })}
                                    className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-base shadow-lg hover:bg-indigo-700"
                                >เพิ่มลงตะกร้า ฿{price}</button>
                            </div>
                        </div>
                    </div>
                );
            };

            const PaymentModal = () => {
                if (!showPayment) return null;
                return (
                    <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                        <div className="bg-white w-full max-w-md rounded-[2.5rem] overflow-hidden shadow-2xl p-6 sm:p-8 text-center animate-slide-in">
                            <h3 className="text-slate-400 font-medium text-sm mb-1">ยอดชำระทั้งหมด</h3>
                            <div className="text-5xl font-black text-slate-800 mb-6">฿{subtotal.toLocaleString()}</div>
                            
                            <div className="space-y-4 mb-6">
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => handlePayment('QR')} className="flex flex-col items-center justify-center p-4 bg-blue-50 border-2 border-blue-500 rounded-2xl text-blue-700 font-bold text-sm">
                                        <i data-lucide="qr-code" className="mb-2"></i> PromptPay / QR
                                    </button>
                                    <button onClick={() => {}} className="flex flex-col items-center justify-center p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl text-slate-400 font-bold text-sm cursor-not-allowed">
                                        <i data-lucide="credit-card" className="mb-2"></i> บัตรเครดิต
                                    </button>
                                </div>

                                <div className="border-t pt-4 text-left">
                                    <label className="block text-xs font-bold text-slate-500 mb-2">รับเงินสดมา (CASH)</label>
                                    <input 
                                        type="number" 
                                        className="w-full text-2xl font-black p-3 bg-slate-100 rounded-xl border-none focus:ring-2 focus:ring-indigo-500 text-center"
                                        placeholder="0.00"
                                        value={cashReceived}
                                        onChange={(e) => setCashReceived(e.target.value)}
                                    />
                                    
                                    {/* ปุ่มลัดจำนวนเงินสด */}
                                    <div className="grid grid-cols-4 gap-2 mt-2">
                                        {[50, 100, 500, 1000].map(val => (
                                            <button 
                                                key={val} 
                                                onClick={() => setCashReceived(val.toString())}
                                                className="py-1.5 bg-slate-200 hover:bg-slate-300 rounded-lg text-xs font-bold text-slate-700"
                                            >
                                                +{val}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* แสดงเงินทอนขนาดใหญ่เพื่อป้องกันพนักงานทอนผิด */}
                                {parseFloat(cashReceived) >= subtotal && (
                                    <div className="bg-emerald-50 p-4 rounded-2xl flex justify-between items-center border border-emerald-200">
                                        <span className="text-emerald-700 font-bold text-sm">เงินทอน</span>
                                        <span className="text-3xl font-black text-emerald-700">฿{changeAmount.toLocaleString()}</span>
                                    </div>
                                )}
                            </div>

                            <div className="flex gap-3">
                                <button onClick={() => setShowPayment(false)} className="flex-1 py-3 bg-slate-100 text-slate-500 rounded-xl font-bold text-sm">ยกเลิก</button>
                                <button 
                                    disabled={parseFloat(cashReceived) < subtotal && cashReceived !== ""}
                                    onClick={() => handlePayment('CASH')} 
                                    className="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold text-sm disabled:bg-slate-300"
                                >
                                    ยืนยันเงินสด
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- MAIN RENDER ---
            return (
                <div className="flex h-screen overflow-hidden flex-col md:flex-row">
                    {/* Sidebar (แสดงด้านข้างบนจอใหญ่ แสดงด้านล่างบนจอมือถือ) */}
                    <div className="hidden md:flex w-20 bg-white border-r flex-col items-center py-8 space-y-8 shadow-sm z-10">
                        <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black text-lg">ล</div>
                        <nav className="flex flex-col space-y-4">
                            <button onClick={() => setView('pos')} className={`p-3 rounded-xl transition-all ${view === 'pos' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:text-indigo-600'}`}><i data-lucide="layout-grid"></i></button>
                            <button onClick={() => setView('kds')} className={`p-3 rounded-xl transition-all ${view === 'kds' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:text-indigo-600'}`}><i data-lucide="monitor"></i></button>
                            <button onClick={() => setView('inventory')} className={`p-3 rounded-xl transition-all ${view === 'inventory' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:text-indigo-600'}`}><i data-lucide="package"></i></button>
                            <button onClick={() => setView('reports')} className={`p-3 rounded-xl transition-all ${view === 'reports' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:text-indigo-600'}`}><i data-lucide="bar-chart-3"></i></button>
                        </nav>
                    </div>

                    {/* Mobile Top Bar & Navigation (แสดงเฉพาะบนมือถือ) */}
                    <div className="md:hidden bg-white border-b px-4 py-3 flex justify-between items-center z-10">
                        <div className="font-black text-indigo-600 text-lg">เลื่องชื่อลือชา</div>
                        <div className="flex space-x-3">
                            <button onClick={() => setView('pos')} className={`p-2 rounded-lg ${view === 'pos' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400'}`}><i data-lucide="layout-grid" className="w-5 h-5"></i></button>
                            <button onClick={() => setView('kds')} className={`p-2 rounded-lg ${view === 'kds' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400'}`}><i data-lucide="monitor" className="w-5 h-5"></i></button>
                            <button onClick={() => setView('inventory')} className={`p-2 rounded-lg ${view === 'inventory' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400'}`}><i data-lucide="package" className="w-5 h-5"></i></button>
                            <button onClick={() => setView('reports')} className={`p-2 rounded-lg ${view === 'reports' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400'}`}><i data-lucide="bar-chart-3" className="w-5 h-5"></i></button>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col overflow-hidden">
                        {view === 'pos' && <POSView />}
                        {view === 'kds' && <KDSView />}
                        {view === 'inventory' && <InventoryView />}
                        {view === 'reports' && <ReportsView />}
                    </div>

                    {/* Modals */}
                    <ModifierModal />
                    <PaymentModal />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
