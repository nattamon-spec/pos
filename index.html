<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lue cha POS - Add Product UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        .input-field { @apply w-full border border-gray-300 rounded-xl p-3 mt-1 focus:ring-2 focus:ring-teal-500 outline-none transition-all; }
        .menu-item-row { @apply flex items-center justify-between p-4 border border-gray-200 rounded-2xl mb-3 bg-white active:bg-gray-50 cursor-pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Database Setup ---
        const db = new Dexie("LueCha_v4");
        db.version(1).stores({
            products: "++id, name, price, cost, deliveryPrice, categoryId"
        });

        function App() {
            const [showModal, setShowModal] = useState(true); // เปิดไว้เพื่อโชว์ UI ทันที
            const [formData, setFormData] = useState({
                name: '',
                price: '',
                cost: '',
                deliveryPrice: '',
                category: 'ยังไม่ได้เลือก',
                options: '1 กลุ่ม'
            });

            const handleSave = async () => {
                if(!formData.name || !formData.price) return alert("กรุณากรอกข้อมูลที่จำเป็น (*)");
                await db.products.add(formData);
                alert("บันทึกสินค้าเรียบร้อย!");
                // setShowModal(false);
            };

            return (
                <div className="min-h-screen p-4 flex items-center justify-center">
                    
                    {/* ปุ่มจำลองการเปิด Modal */}
                    {!showModal && (
                        <button onClick={() => setShowModal(true)} className="bg-teal-600 text-white px-6 py-3 rounded-xl font-bold">
                            + เพิ่มสินค้า
                        </button>
                    )}

                    {/* --- Add Product Modal (ตามรูปที่คุณส่งมา) --- */}
                    {showModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-end md:items-center justify-center z-50">
                            <div className="bg-white w-full max-w-lg rounded-t-[30px] md:rounded-[30px] overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-300">
                                
                                {/* Header */}
                                <div className="flex justify-between items-center p-5 border-b border-gray-100">
                                    <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                        <span className="text-teal-600">เพิ่มสินค้า</span>
                                    </h2>
                                    <div className="flex gap-3">
                                        <button className="text-gray-400 hover:text-gray-600">
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="Step 13" />
                                                <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="2"/>
                                                <path d="M12 16v-4M12 8h.01" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
                                            </svg>
                                        </button>
                                        <button onClick={() => setShowModal(false)} className="bg-red-100 text-red-500 p-1 rounded-full hover:bg-red-200 transition-colors">
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                {/* Body */}
                                <div className="p-6 space-y-6 max-h-[70vh] overflow-y-auto no-scrollbar">
                                    
                                    {/* Top Section: Image & Basic Info */}
                                    <div className="flex gap-6">
                                        {/* Image Upload Placeholder */}
                                        <div className="w-32 h-32 bg-gray-50 border-2 border-dashed border-gray-200 rounded-3xl flex flex-col items-center justify-center text-gray-400 cursor-pointer hover:bg-gray-100 transition-all">
                                            <span className="text-4xl font-bold text-teal-200">?</span>
                                            <span className="text-xs mt-1">เลือกรูป</span>
                                        </div>

                                        {/* Name, Price, Cost */}
                                        <div className="flex-1 space-y-4">
                                            <div>
                                                <label className="text-sm font-bold text-slate-700">ชื่อสินค้า <span className="text-red-500">*</span></label>
                                                <input 
                                                    type="text" 
                                                    placeholder="เช่น กาแฟเย็น" 
                                                    className="w-full border-b-2 border-gray-100 p-2 focus:border-teal-500 outline-none text-lg transition-all"
                                                    value={formData.name}
                                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                                />
                                            </div>
                                            <div className="flex gap-4">
                                                <div className="flex-1">
                                                    <label className="text-sm font-bold text-slate-700">ราคาขาย <span className="text-red-500">*</span></label>
                                                    <input 
                                                        type="number" 
                                                        placeholder="0" 
                                                        className="w-full bg-gray-50 rounded-2xl p-3 mt-1 focus:ring-2 focus:ring-teal-500 outline-none"
                                                        value={formData.price}
                                                        onChange={(e) => setFormData({...formData, price: e.target.value})}
                                                    />
                                                </div>
                                                <div className="flex-1">
                                                    <label className="text-sm font-bold text-slate-700 text-gray-400">ต้นทุน</label>
                                                    <input 
                                                        type="number" 
                                                        placeholder="0" 
                                                        className="w-full bg-gray-50 rounded-2xl p-3 mt-1 focus:ring-2 focus:ring-teal-500 outline-none"
                                                        value={formData.cost}
                                                        onChange={(e) => setFormData({...formData, cost: e.target.value})}
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Expandable Menu Rows */}
                                    <div className="space-y-3 pt-4">
                                        <div className="menu-item-row">
                                            <div className="flex items-center gap-3">
                                                <div className="text-teal-500 bg-teal-50 p-2 rounded-lg">🏷️</div>
                                                <span className="font-medium text-slate-700">หมวดหมู่</span>
                                            </div>
                                            <div className="flex items-center gap-2 text-gray-400">
                                                <span className="text-sm">{formData.category}</span>
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                                                </svg>
                                            </div>
                                        </div>

                                        <div className="menu-item-row">
                                            <div className="flex items-center gap-3">
                                                <div className="text-blue-500 bg-blue-50 p-2 rounded-lg">📑</div>
                                                <span className="font-medium text-slate-700">ตัวเลือกสินค้า</span>
                                            </div>
                                            <div className="flex items-center gap-2 text-gray-400">
                                                <span className="text-sm">· {formData.options}</span>
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                                                </svg>
                                            </div>
                                        </div>

                                        <div className="menu-item-row">
                                            <div className="flex items-center gap-3">
                                                <div className="text-orange-500 bg-orange-50 p-2 rounded-lg">🛵</div>
                                                <span className="font-medium text-slate-700">ราคาขายเดลิเวอรี่</span>
                                            </div>
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                                            </svg>
                                        </div>

                                        <div className="menu-item-row">
                                            <div className="flex items-center gap-3">
                                                <div className="text-indigo-500 bg-indigo-50 p-2 rounded-lg">🏪</div>
                                                <span className="font-medium text-slate-700">เพิ่มไปยังร้านอื่นด้วย</span>
                                            </div>
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                                            </svg>
                                        </div>
                                    </div>
                                </div>

                                {/* Footer Button */}
                                <div className="p-6">
                                    <button 
                                        onClick={handleSave}
                                        className="w-full bg-[#2497a9] hover:bg-[#1d7e8d] text-white py-4 rounded-2xl font-bold text-xl flex items-center justify-center gap-3 shadow-lg active:scale-[0.98] transition-all"
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                                        </svg>
                                        บันทึก
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
