<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เลื่องชื่อลือชา POS Pro</title>
    <!-- Firebase SDK (Version 8.10.1) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --p-blue: #007AFF; --bg-cream: #FDFBF7; --soft-blue: #E3F2FD; }
        body { font-family: 'Kanit', sans-serif; background-color: var(--bg-cream); color: #334155; touch-action: manipulation; }
        .btn-touch { transition: all 0.15s ease; cursor: pointer; }
        .btn-touch:active { transform: scale(0.96); background-color: rgba(0, 122, 255, 0.1); }
        .card-active:active { background-color: var(--soft-blue); }
        .tab-active { color: var(--p-blue) !important; border-top: 4px solid var(--p-blue); font-weight: 600; }
        .mod-selected { border-color: var(--p-blue) !important; background-color: var(--soft-blue) !important; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .anim-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="pb-28">

    <!-- CONNECTION OVERLAY -->
    <div id="loading-overlay" class="fixed inset-0 bg-white z-[300] flex flex-col items-center justify-center p-6 text-center">
        <div class="w-16 h-16 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin mb-4"></div>
        <h2 class="text-xl font-bold text-gray-700">กำลังเชื่อมต่อฐานข้อมูล...</h2>
        <p id="error-msg" class="text-xs text-red-500 mt-4 font-mono"></p>
        <button onclick="forceOpen()" class="mt-8 text-blue-500 underline text-xs">ข้ามการรอเชื่อมต่อ (Force Open)</button>
    </div>

    <!-- HEADER -->
    <header class="bg-white px-6 py-4 flex justify-between items-center sticky top-0 z-50 border-b border-blue-50 shadow-sm">
        <h1 class="text-xl font-bold text-[#004A99]">เลื่องชื่อลือชา</h1>
        <div id="db-status" class="text-[9px] px-2.5 py-1 rounded-full font-bold bg-yellow-100 text-yellow-600 uppercase">Connecting...</div>
    </header>

    <div id="main-content">
        <!-- 1. REPORT PAGE -->
        <section id="page-report" class="p-4 hidden">
            <div class="flex gap-2 overflow-x-auto pb-4 hide-scroll">
                <button onclick="updateReport('today')" class="r-btn btn-touch bg-blue-600 text-white px-5 py-2 rounded-full text-xs font-bold shadow-sm">วันนี้</button>
                <button onclick="updateReport('7days')" class="r-btn btn-touch bg-white border px-5 py-2 rounded-full text-xs">7 วัน</button>
                <button onclick="updateReport('30days')" class="r-btn btn-touch bg-white border px-5 py-2 rounded-full text-xs">30 วัน</button>
            </div>
            
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-blue-50 mb-6 text-center">
                <p class="text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-1">ยอดขายรวม</p>
                <h2 id="rep-sales" class="text-5xl font-bold text-blue-600 tracking-tighter">฿0</h2>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6 text-center">
                <div class="bg-green-50 p-5 rounded-3xl border border-green-100">
                    <p class="text-[9px] text-green-600 font-bold uppercase">กำไรสุทธิ</p>
                    <p id="rep-profit" class="text-xl font-bold text-green-700">฿0</p>
                </div>
                <div class="bg-orange-50 p-5 rounded-3xl border border-orange-100">
                    <p class="text-[9px] text-orange-600 font-bold uppercase">ภาษี 7%</p>
                    <p id="rep-tax" class="text-xl font-bold text-orange-700">฿0</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-blue-50 mb-8">
                <p class="text-xs font-bold text-gray-400 uppercase text-center mb-4">ช่องทางการชำระเงิน</p>
                <canvas id="salesChart"></canvas>
            </div>

            <div class="space-y-3 mb-8">
                <div class="bg-blue-50 p-4 rounded-2xl flex justify-between items-center">
                    <span class="text-sm font-bold">🛵 เดลิเวอรี</span>
                    <span id="rep-deli" class="font-bold text-blue-600">฿0</span>
                </div>
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center border">
                    <span class="text-sm font-bold">💰 ต้นทุนสินค้า</span>
                    <span id="rep-cost" class="font-bold text-gray-400">฿0</span>
                </div>
            </div>
        </section>

        <!-- 2. SELL PAGE (POS) -->
        <section id="page-sell" class="p-4 block">
            <div class="mb-4">
                <input type="text" id="search" oninput="renderPOS()" placeholder="🔍 ค้นหาเมนู..." class="w-full p-4 rounded-2xl bg-white shadow-sm border-none outline-none ring-1 ring-blue-50">
            </div>
            <div id="pos-cats" class="flex gap-2 overflow-x-auto pb-4 hide-scroll"></div>
            <div id="pos-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-32"></div>
        </section>

        <!-- 3. KITCHEN PAGE -->
        <section id="page-kitchen" class="p-4 hidden">
            <h2 class="text-xl font-bold mb-6">ออเดอร์ห้องครัว</h2>
            <div id="kitchen-list" class="space-y-4"></div>
        </section>

        <!-- 4. STOCK PAGE -->
        <section id="page-stock" class="p-4 hidden">
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-blue-600 p-5 rounded-3xl text-white shadow-lg text-center">
                    <p class="text-[9px] font-bold uppercase opacity-70">สินค้าในระบบ</p>
                    <p id="stk-count" class="text-3xl font-bold">0</p>
                </div>
                <div class="bg-white p-5 rounded-3xl border border-blue-50 shadow-sm text-center">
                    <p class="text-[9px] font-bold uppercase text-gray-400">มูลค่าคลัง</p>
                    <p id="stk-value" class="text-3xl font-bold text-blue-600">฿0</p>
                </div>
            </div>
            <div class="flex justify-between items-center mb-6 px-2">
                <h3 class="font-bold">รายการเมนู</h3>
                <button onclick="openAdminModal()" class="btn-touch bg-blue-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-md">+ เพิ่มเมนู</button>
            </div>
            <div id="admin-list" class="space-y-3 mb-8"></div>
            <button onclick="seedData()" class="w-full py-4 text-gray-300 text-[9px] font-bold uppercase italic border-2 border-dashed rounded-3xl">✨ คลิกเพื่อติดตั้งสินค้าเริ่มต้น</button>
        </section>
    </div>

    <!-- CART BAR -->
    <div id="cart-bar" class="fixed bottom-24 left-4 right-4 bg-white p-5 rounded-[2.5rem] shadow-2xl flex justify-between items-center hidden z-40 border border-blue-50 animate-bounce">
        <div class="flex items-center gap-4">
            <div id="cart-qty" class="bg-blue-600 text-white w-8 h-8 flex items-center justify-center rounded-full text-xs font-bold font-mono">0</div>
            <div id="cart-total" class="text-2xl font-bold text-[#004A99] tracking-tighter">฿0</div>
        </div>
        <button onclick="openCheckout()" class="btn-touch bg-blue-600 text-white px-10 py-3 rounded-2xl font-bold text-sm shadow-md">ชำระเงิน</button>
    </div>

    <!-- BOTTOM TAB NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-blue-50 flex justify-around p-3 p
