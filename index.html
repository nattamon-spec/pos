<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuayMoney Clone - Professional POS System</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .product-card:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Mock Data ---
        const CATEGORIES = ["ทั้งหมด", "กาแฟ", "ชา", "เบเกอรี่", "อาหาร"];
        const INITIAL_PRODUCTS = [
            { id: 1, name: "เอสเพรสโซ่", price: 55, category: "กาแฟ", stock: 50, image: "☕" },
            { id: 2, name: "อเมริกาโน่", price: 50, category: "กาแฟ", stock: 40, image: "☕" },
            { id: 3, name: "ลาเต้", price: 65, category: "กาแฟ", stock: 30, image: "🥛" },
            { id: 4, name: "ชาไทย", price: 45, category: "ชา", stock: 100, image: "🍂" },
            { id: 5, name: "ชาเขียวมัทฉะ", price: 60, category: "ชา", stock: 20, image: "🍵" },
            { id: 6, name: "ครัวซองต์", price: 85, category: "เบเกอรี่", stock: 15, image: "🥐" },
            { id: 7, name: "เค้กช็อกโกแลต", price: 120, category: "เบเกอรี่", stock: 10, image: "🍰" },
            { id: 8, name: "ข้าวผัดกะเพรา", price: 79, category: "อาหาร", stock: 25, image: "🍳" },
        ];

        function App() {
            const [products, setProducts] = useState(INITIAL_PRODUCTS);
            const [cart, setCart] = useState([]);
            const [category, setCategory] = useState("ทั้งหมด");
            const [search, setSearch] = useState("");
            const [isShiftOpen, setIsShiftOpen] = useState(false);
            const [showPayment, setShowPayment] = useState(false);
            const [cashReceived, setCashReceived] = useState("");
            const [shiftData, setShiftData] = useState({ startCash: 0, startTime: null });

            // --- Logic ---
            const filteredProducts = products.filter(p => 
                (category === "ทั้งหมด" || p.category === category) &&
                p.name.toLowerCase().includes(search.toLowerCase())
            );

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const addToCart = (product) => {
                if (!isShiftOpen) return alert("กรุณาเปิดกะก่อนเริ่มการขาย");
                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    setCart(cart.map(item => item.id === product.id ? {...item, quantity: item.quantity + 1} : item));
                } else {
                    setCart([...cart, { ...product, quantity: 1 }]);
                }
            };

            const updateQty = (id, delta) => {
                setCart(cart.map(item => item.id === id ? { ...item, quantity: Math.max(1, item.quantity + delta) } : item));
            };

            const removeFromCart = (id) => setCart(cart.filter(item => item.id !== id));

            const handlePayment = (type) => {
                if (type === 'CASH' && parseFloat(cashReceived) < subtotal) return alert("เงินสดไม่พอ");
                
                // ตัดสต็อก (Simulate)
                const newProducts = products.map(p => {
                    const cartItem = cart.find(c => c.id === p.id);
                    return cartItem ? { ...p, stock: p.stock - cartItem.quantity } : p;
                });
                
                setProducts(newProducts);
                alert("ชำระเงินสำเร็จ! กำลังพิมพ์ใบเสร็จ...");
                setCart([]);
                setShowPayment(false);
                setCashReceived("");
            };

            // --- UI Components ---
            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <div className="w-20 bg-blue-900 text-white flex flex-col items-center py-6 space-y-8">
                        <div className="text-2xl font-bold">M</div>
                        <i className="fa-solid fa-shop text-xl cursor-pointer text-blue-300"></i>
                        <i className="fa-solid fa-box text-xl cursor-pointer hover:text-blue-300"></i>
                        <i className="fa-solid fa-chart-line text-xl cursor-pointer hover:text-blue-300"></i>
                        <i className="fa-solid fa-gear text-xl cursor-pointer hover:text-blue-300"></i>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col bg-gray-100">
                        {/* Header */}
                        <div className="h-16 bg-white border-b px-6 flex items-center justify-between">
                            <div className="flex items-center space-x-4">
                                <h1 className="text-xl font-bold text-gray-800">MuayMoney POS</h1>
                                <div className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">
                                    {isShiftOpen ? "● กะเปิดอยู่" : "○ กะปิด"}
                                </div>
                            </div>
                            <div className="flex items-center space-x-4">
                                {!isShiftOpen ? (
                                    <button onClick={() => {setIsShiftOpen(true); setShiftData({startCash: 1000, startTime: new Date()})}} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium">เปิดกะ</button>
                                ) : (
                                    <button onClick={() => setIsShiftOpen(false)} className="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-medium">ปิดกะ</button>
                                )}
                                <div className="text-right">
                                    <p className="text-sm font-bold">Admin User</p>
                                    <p className="text-xs text-gray-500">สาขาหลัก</p>
                                </div>
                            </div>
                        </div>

                        {/* POS Area */}
                        <div className="flex-1 flex overflow-hidden">
                            {/* Product Section */}
                            <div className="flex-1 p-4 flex flex-col">
                                <div className="flex space-x-2 mb-4 overflow-x-auto hide-scrollbar">
                                    {CATEGORIES.map(cat => (
                                        <button 
                                            key={cat}
                                            onClick={() => setCategory(cat)}
                                            className={`px-6 py-2 rounded-full whitespace-nowrap font-medium transition ${category === cat ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-200'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                                
                                <div className="mb-4 relative">
                                    <i className="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
                                    <input 
                                        type="text" 
                                        placeholder="ค้นหาสินค้า หรือ ยิงบาร์โค้ด..." 
                                        className="w-full pl-12 pr-4 py-3 rounded-xl border-none shadow-sm focus:ring-2 focus:ring-blue-500"
                                        value={search}
                                        onChange={(e) => setSearch(e.target.value)}
                                    />
                                </div>

                                <div className="flex-1 overflow-y-auto grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 pb-10">
                                    {filteredProducts.map(product => (
                                        <div 
                                            key={product.id}
                                            onClick={() => addToCart(product)}
                                            className="product-card bg-white p-4 rounded-2xl shadow-sm hover:shadow-md cursor-pointer transition-all border-2 border-transparent hover:border-blue-500 relative overflow-hidden"
                                        >
                                            <div className="text-4xl mb-2">{product.image}</div>
                                            <h3 className="font-bold text-gray-800 truncate">{product.name}</h3>
                                            <p className="text-blue-600 font-bold text-lg">฿{product.price}</p>
                                            <div className="absolute top-2 right-2 bg-gray-100 px-2 py-1 rounded text-[10px] text-gray-500">
                                                คงเหลือ: {product.stock}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Cart Section */}
                            <div className="w-96 bg-white border-l flex flex-col">
                                <div className="p-4 border-b flex justify-between items-center">
                                    <h2 className="font-bold text-lg"><i className="fa-solid fa-cart-shopping mr-2"></i>รายการสั่งซื้อ</h2>
                                    <button onClick={() => setCart([])} className="text-gray-400 hover:text-red-500"><i className="fa-solid fa-trash-can"></i></button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                    {cart.length === 0 ? (
                                        <div className="h-full flex flex-col items-center justify-center text-gray-400">
                                            <i className="fa-solid fa-basket-shopping text-5xl mb-2"></i>
                                            <p>ไม่มีสินค้าในตะกร้า</p>
                                        </div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.id} className="flex justify-between items-center">
                                                <div className="flex-1">
                                                    <p className="font-medium text-sm">{item.name}</p>
                                                    <p className="text-blue-600 text-xs font-bold">฿{item.price * item.quantity}</p>
                                                </div>
                                                <div className="flex items-center space-x-3 bg-gray-100 rounded-lg p-1">
                                                    <button onClick={() => updateQty(item.id, -1)} className="w-6 h-6 bg-white rounded shadow-sm text-xs">-</button>
                                                    <span className="text-sm font-bold w-4 text-center">{item.quantity}</span>
                                                    <button onClick={() => updateQty(item.id, 1)} className="w-6 h-6 bg-white rounded shadow-sm text-xs">+</button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                <div className="p-6 bg-gray-50 border-t space-y-4">
                                    <div className="flex justify-between text-sm text-gray-600">
                                        <span>ยอดรวม</span>
                                        <span>฿{subtotal}</span>
                                    </div>
                                    <div className="flex justify-between text-sm text-gray-600">
                                        <span>ภาษี (7%)</span>
                                        <span>฿{(subtotal * 0.07).toFixed(2)}</span>
                                    </div>
                                    <div className="flex justify-between text-2xl font-black text-gray-800">
                                        <span>รวมทั้งสิ้น</span>
                                        <span className="text-blue-600">฿{subtotal.toLocaleString()}</span>
                                    </div>
                                    <button 
                                        disabled={cart.length === 0}
                                        onClick={() => setShowPayment(true)}
                                        className={`w-full py-4 rounded-2xl font-bold text-lg shadow-lg transition ${cart.length === 0 ? 'bg-gray-300 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700 active:scale-95'}`}
                                    >
                                        ชำระเงิน
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Payment Modal */}
                    {showPayment && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-md rounded-3xl overflow-hidden shadow-2xl">
                                <div className="p-6 border-b flex justify-between items-center">
                                    <h3 className="text-xl font-bold">ชำระเงิน</h3>
                                    <button onClick={() => setShowPayment(false)} className="text-gray-400 text-2xl">&times;</button>
                                </div>
                                <div className="p-6 space-y-6">
                                    <div className="text-center">
                                        <p className="text-gray-500">ยอดชำระทั้งหมด</p>
                                        <p className="text-5xl font-black text-blue-600">฿{subtotal.toLocaleString()}</p>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <button className="flex flex-col items-center p-4 border-2 border-blue-600 rounded-2xl bg-blue-50">
                                            <i className="fa-solid fa-money-bill-wave text-2xl text-blue-600 mb-2"></i>
                                            <span className="font-bold">เงินสด</span>
                                        </button>
                                        <button className="flex flex-col items-center p-4 border-2 border-gray-100 rounded-2xl hover:border-blue-600 transition">
                                            <i className="fa-solid fa-qrcode text-2xl text-gray-600 mb-2"></i>
                                            <span className="font-bold">PromptPay</span>
                                        </button>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">รับเงินสดมา</label>
                                        <input 
                                            type="number" 
                                            className="w-full text-3xl font-bold p-4 bg-gray-100 rounded-2xl border-none focus:ring-2 focus:ring-blue-500"
                                            placeholder="0.00"
                                            value={cashReceived}
                                            onChange={(e) => setCashReceived(e.target.value)}
                                        />
                                    </div>

                                    {parseFloat(cashReceived) >= subtotal && (
                                        <div className="bg-green-50 p-4 rounded-2xl flex justify-between items-center">
                                            <span className="text-green-700 font-bold">เงินทอน</span>
                                            <span className="text-2xl font-black text-green-700">฿{(parseFloat(cashReceived) - subtotal).toLocaleString()}</span>
                                        </div>
                                    )}

                                    <button 
                                        onClick={() => handlePayment('CASH')}
                                        className="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold text-xl shadow-lg hover:bg-blue-700"
                                    >
                                        ยืนยันการชำระเงิน
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
