<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เลื่องชื่อลือชา POS Pro</title>
    <!-- Firebase SDK 8.10.1 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f9fafb; touch-action: manipulation; }
        .tab-active { color: #ef4444 !important; border-bottom: 3px solid #ef4444; font-weight: bold; }
        .btn-tap:active { transform: scale(0.95); transition: 0.1s; background-color: #fee2e2; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .anim-up { animation: slideUp 0.3s ease-out; }
    </style>
</head>
<body class="pb-24">

    <!-- HEADER -->
    <header class="bg-white px-6 py-4 flex justify-between items-center sticky top-0 z-50 border-b shadow-sm">
        <h1 class="text-xl font-bold text-red-600 italic uppercase">เลื่องชื่อลือชา</h1>
        <div id="db-status" class="text-[9px] px-2 py-1 rounded-full font-bold bg-green-50 text-green-600 uppercase">● ออนไลน์</div>
    </header>

    <div id="main-view">
        <!-- 1. SELL PAGE (POS) -->
        <section id="page-sell" class="p-4 block">
            <div class="mb-4">
                <input type="text" id="search" oninput="renderPOS()" placeholder="🔍 ค้นหาเมนูสินค้า..." class="w-full p-4 rounded-2xl bg-white shadow-sm border-none outline-none ring-1 ring-red-50 text-sm">
            </div>
            <div id="pos-cats" class="flex gap-2 overflow-x-auto pb-4 hide-scroll"></div>
            <div id="pos-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-32">
                <!-- สินค้าจะโผล่ที่นี่ -->
            </div>
        </section>

        <!-- 2. REPORT PAGE -->
        <section id="page-report" class="p-4 hidden anim-up">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-red-50 mb-6 text-center">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">ยอดขายวันนี้</p>
                <h2 id="rep-total" class="text-5xl font-bold text-red-600 tracking-tighter font-mono">฿0</h2>
            </div>
            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border mb-8"><canvas id="salesChart"></canvas></div>
            <div id="staff-rep" class="space-y-2"></div>
        </section>

        <!-- 3. KITCHEN PAGE -->
        <section id="page-kitchen" class="p-4 hidden anim-up">
            <h2 class="text-xl font-bold mb-6 italic uppercase text-gray-500">ห้องครัว</h2>
            <div id="kitchen-list" class="space-y-4"></div>
        </section>

        <!-- 4. STOCK PAGE -->
        <section id="page-stock" class="p-4 hidden anim-up">
            <div class="flex justify-between items-center mb-6 px-2">
                <h3 class="font-bold text-xl">จัดการสินค้า</h3>
                <button onclick="openAdminModal()" class="bg-red-600 text-white px-5 py-2 rounded-xl text-xs font-bold">+ เพิ่มเมนู</button>
            </div>
            <div id="admin-list" class="space-y-3 mb-10"></div>
            <button onclick="seedData()" class="w-full py-4 text-gray-300 text-[10px] uppercase font-bold italic border-2 border-dashed rounded-3xl">✨ Re-Install Sample Data</button>
        </section>
    </div>

    <!-- CART BAR -->
    <div id="cart-bar" class="fixed bottom-24 left-4 right-4 bg-white p-5 rounded-[2.5rem] shadow-2xl flex justify-between items-center hidden z-40 border border-red-50 animate-bounce">
        <div class="flex items-center gap-4">
            <div id="cart-qty" class="bg-red-600 text-white w-9 h-9 flex items-center justify-center rounded-full text-sm font-bold font-mono">0</div>
            <div id="cart-total" class="text-2xl font-bold text-red-600 tracking-tighter">฿0</div>
        </div>
        <button onclick="openCheckout()" class="bg-red-600 text-white px-10 py-3.5 rounded-2xl font-bold text-sm uppercase shadow-lg">ชำระเงิน</button>
    </div>

    <!-- BOTTOM TAB NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 pb-8 z-50 shadow-2xl">
        <button onclick="showPage('report')" id="nav-report" class="flex flex-col items-center gap-1 text-gray-300 btn-tap"><span class="text-xl">📊</span><span class="text-[9px] font-bold uppercase">Report</span></button>
        <button onclick="showPage('sell')" id="nav-sell" class="flex flex-col items-center gap-1 text-gray-300 tab-active btn-tap"><span class="text-xl">🛒</span><span class="text-[9px] font-bold uppercase">Sell</span></button>
        <button onclick="showPage('kitchen')" id="nav-kitchen" class="flex flex-col items-center gap-1 text-gray-300 relative btn-tap"><span class="text-xl">👨‍🍳</span><span id="k-badge" class="absolute -top-1 -right-1 bg-red-600 text-white text-[8px] px-1.5 rounded-full hidden">0</span><span class="text-[9px] font-bold uppercase">Kitchen</span></button>
        <button onclick="showPage('stock')" id="nav-stock" class="flex flex-col items-center gap-1 text-gray-300 btn-tap"><span class="text-xl">📦</span><span class="text-[9px] font-bold uppercase">Stock</span></button>
    </nav>

    <!-- MODAL: MODIFIERS -->
    <div id="mod-modal" class="fixed inset-0 bg-black/60 hidden z-[100] flex items-end">
        <div class="bg-white w-full rounded-t-[3rem] p-8 max-h-[85vh] overflow-y-auto anim-up">
            <h3 id="mod-p-name" class="text-3xl font-bold mb-1 tracking-tight">เมนูสินค้า</h3>
            <p id="mod-p-price" class="text-red-600 font-bold mb-8 italic text-sm">ราคาพื้นฐาน ฿0</p>
            <div id="mod-list-container" class="space-y-6"></div>
            <div class="flex justify-between items-center sticky bottom-0 bg-white pt-6 border-t mt-8">
                <p id="mod-total" class="text-3xl font-bold text-gray-800 font-mono">฿0</p>
                <button onclick="confirmModAdd()" class="bg-red-600 text-white px-12 py-5 rounded-[2.5rem] font-bold shadow-xl">เพิ่มลงตะกร้า</button>
