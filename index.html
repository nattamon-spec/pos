<!DOCTYPE html>
<html lang="th">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เลื่องชื่อลือชา POS Enterprise</title>
    <!-- Firebase SDK 8.10.1 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --p-blue: #007AFF; --bg-cream: #FDFBF7; --soft-blue: #E3F2FD; }
        body { font-family: 'Kanit', sans-serif; background-color: var(--bg-cream); color: #334155; touch-action: manipulation; overflow-x: hidden; }
        
        /* Visual Feedback */
        .btn-touch { transition: all 0.15s ease; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .btn-touch:active { transform: scale(0.95); background-color: rgba(0, 122, 255, 0.1); }
        .item-selected { border: 3px solid var(--p-blue) !important; background-color: var(--soft-blue) !important; }
        
        /* Navigation & Tabs */
        .sidebar-active { background-color: var(--p-blue); color: white; border-radius: 1rem; }
        .tab-active { color: var(--p-blue) !important; border-top: 4px solid var(--p-blue); font-weight: 600; }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .anim-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

        /* PIN Pad Style */
        .pin-btn { background: white; border: 1px solid #e2e8f0; font-size: 1.5rem; font-weight: bold; height: 70px; border-radius: 1rem; }
        .pin-btn:active { background: #f1f5f9; }
    </style>
</head>
