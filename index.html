<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuayMoney Pro | Enterprise Beverage POS & ERP</title>
    <!-- Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .product-card:active { transform: scale(0.95); }
        .sidebar-item.active { background-color: #4f46e5; color: white; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .animate-slide-in { animation: slideIn 0.3s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- CONSTANTS & INITIAL DATA ---
        const CATEGORIES = ["ทั้งหมด", "ชา", "โกโก้", "นมสด", "โซดา"];
        const PRODUCTS = [
            { id: 'p1', name: 'ชาไทย', price: 45, category: 'ชา', image: '🥤', color: 'bg-orange-100' },
            { id: 'p2', name: 'ชาเขียว', price: 45, category: 'ชา', image: '🍵', color: 'bg-green-100' },
            { id: 'p3', name: 'โกโก้', price: 50, category: 'โกโก้', image: '🍫', color: 'bg-amber-900/10' },
            { id: 'p4', name: 'นมสด', price: 40, category: 'นมสด', image: '🥛', color: 'bg-blue-50' },
            { id: 'p5', name: 'โอริโอ้ปั่น', price: 65, category: 'นมสด', image: '🍪', color: 'bg-slate-100' },
            { id: 'p6', name: 'ชาพีช', price: 55, category: 'โซดา', image: '🍑', color: 'bg-pink-50' },
        ];

        const MODIFIERS = {
            sizes: [{ label: 'S', price: 0 }, { label: 'M', price: 10 }, { label: 'L', price: 20 }],
            sweetness: ['0%', '25%', '50%', '100%'],
            toppings: [
                { label: 'วิปครีม', price: 15 }, { label: 'ครีมชีส', price: 20 },
                { label: 'ชีสขูด', price: 15 }, { label: 'ช็อคขูด', price: 10 }
            ]
        };

        const BOM_RECIPES = {
            'p1': { 'S': { 'tea': 15, 'milk': 100, 'cup': 1 }, 'M': { 'tea': 20, 'milk': 150, 'cup': 1 }, 'L': { 'tea': 25, 'milk': 200, 'cup': 1 } },
            'p2': { 'S': { 'green': 15, 'milk': 100, 'cup': 1 }, 'M': { 'green': 20, 'milk': 150, 'cup': 1 }, 'L': { 'green': 25, 'milk': 200, 'cup': 1 } },
            'p3': { 'S': { 'cocoa': 20, 'milk': 100, 'cup': 1 }, 'M': { 'cocoa': 30, 'milk': 150, 'cup': 1 }, 'L': { 'cocoa': 40, 'milk': 200, 'cup': 1 } },
        };

        const INITIAL_STOCK = [
            { id: 'tea', name: 'ผงชาไทย', stock: 1000, unit: 'g', min: 200 },
            { id: 'green', name: 'ผงชาเขียว', stock: 800, unit: 'g', min: 200 },
            { id: 'cocoa', name: 'ผงโกโก้', stock: 1200, unit: 'g', min: 300 },
            { id: 'milk', name: 'นมสด', stock: 5000, unit: 'ml', min: 1000 },
            { id: 'cup', name: 'แก้วรวม', stock: 500, unit: 'ใบ', min: 50 },
        ];

        // --- MAIN APP COMPONENT ---
        function App() {
            const [view, setView] = useState('pos');
            const [cart, setCart] = useState([]);
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('mm_orders')) || []);
            const [inventory, setInventory] = useState(() => JSON.parse(localStorage.getItem('mm_stock')) || INITIAL_STOCK);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [showPayment, setShowPayment] = useState(false);
            const [activeCat, setActiveCat] = useState("ทั้งหมด");
            const [search, setSearch] = useState("");
            const chartRef = useRef(null);

            // Persistence
            useEffect(() => {
                localStorage.setItem('mm_orders', JSON.stringify(orders));
                localStorage.setItem('mm_stock', JSON.stringify(inventory));
                if (window.lucide) lucide.createIcons();
            }, [orders, inventory, view, selectedProduct, showPayment]);

            // --- LOGIC ---
            const subtotal = useMemo(() => cart.reduce((s, i) => s + i.totalPrice, 0), [cart]);

            const handleAddToCart = (config) => {
                setCart([...cart, { ...config, tempId: Date.now() }]);
                setSelectedProduct(null);
            };

            const handlePayment = (method) => {
                const newOrder = {
                    id: `ORD-${Date.now()}`,
                    items: cart,
                    total: subtotal,
                    method,
                    status: 'PENDING',
                    timestamp: new Date().toISOString()
                };

                // ตัดสต็อก BOM
                let nextInv = [...inventory];
                cart.forEach(item => {
                    const recipe = BOM_RECIPES[item.id]?.[item.size];
                    if (recipe) {
                        Object.keys(recipe).forEach(ingId => {
                            const idx = nextInv.findIndex(i => i.id === ingId);
                            if (idx > -1) nextInv[idx].stock -= recipe[ingId];
                        });
                    }
                });

                setInventory(nextInv);
                setOrders([newOrder, ...orders]);
                setCart([]);
                setShowPayment(false);
                alert("ชำระเงินสำเร็จ! ออเดอร์ส่งเข้าครัวแล้ว");
            };

            // --- VIEWS ---
            
            // 1. POS VIEW
            const POSView = () => (
                <div className="flex h-full overflow-hidden">
                    <div className="flex-1 flex flex-col p-6 overflow-y-auto no-scrollbar">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-slate-800">สั่งเครื่องดื่ม</h2>
                            <div className="relative w-64">
                                <i data-lucide="search" className="absolute left-3 top-2.5 text-slate-400 w-4 h-4"></i>
                                <input 
                                    type="text" placeholder="ค้นหาเมนู..." 
                                    className="w-full pl-10 pr-4 py-2 rounded-xl border-none shadow-sm focus:ring-2 focus:ring-indigo-500"
                                    value={search} onChange={(e) => setSearch(e.target.value)}
                                />
                            </div>
                        </div>

                        <div className="flex space-x-3 mb-8 overflow-x-auto no-scrollbar pb-2">
                            {CATEGORIES.map(c => (
                                <button 
                                    key={c} onClick={() => setActiveCat(c)}
                                    className={`px-6 py-2 rounded-full font-medium transition-all whitespace-nowrap ${activeCat === c ? 'bg-indigo-600 text-white shadow-lg' : 'bg-white text-slate-600 hover:bg-slate-100'}`}
                                >{c}</button>
                            ))}
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                            {PRODUCTS.filter(p => (activeCat === "ทั้งหมด" || p.category === activeCat) && p.name.includes(search)).map(p => (
                                <div 
                                    key={p.id} onClick={() => setSelectedProduct(p)}
                                    className={`product-card ${p.color} p-6 rounded-[2.5rem] shadow-sm hover:shadow-xl transition-all cursor-pointer flex flex-col items-center text-center group`}
                                >
                                    <div className="text-5xl mb-4 group-hover:scale-110 transition-transform">{p.image}</div>
                                    <h3 className="font-bold text-slate-800">{p.name}</h3>
                                    <p className="text-indigo-600 font-black mt-1">฿{p.price}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Cart Sidebar */}
                    <div className="w-96 bg-white border-l shadow-2xl flex flex-col">
                        <div className="p-6 border-b flex justify-between items-center">
                            <h3 className="font-bold text-xl flex items-center"><i data-lucide="shopping-basket" className="mr-2"></i> ตะกร้า</h3>
                            <button onClick={() => setCart([])} className="text-slate-400 hover:text-red-500"><i data-lucide="trash-2" className="w-5 h-5"></i></button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-6 space-y-4">
                            {cart.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-300">
                                    <i data-lucide="coffee" className="w-16 h-16 mb-4 opacity-20"></i>
                                    <p>ยังไม่มีรายการ</p>
                                </div>
                            ) : cart.map(item => (
                                <div key={item.tempId} className="bg-slate-50 p-4 rounded-2xl flex justify-between items-center animate-slide-in">
                                    <div>
                                        <p className="font-bold text-sm">{item.name} ({item.size})</p>
                                        <p className="text-[10px] text-slate-500 uppercase tracking-wider">หวาน {item.sweetness} | {item.toppings.join(', ') || 'Original'}</p>
                                        <p className="text-indigo-600 font-bold mt-1">฿{item.totalPrice}</p>
                                    </div>
                                    <button onClick={() => setCart(cart.filter(c => c.tempId !== item.tempId))} className="text-slate-300 hover:text-red-500"><i data-lucide="x-circle" className="w-5 h-5"></i></button>
                                </div>
                            ))}
                        </div>
                        <div className="p-8 bg-slate-50 border-t space-y-6">
                            <div className="flex justify-between items-end">
                                <span className="text-slate-500 font-medium">ยอดรวมสุทธิ</span>
                                <span className="text-4xl font-black text-slate-800">฿{subtotal.toLocaleString()}</span>
                            </div>
                            <button 
                                disabled={cart.length === 0}
                                onClick={() => setShowPayment(true)}
                                className="w-full py-5 bg-indigo-600 text-white rounded-3xl font-bold text-xl shadow-xl shadow-indigo-200 hover:bg-indigo-700 disabled:bg-slate-300 transition-all"
                            >ชำระเงิน</button>
                        </div>
                    </div>
                </div>
            );

            // 2. KDS VIEW
            const KDSView = () => (
                <div className="p-8 h-full overflow-y-auto">
                    <div className="flex justify-between items-center mb-8">
                        <h2 className="text-3xl font-bold text-slate-800">จอครัว (KDS)</h2>
                        <div className="flex space-x-4">
                            <span className="flex items-center text-sm text-slate-500"><span className="w-3 h-3 bg-amber-400 rounded-full mr-2"></span> รอดำเนินการ</span>
                            <span className="flex items-center text-sm text-slate-500"><span className="w-3 h-3 bg-blue-500 rounded-full mr-2"></span> กำลังทำ</span>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        {orders.filter(o => o.status !== 'COMPLETED').map(order => (
                            <div key={order.id} className={`glass-card rounded-[2rem] overflow-hidden border-t-8 shadow-lg ${order.status === 'PENDING' ? 'border-amber-400' : 'border-blue-500'}`}>
                                <div className="p-5 border-b bg-white/50 flex justify-between items-center">
                                    <span className="font-black text-lg">#{order.id.slice(-4)}</span>
                                    <span className="text-xs text-slate-400">{new Date(order.timestamp).toLocaleTimeString()}</span>
                                </div>
                                <div className="p-5 space-y-4 min-h-[150px]">
                                    {order.items.map((item, idx) => (
                                        <div key={idx} className="border-b border-dashed border-slate-200 pb-2">
                                            <div className="font-bold text-slate-800">{item.name} <span className="text-indigo-600">[{item.size}]</span></div>
                                            <div className="text-xs text-slate-500">หวาน: {item.sweetness}</div>
                                            {item.toppings.length > 0 && <div className="text-[10px] text-orange-500 font-bold mt-1">TOP: {item.toppings.join(', ')}</div>}
                                        </div>
                                    ))}
                                </div>
                                <div className="p-4">
                                    {order.status === 'PENDING' ? (
                                        <button onClick={() => setOrders(orders.map(o => o.id === order.id ? {...o, status: 'PREPARING'} : o))} className="w-full py-3 bg-amber-400 text-white rounded-2xl font-bold hover:bg-amber-500 transition-colors">เริ่มทำ</button>
                                    ) : (
                                        <button onClick={() => setOrders(orders.map(o => o.id === order.id ? {...o, status: 'COMPLETED'} : o))} className="w-full py-3 bg-blue-500 text-white rounded-2xl font-bold hover:bg-blue-600 transition-colors">เสร็จสิ้น</button>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            // 3. INVENTORY VIEW
            const InventoryView = () => (
                <div className="p-8 h-full overflow-y-auto">
                    <h2 className="text-3xl font-bold text-slate-800 mb-8">คลังวัตถุดิบ (BOM)</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        {inventory.map(ing => (
                            <div key={ing.id} className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 relative overflow-hidden">
                                <div className="flex justify-between items-start mb-6">
                                    <div className="p-4 bg-indigo-50 rounded-2xl text-indigo-600"><i data-lucide="package"></i></div>
                                    {ing.stock <= ing.min && <span className="bg-red-100 text-red-600 text-[10px] font-black px-3 py-1 rounded-full animate-pulse uppercase">Low Stock</span>}
                                </div>
                                <h3 className="text-slate-400 font-medium text-sm mb-1">{ing.name}</h3>
                                <div className="text-4xl font-black text-slate-800 mb-4">
                                    {ing.stock.toLocaleString()} <span className="text-lg font-normal text-slate-300">{ing.unit}</span>
                                </div>
                                <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                                    <div 
                                        className={`h-full transition-all duration-1000 ${ing.stock <= ing.min ? 'bg-red-500' : 'bg-indigo-500'}`}
                                        style={{ width: `${Math.min((ing.stock / (ing.min * 5)) * 100, 100)}%` }}
                                    ></div>
                                </div>
                                <button onClick={() => {
                                    const amt = prompt("ระบุจำนวนที่ต้องการเติม:");
                                    if(amt) setInventory(inventory.map(i => i.id === ing.id ? {...i, stock: i.stock + parseInt(amt)} : i));
                                }} className="mt-6 text-indigo-600 text-sm font-bold flex items-center hover:underline"><i data-lucide="plus-circle" className="w-4 h-4 mr-1"></i> เติมสต็อก</button>
                            </div>
                        ))}
                    </div>
                </div>
            );

            // 4. REPORTS VIEW
            const ReportsView = () => {
                useEffect(() => {
                    const ctx = document.getElementById('salesChart');
                    if (ctx) {
                        if (chartRef.current) chartRef.current.destroy();
                        const last7Days = [...Array(7)].map((_, i) => {
                            const d = new Date(); d.setDate(d.getDate() - i);
                            return d.toISOString().split('T')[0];
                        }).reverse();
                        const data = last7Days.map(d => orders.filter(o => o.timestamp.startsWith(d)).reduce((s, o) => s + o.total, 0));
                        
                        chartRef.current = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: last7Days,
                                datasets: [{
                                    label: 'ยอดขาย', data, borderColor: '#4f46e5', tension: 0.4, fill: true, backgroundColor: 'rgba(79, 70, 229, 0.05)', borderWidth: 4, pointRadius: 0
                                }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
                        });
                    }
                }, []);

                return (
                    <div className="p-8 h-full overflow-y-auto">
                        <h2 className="text-3xl font-bold text-slate-800 mb-8">รายงานวิเคราะห์</h2>
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                            <div className="lg:col-span-2 bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                                <h3 className="font-bold text-slate-800 mb-6">แนวโน้มยอดขาย</h3>
                                <div className="h-64"><canvas id="salesChart"></canvas></div>
                            </div>
                            <div className="space-y-6">
                                <div className="bg-indigo-600 p-8 rounded-[2.5rem] text-white shadow-xl shadow-indigo-200">
                                    <p className="text-indigo-100 text-sm">รายได้รวม</p>
                                    <h4 className="text-4xl font-black">฿{orders.reduce((s, o) => s + o.total, 0).toLocaleString()}</h4>
                                </div>
                                <div className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                                    <p className="text-slate-400 text-sm">จำนวนออเดอร์</p>
                                    <h4 className="text-4xl font-black text-slate-800">{orders.length} <span className="text-lg font-normal text-slate-300">บิล</span></h4>
                                </div>
                            </div>
                        </div>
                        <div className="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                            <div className="p-6 border-b font-bold">ประวัติการขายล่าสุด</div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left">
                                    <thead className="bg-slate-50 text-slate-400 text-xs uppercase">
                                        <tr><th className="px-6 py-4">ID</th><th className="px-6 py-4">เวลา</th><th className="px-6 py-4">ยอดรวม</th><th className="px-6 py-4">สถานะ</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {orders.slice(0, 10).map(o => (
                                            <tr key={o.id} className="text-sm hover:bg-slate-50 transition-colors">
                                                <td className="px-6 py-4 font-bold">#{o.id.slice(-6)}</td>
                                                <td className="px-6 py-4 text-slate-500">{new Date(o.timestamp).toLocaleString()}</td>
                                                <td className="px-6 py-4 font-black text-indigo-600">฿{o.total}</td>
                                                <td className="px-6 py-4"><span className={`px-3 py-1 rounded-full text-[10px] font-bold ${o.status === 'COMPLETED' ? 'bg-green-100 text-green-600' : 'bg-amber-100 text-amber-600'}`}>{o.status}</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- MODALS ---
            const ModifierModal = () => {
                if (!selectedProduct) return null;
                const [size, setSize] = useState('M');
                const [sweet, setSweet] = useState('100%');
                const [tops, setTops] = useState([]);

                const price = selectedProduct.price + 
                    (MODIFIERS.sizes.find(s => s.label === size).price) +
                    tops.reduce((s, t) => s + MODIFIERS.toppings.find(mt => mt.label === t).price, 0);

                return (
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-50">
                        <div className="bg-white w-full max-w-lg rounded-[3rem] overflow-hidden shadow-2xl animate-slide-in">
                            <div className="p-8 border-b flex justify-between items-center">
                                <div>
                                    <h3 className="text-2xl font-bold text-slate-800">{selectedProduct.name}</h3>
                                    <p className="text-slate-400 text-sm">ปรับแต่งเครื่องดื่มของคุณ</p>
                                </div>
                                <button onClick={() => setSelectedProduct(null)} className="p-2 hover:bg-slate-100 rounded-full transition-colors"><i data-lucide="x" className="w-6 h-6 text-slate-400"></i></button>
                            </div>
                            <div className="p-8 space-y-8 max-h-[60vh] overflow-y-auto no-scrollbar">
                                <div>
                                    <label className="block font-bold text-slate-700 mb-4">ขนาดแก้ว</label>
                                    <div className="grid grid-cols-3 gap-4">
                                        {MODIFIERS.sizes.map(s => (
                                            <button key={s.label} onClick={() => setSize(s.label)} className={`py-4 rounded-2xl font-bold border-2 transition-all ${size === s.label ? 'border-indigo-600 bg-indigo-50 text-indigo-600 shadow-md' : 'border-slate-100 text-slate-400'}`}>
                                                {s.label} <span className="block text-[10px] font-normal">+฿{s.price}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <label className="block font-bold text-slate-700 mb-4">ความหวาน</label>
                                    <div className="grid grid-cols-4 gap-3">
                                        {MODIFIERS.sweetness.map(sw => (
                                            <button key={sw} onClick={() => setSweet(sw)} className={`py-3 rounded-xl text-xs font-bold border-2 transition-all ${sweet === sw ? 'border-indigo-600 bg-indigo-50 text-indigo-600' : 'border-slate-100 text-slate-400'}`}>{sw}</button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <label className="block font-bold text-slate-700 mb-4">ท็อปปิ้ง</label>
                                    <div className="grid grid-cols-2 gap-4">
                                        {MODIFIERS.toppings.map(t => (
                                            <button 
                                                key={t.label} 
                                                onClick={() => tops.includes(t.label) ? setTops(tops.filter(x => x !== t.label)) : setTops([...tops, t.label])}
                                                className={`p-4 rounded-2xl text-left font-bold border-2 transition-all flex justify-between items-center ${tops.includes(t.label) ? 'border-indigo-600 bg-indigo-50 text-indigo-600 shadow-sm' : 'border-slate-100 text-slate-400'}`}
                                            >
                                                <span>{t.label}</span>
                                                <span className="text-[10px] font-normal">+฿{t.price}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            <div className="p-8 bg-slate-50">
                                <button 
                                    onClick={() => handleAddToCart({ ...selectedProduct, size, sweetness: sweet, toppings: tops, totalPrice: price })}
                                    className="w-full py-5 bg-indigo-600 text-white rounded-[2rem] font-bold text-xl shadow-xl shadow-indigo-200 hover:bg-indigo-700 transition-all"
                                >เพิ่มลงตะกร้า ฿{price}</button>
                            </div>
                        </div>
                    </div>
                );
            };

            const PaymentModal = () => {
                if (!showPayment) return null;
                return (
                    <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xl flex items-center justify-center p-4 z-50">
                        <div className="bg-white w-full max-w-md rounded-[3.5rem] overflow-hidden shadow-2xl p-10 text-center animate-slide-in">
                            <div className="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-6">
                                <i data-lucide="credit-card" className="w-10 h-10"></i>
                            </div>
                            <h3 className="text-slate-400 font-medium mb-2">ยอดชำระทั้งหมด</h3>
                            <div className="text-6xl font-black text-slate-800 mb-10">฿{subtotal.toLocaleString()}</div>
                            <div className="grid grid-cols-1 gap-4">
                                <button onClick={() => handlePayment('CASH')} className="flex items-center justify-between p-6 bg-emerald-50 border-2 border-emerald-500 rounded-[2rem] text-emerald-700 font-bold hover:bg-emerald-100 transition-all">
                                    <span className="flex items-center"><i data-lucide="banknote" className="mr-3"></i> เงินสด</span>
                                    <i data-lucide="chevron-right"></i>
                                </button>
                                <button onClick={() => handlePayment('QR')} className="flex items-center justify-between p-6 bg-blue-50 border-2 border-blue-500 rounded-[2rem] text-blue-700 font-bold hover:bg-blue-100 transition-all">
                                    <span className="flex items-center"><i data-lucide="qr-code" className="mr-3"></i> PromptPay / QR</span>
                                    <i data-lucide="chevron-right"></i>
                                </button>
                                <button onClick={() => setShowPayment(false)} className="mt-6 text-slate-400 font-bold hover:text-slate-600 transition-colors">ยกเลิก</button>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- MAIN RENDER ---
            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <div className="w-24 bg-white border-r flex flex-col items-center py-10 space-y-10 shadow-sm z-10">
                        <div className="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-200">M</div>
                        <nav className="flex flex-col space-y-6">
                            <button onClick={() => setView('pos')} className={`sidebar-item p-4 rounded-2xl transition-all ${view === 'pos' ? 'active' : 'text-slate-300 hover:text-indigo-600'}`}><i data-lucide="layout-grid"></i></button>
                            <button onClick={() => setView('kds')} className={`sidebar-item p-4 rounded-2xl transition-all ${view === 'kds' ? 'active' : 'text-slate-300 hover:text-indigo-600'}`}><i data-lucide="monitor"></i></button>
                            <button onClick={() => setView('inventory')} className={`sidebar-item p-4 rounded-2xl transition-all ${view === 'inventory' ? 'active' : 'text-slate-300 hover:text-indigo-600'}`}><i data-lucide="package"></i></button>
                            <button onClick={() => setView('reports')} className={`sidebar-item p-4 rounded-2xl transition-all ${view === 'reports' ? 'active' : 'text-slate-300 hover:text-indigo-600'}`}><i data-lucide="bar-chart-3"></i></button>
                        </nav>
                        <div className="mt-auto">
                            <button className="p-4 text-slate-300 hover:text-red-500 transition-colors"><i data-lucide="log-out"></i></button>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col overflow-hidden">
                        {view === 'pos' && <POSView />}
                        {view === 'kds' && <KDSView />}
                        {view === 'inventory' && <InventoryView />}
                        {view === 'reports' && <ReportsView />}
                    </div>

                    {/* Modals */}
                    <ModifierModal />
                    <PaymentModal />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
