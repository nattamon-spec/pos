<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuayMoney ERP - Inventory & Analytics Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .chart-container { position: relative; height: 300px; width: 100%; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Data Definitions ---
        const PRODUCTS = [
            { id: 'p1', name: 'ชาไทย', price: 45, category: 'Tea', image: '🥤' },
            { id: 'p2', name: 'ชาเขียว', price: 45, category: 'Tea', image: '🍵' },
            { id: 'p3', name: 'โกโก้', price: 50, category: 'Cocoa', image: '🍫' },
            { id: 'p4', name: 'นมสด', price: 40, category: 'Milk', image: '🥛' },
            { id: 'p5', name: 'โอริโอ้ปั่น', price: 65, category: 'Smoothie', image: '🍪' },
            { id: 'p6', name: 'ชาพีช', price: 55, category: 'Tea', image: '🍑' },
        ];

        // สูตรการตัดสต็อก (BOM) ต่อ 1 หน่วย
        const BOM_RECIPES = {
            'p1': { 'S': { 'ing1': 15, 'ing2': 100, 'cupS': 1 }, 'M': { 'ing1': 20, 'ing2': 150, 'cupM': 1 }, 'L': { 'ing1': 25, 'ing2': 200, 'cupL': 1 } },
            'p2': { 'S': { 'ing3': 15, 'ing2': 100, 'cupS': 1 }, 'M': { 'ing3': 20, 'ing2': 150, 'cupM': 1 }, 'L': { 'ing3': 25, 'ing2': 200, 'cupL': 1 } },
            'p3': { 'S': { 'ing4': 20, 'ing2': 100, 'cupS': 1 }, 'M': { 'ing4': 30, 'ing2': 150, 'cupM': 1 }, 'L': { 'ing4': 40, 'ing2': 200, 'cupL': 1 } },
            // ... อื่นๆ
        };

        const INITIAL_INGREDIENTS = [
            { id: 'ing1', name: 'ผงชาไทย', stock: 1000, unit: 'g', min: 200 },
            { id: 'ing2', name: 'นมสด', stock: 5000, unit: 'ml', min: 1000 },
            { id: 'ing3', name: 'ผงชาเขียว', stock: 800, unit: 'g', min: 200 },
            { id: 'ing4', name: 'ผงโกโก้', stock: 1200, unit: 'g', min: 300 },
            { id: 'cupS', name: 'แก้ว S', stock: 100, unit: 'ใบ', min: 20 },
            { id: 'cupM', name: 'แก้ว M', stock: 100, unit: 'ใบ', min: 20 },
            { id: 'cupL', name: 'แก้ว L', stock: 100, unit: 'ใบ', min: 20 },
        ];

        function App() {
            const [view, setView] = useState('pos');
            const [cart, setCart] = useState([]);
            const [orders, setOrders] = useState(JSON.parse(localStorage.getItem('orders')) || []);
            const [ingredients, setIngredients] = useState(JSON.parse(localStorage.getItem('ingredients')) || INITIAL_INGREDIENTS);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [showPayment, setShowPayment] = useState(false);
            const chartRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('orders', JSON.stringify(orders));
                localStorage.setItem('ingredients', JSON.stringify(ingredients));
            }, [orders, ingredients]);

            // --- Inventory Logic (BOM Cutting) ---
            const cutStock = (items) => {
                let newIngredients = [...ingredients];
                items.forEach(item => {
                    const recipe = BOM_RECIPES[item.id]?.[item.size];
                    if (recipe) {
                        Object.keys(recipe).forEach(ingId => {
                            const ingIndex = newIngredients.findIndex(i => i.id === ingId);
                            if (ingIndex > -1) {
                                newIngredients[ingIndex].stock -= (recipe[ingId] * item.quantity);
                            }
                        });
                    }
                });
                setIngredients(newIngredients);
            };

            const completeOrder = (paymentMethod) => {
                const subtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
                const newOrder = {
                    id: `INV-${Date.now()}`,
                    items: cart,
                    total: subtotal,
                    payment: paymentMethod,
                    status: 'PENDING',
                    timestamp: new Date().toISOString()
                };
                
                cutStock(cart); // ตัดสต็อกทันทีที่จ่ายเงิน
                setOrders([newOrder, ...orders]);
                setCart([]);
                setShowPayment(false);
            };

            // --- Components ---
            const Sidebar = () => (
                <div className="w-20 bg-slate-900 h-screen flex flex-col items-center py-8 text-white space-y-8 shadow-2xl">
                    <div className="font-black text-2xl text-indigo-400">MM</div>
                    <NavItem id="pos" icon="layout-grid" active={view === 'pos'} />
                    <NavItem id="kds" icon="chef-hat" active={view === 'kds'} />
                    <NavItem id="inventory" icon="package" active={view === 'inventory'} />
                    <NavItem id="reports" icon="bar-chart-3" active={view === 'reports'} />
                </div>
            );

            const NavItem = ({ id, icon, active }) => (
                <button onClick={() => setView(id)} className={`p-3 rounded-2xl transition-all ${active ? 'bg-indigo-600 shadow-lg shadow-indigo-500/50' : 'hover:bg-slate-800 text-slate-400'}`}>
                    <i data-lucide={icon}></i>
                </button>
            );

            // --- Inventory View ---
            const InventoryView = () => (
                <div className="flex-1 p-8 overflow-y-auto">
                    <div className="flex justify-between items-center mb-8">
                        <h2 className="text-3xl font-bold text-slate-800">จัดการสต็อกวัตถุดิบ (BOM)</h2>
                        <button onClick={() => setIngredients(INITIAL_INGREDIENTS)} className="text-sm text-indigo-600 font-bold">รีเซ็ตสต็อก</button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {ingredients.map(ing => (
                            <div key={ing.id} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                <div className="flex justify-between items-start mb-4">
                                    <div className="p-3 bg-indigo-50 rounded-2xl text-indigo-600">
                                        <i data-lucide="droplet"></i>
                                    </div>
                                    {ing.stock <= ing.min && (
                                        <span className="bg-red-100 text-red-600 text-xs font-bold px-3 py-1 rounded-full animate-pulse">ของใกล้หมด!</span>
                                    )}
                                </div>
                                <h3 className="font-bold text-slate-500 text-sm mb-1">{ing.name}</h3>
                                <div className="text-3xl font-black text-slate-800">
                                    {ing.stock.toLocaleString()} <span className="text-lg font-normal text-slate-400">{ing.unit}</span>
                                </div>
                                <div className="mt-4 w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                    <div 
                                        className={`h-full transition-all ${ing.stock <= ing.min ? 'bg-red-500' : 'bg-indigo-500'}`} 
                                        style={{ width: `${Math.min((ing.stock / 2000) * 100, 100)}%` }}
                                    ></div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            // --- Reports View ---
            const ReportsView = () => {
                useEffect(() => {
                    const ctx = document.getElementById('salesChart');
                    if (ctx) {
                        if (chartRef.current) chartRef.current.destroy();
                        
                        // ประมวลผลข้อมูลยอดขาย 7 วันล่าสุด
                        const last7Days = [...Array(7)].map((_, i) => {
                            const d = new Date();
                            d.setDate(d.getDate() - i);
                            return d.toISOString().split('T')[0];
                        }).reverse();

                        const salesData = last7Days.map(date => {
                            return orders
                                .filter(o => o.timestamp.startsWith(date))
                                .reduce((sum, o) => sum + o.total, 0);
                        });

                        chartRef.current = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: last7Days,
                                datasets: [{
                                    label: 'ยอดขาย (บาท)',
                                    data: salesData,
                                    borderColor: '#4f46e5',
                                    backgroundColor: 'rgba(79, 70, 229, 0.1)',
                                    fill: true,
                                    tension: 0.4,
                                    borderWidth: 4,
                                    pointRadius: 6,
                                    pointBackgroundColor: '#4f46e5'
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { display: false } },
                                scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false } } }
                            }
                        });
                    }
                }, [orders]);

                const totalRevenue = orders.reduce((sum, o) => sum + o.total, 0);
                const totalOrders = orders.length;

                return (
                    <div className="flex-1 p-8 overflow-y-auto">
                        <h2 className="text-3xl font-bold text-slate-800 mb-8">รายงานและการวิเคราะห์</h2>
                        
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div className="bg-indigo-600 p-8 rounded-[2rem] text-white shadow-xl shadow-indigo-200">
                                <div className="text-indigo-100 text-sm font-medium mb-2">รายได้รวมทั้งหมด</div>
                                <div className="text-4xl font-black">฿{totalRevenue.toLocaleString()}</div>
                            </div>
                            <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                                <div className="text-slate-400 text-sm font-medium mb-2">จำนวนออเดอร์</div>
                                <div className="text-4xl font-black text-slate-800">{totalOrders} <span className="text-lg font-normal text-slate-400">บิล</span></div>
                            </div>
                            <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                                <div className="text-slate-400 text-sm font-medium mb-2">ยอดเฉลี่ยต่อบิล</div>
                                <div className="text-4xl font-black text-slate-800">฿{totalOrders > 0 ? (totalRevenue / totalOrders).toFixed(0) : 0}</div>
                            </div>
                        </div>

                        <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 mb-8">
                            <h3 className="font-bold text-slate-800 mb-6">แนวโน้มยอดขาย 7 วันล่าสุด</h3>
                            <div className="chart-container">
                                <canvas id="salesChart"></canvas>
                            </div>
                        </div>

                        <div className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden">
                            <div className="p-6 border-b font-bold text-slate-800">ประวัติการขายล่าสุด</div>
                            <table className="w-full text-left">
                                <thead className="bg-slate-50 text-slate-400 text-xs uppercase">
                                    <tr>
                                        <th className="px-6 py-4">เลขที่บิล</th>
                                        <th className="px-6 py-4">เวลา</th>
                                        <th className="px-6 py-4">ยอดรวม</th>
                                        <th className="px-6 py-4">การชำระเงิน</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {orders.slice(0, 5).map(o => (
                                        <tr key={o.id} className="text-sm text-slate-600">
                                            <td className="px-6 py-4 font-bold">#{o.id.slice(-6)}</td>
                                            <td className="px-6 py-4">{new Date(o.timestamp).toLocaleString('th-TH')}</td>
                                            <td className="px-6 py-4 font-bold text-indigo-600">฿{o.total}</td>
                                            <td className="px-6 py-4"><span className="px-3 py-1 bg-slate-100 rounded-full text-xs">{o.payment}</span></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            // --- POS & KDS (จากโค้ดเดิมที่ปรับปรุงแล้ว) ---
            // ... (ส่วน POSView, KDSView, Modals จะเหมือนเดิมแต่เพิ่มการเรียกใช้ cutStock ใน completeOrder)

            useEffect(() => { lucide.createIcons(); }, [view, selectedProduct, showPayment, orders, ingredients]);

            return (
                <div className="flex h-screen overflow-hidden">
                    <Sidebar />
                    <div className="flex-1 flex flex-col overflow-hidden">
                        {view === 'pos' && <div className="p-10 text-center">หน้าขาย (POS) - ใช้โค้ดเดิมที่เชื่อมต่อ completeOrder ใหม่</div>}
                        {view === 'kds' && <div className="p-10 text-center">หน้าจอครัว (KDS) - ใช้โค้ดเดิม</div>}
                        {view === 'inventory' && <InventoryView />}
                        {view === 'reports' && <ReportsView />}
                    </div>
                    {/* Modals จะอยู่ตรงนี้ */}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
