<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lue cha POS | Master Foundation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-scale:active { transform: scale(0.95); transition: 0.1s; }
        .luecha-blue { background-color: #003399; }
        .luecha-orange { background-color: #FF6600; }
        .btn-teal { background-color: #2497a9; }
        .text-teal { color: #2497a9; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

  // ==========================================
        // PART 1: DATABASE (โครงสร้างฐานข้อมูล)
        // ==========================================
        const db = new Dexie("LueCha_POS_ULTIMATE_V1");
        db.version(4).stores({ // ขยับเป็น Version 4 เพื่อความสดใหม่
            products: "++id, name, price, cost, categoryId",
            categories: "++id, name",
            modifierGroups: "++id, name, selectionType, applyTo, targetIds, targetCategoryIds, isRequired",
            orders: "++id, total, timestamp, paymentMethod, items"
        });
            // ==========================================
            // PART 2: STATES (ตัวแปรควบคุมระบบ)
            // ==========================================
            const [view, setView] = useState('pos');
            const [adminTab, setAdminTab] = useState('products');
            const [products, setProducts] = useState([]);
            const [categories, setCategories] = useState([]);
            const [modifiers, setModifiers] = useState([]);
            const [orders, setOrders] = useState([]);
            const [cart, setCart] = useState([]);

            // Modals
            const [selectedItem, setSelectedItem] = useState(null); 
            const [showProductModal, setShowProductModal] = useState(false); 
            const [showModifierModal, setShowModifierModal] = useState(false); 
            const [editingProduct, setEditingProduct] = useState(null);
            const [editingModifier, setEditingModifier] = useState(null);
            const [showPayment, setShowPayment] = useState(false); 

            // Selection (Image 5)
            const [qty, setQty] = useState(1);
            const [size, setSize] = useState('S');
            const [activeToppings, setActiveToppings] = useState([]);

            // Form States (Image 7 & 8)
            const [form, setForm] = useState({ name: '', price: '', cost: '', categoryId: 1 });
            const [modForm, setModForm] = useState({
                name: '', selectionType: 'single', applyTo: 'all', targetIds: [], targetCategoryIds: [], isRequired: false,
                options: [{ name: '', price: 0, cost: 0, isDefault: false }]
            });
            const [openSection, setOpenSection] = useState('category');

            // Payment
            const [cashReceived, setCashReceived] = useState(0);
            const [paymentMethod, setPaymentMethod] = useState('cash');
            // ==========================================
            // PART 3: INITIALIZATION
            // ==========================================
            useEffect(() => {
                const init = async () => {
                    if (await db.categories.count() === 0) {
                        await db.categories.bulkAdd([{ name: "เครื่องดื่ม" }, { name: "พิเศษ" }]);
                    }
                    refreshData();
                };
                init();
            }, []);

            const refreshData = async () => {
                setProducts(await db.products.toArray());
                setCategories(await db.categories.toArray());
                setModifiers(await db.modifierGroups.toArray());
                setOrders(await db.orders.toArray());
            };

           // ==========================================
            // PART 4: LOGIC
            // ==========================================
            const currentItemTotal = useMemo(() => {
                if (!selectedItem) return 0;
                let base = Number(selectedItem.price);
                if (size === 'M') base += 5;
                if (size === 'L') base += 10;
                const toppingSum = activeToppings.reduce((s, t) => s + Number(t.price), 0);
                return (base + toppingSum) * Number(qty);
            }, [selectedItem, size, activeToppings, qty]);

            const cartTotal = useMemo(() => cart.reduce((s, i) => s + Number(i.totalPrice), 0), [cart]);
            const changeAmount = useMemo(() => Math.max(0, Number(cashReceived) - cartTotal), [cashReceived, cartTotal]);

            // แก้ไข Logic การตรวจสอบความถูกต้อง (Required) ให้เช็คหมวดหมู่ด้วย
            const isSelectionValid = useMemo(() => {
                if (!selectedItem) return false;
                const relevantModifiers = modifiers.filter(m => 
                    m.applyTo === 'all' || 
                    (m.applyTo === 'products' && m.targetIds.includes(selectedItem.id)) ||
                    (m.applyTo === 'categories' && m.targetCategoryIds?.includes(Number(selectedItem.categoryId)))
                );
                const requiredGroups = relevantModifiers.filter(m => m.isRequired);
                return requiredGroups.every(group => activeToppings.some(t => t.groupId === group.id));
            }, [selectedItem, modifiers, activeToppings]);

            const handleAddToCart = () => {
                const item = { ...selectedItem, cartId: Date.now(), qty, size, toppings: activeToppings, totalPrice: currentItemTotal };
                setCart([...cart, item]);
                setSelectedItem(null);
            };

            const handleSaveProduct = async () => {
                if(!form.name || !form.price) return alert("กรุณากรอกชื่อและราคา");
                const data = { ...form, price: Number(form.price), cost: Number(form.cost || 0), categoryId: Number(form.categoryId || 1) };
                if (editingProduct) data.id = editingProduct.id;
                await db.products.put(data);
                setShowProductModal(false);
                setEditingProduct(null);
                refreshData();
            };

            const handleSaveModifierGroup = async () => {
                if(!modForm.name) return alert("กรุณาระบุชื่อกลุ่มตัวเลือก");
                const data = { ...modForm };
                if (editingModifier) data.id = editingModifier.id;
                await db.modifierGroups.put(data);
                setShowModifierModal(false);
                setEditingModifier(null);
                // รีเซ็ตฟอร์มให้มี targetCategoryIds ด้วย
                setModForm({ name: '', selectionType: 'single', applyTo: 'all', targetIds: [], targetCategoryIds: [], isRequired: false, options: [{ name: '', price: 0, cost: 0, isDefault: false }] });
                refreshData();
            };

            const handleAddCategory = async () => {
                const name = prompt("ชื่อหมวดหมู่ใหม่:");
                if (name) { await db.categories.add({ name }); refreshData(); }
            };

            const handleEditCategory = async (c) => {
                const newName = prompt("แก้ไขชื่อหมวดหมู่:", c.name);
                if (newName) { await db.categories.update(c.id, { name: newName }); refreshData(); }
            };

            const handleDeleteCategory = async (id) => {
                if (confirm("ลบหมวดหมู่?")) { await db.categories.delete(id); refreshData(); }
            };

            const handleConfirmPayment = async () => {
                if (paymentMethod === 'cash' && Number(cashReceived) < cartTotal) return alert("เงินไม่พอ");
                await db.orders.add({ total: cartTotal, timestamp: new Date(), paymentMethod, items: cart });
                setCart([]); setShowPayment(false); setCashReceived(0);
                refreshData();
                alert("ชำระเงินสำเร็จ!");
            };

         // ==========================================
            // PART 5: UI RENDER (ส่วนแสดงผลหลัก - ซ่อมแซมแล้ว)
            // ==========================================
            return (
                <div className="h-screen flex flex-col overflow-hidden bg-slate-50">
                    {/* Header */}
                    <header className="luecha-blue p-4 text-white flex justify-between items-center shadow-lg z-10">
                        <h1 className="font-bold text-xl">เลื่องชื่อลือชา POS</h1>
                        <div className="flex gap-2">
                            <button onClick={() => setView('pos')} className={`px-4 py-1.5 rounded-full text-sm font-medium transition-all ${view==='pos'?'luecha-orange shadow-inner':'opacity-60 hover:opacity-100'}`}>หน้าขาย</button>
                            <button onClick={() => setView('admin')} className={`px-4 py-1.5 rounded-full text-sm font-medium transition-all ${view==='admin'?'luecha-orange shadow-inner':'opacity-60 hover:opacity-100'}`}>จัดการร้าน</button>
                            <button onClick={() => setView('report')} className={`px-4 py-1.5 rounded-full text-sm font-medium transition-all ${view==='report'?'luecha-orange shadow-inner':'opacity-60 hover:opacity-100'}`}>รายงาน</button>
                        </div>
                    </header>

                    {/* VIEW: POS (หน้าขาย) */}
                    {view === 'pos' && (
                        <div className="flex-1 flex overflow-hidden">
                            <div className="flex-1 p-4 grid grid-cols-2 md:grid-cols-4 gap-4 overflow-y-auto no-scrollbar bg-slate-100">
                                {products.map(p => (
                                    <button key={p.id} onClick={() => {setSelectedItem(p); setQty(1); setSize('S'); setActiveToppings([]);}}
                                        className="bg-white p-5 rounded-[2rem] shadow-sm active-scale flex flex-col items-center justify-center h-44 border-2 border-transparent hover:border-orange-500 transition-all">
                                        <span className="font-bold text-slate-800 text-lg text-center mb-1">{p.name}</span>
                                        <span className="text-blue-700 font-black text-2xl">{p.price}฿</span>
                                        <span className="text-[10px] text-slate-400 mt-2 uppercase">แตะเพื่อสั่ง</span>
                                    </button>
                                ))}
                                {products.length === 0 && <div className="col-span-full text-center py-20 text-slate-400">ยังไม่มีสินค้าในระบบ</div>}
                            </div>

                            <div className="w-80 md:w-96 bg-white shadow-2xl flex flex-col">
                                <div className="p-6 border-b font-bold text-slate-700 text-lg">ตะกร้าสินค้า ({cart.length})</div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {cart.map(item => (
                                        <div key={item.cartId} className="bg-slate-50 p-4 rounded-2xl relative border border-slate-100">
                                            <div className="flex justify-between font-bold text-slate-800">
                                                <span>{item.name} x{item.qty} ({item.size})</span>
                                                <span>{item.totalPrice}฿</span>
                                            </div>
                                            {item.toppings?.length > 0 && (
                                                <p className="text-xs text-slate-400 mt-1">+ {item.toppings.map(t => t.name).join(', ')}</p>
                                            )}
                                            <button onClick={() => setCart(cart.filter(i => i.cartId !== item.cartId))} className="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full text-xs shadow-md">✕</button>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-6 bg-slate-50 border-t space-y-4">
                                    <div className="flex justify-between text-3xl font-black text-blue-900">
                                        <span>รวม</span>
                                        <span>{cartTotal}฿</span>
                                    </div>
                                    <button onClick={() => setShowPayment(true)} disabled={cart.length===0} className="w-full luecha-orange text-white py-5 rounded-3xl font-bold text-xl active-scale disabled:opacity-30">ชำระเงิน</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* VIEW: ADMIN (จัดการร้าน) */}
                    {view === 'admin' && (
                        <div className="flex-1 flex flex-col bg-white overflow-hidden">
                            <div className="flex border-b bg-slate-50 px-8 pt-4 gap-6">
                                <button onClick={() => setAdminTab('products')} className={`pb-3 font-bold border-b-4 transition-all ${adminTab==='products'?'border-blue-700 text-blue-700':'border-transparent text-slate-400'}`}>สินค้า</button>
                                <button onClick={() => setAdminTab('categories')} className={`pb-3 font-bold border-b-4 transition-all ${adminTab==='categories'?'border-blue-700 text-blue-700':'border-transparent text-slate-400'}`}>หมวดหมู่</button>
                                <button onClick={() => setAdminTab('modifiers')} className={`pb-3 font-bold border-b-4 transition-all ${adminTab==='modifiers'?'border-blue-700 text-blue-700':'border-transparent text-slate-400'}`}>ตัวเลือก</button>
                            </div>

                            <div className="flex-1 p-8 overflow-y-auto">
                                <div className="max-w-4xl mx-auto">
                                    {adminTab === 'products' && (
                                        <div className="space-y-6">
                                            <div className="flex justify-between items-center">
                                                <h2 className="text-2xl font-bold text-slate-800">รายการสินค้า</h2>
                                                <button onClick={() => {setEditingProduct(null); setForm({name:'', price:'', cost:'', categoryId:1}); setShowProductModal(true);}} className="btn-teal text-white px-6 py-2 rounded-xl font-bold active-scale">+ เพิ่มสินค้า</button>
                                            </div>
                                            <div className="grid gap-3">
                                                {products.map(p => (
                                                    <div key={p.id} className="flex justify-between items-center p-5 bg-slate-50 rounded-3xl border border-slate-100">
                                                        <span className="font-bold text-lg text-slate-700">{p.name}</span>
                                                        <div className="flex items-center gap-3">
                                                            <span className="text-blue-600 font-black mr-4">{p.price}฿</span>
                                                            <button onClick={() => {setEditingProduct(p); setForm(p); setShowProductModal(true);}} className="text-teal font-bold bg-teal-50 px-4 py-1.5 rounded-xl text-sm">แก้ไข</button>
                                                            <button onClick={async () => {if(confirm('ลบสินค้า?')) {await db.products.delete(p.id); refreshData();}}} className="text-red-400 font-bold bg-red-50 px-4 py-1.5 rounded-xl text-sm">ลบ</button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {adminTab === 'categories' && (
                                        <div className="space-y-6">
                                            <div className="flex justify-between items-center">
                                                <h2 className="text-2xl font-bold text-slate-800">หมวดหมู่สินค้า</h2>
                                                <button onClick={handleAddCategory} className="btn-teal text-white px-6 py-2 rounded-xl font-bold active-scale">+ เพิ่มหมวดหมู่</button>
                                            </div>
                                            <div className="grid gap-3">
                                                {categories.map(c => (
                                                    <div key={c.id} className="p-5 border rounded-3xl flex justify-between items-center bg-slate-50">
                                                        <span className="font-bold text-slate-700">{c.name}</span>
                                                        <div className="flex gap-2">
                                                            <button onClick={() => handleEditCategory(c)} className="text-teal font-bold bg-teal-50 px-4 py-1.5 rounded-xl text-sm">แก้ไข</button>
                                                            <button onClick={() => handleDeleteCategory(c.id)} className="text-red-400 font-bold bg-red-50 px-4 py-1.5 rounded-xl text-sm">ลบ</button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {adminTab === 'modifiers' && (
                                        <div className="space-y-6">
                                            <div className="flex justify-between items-center">
                                                <h2 className="text-2xl font-bold text-slate-800">กลุ่มตัวเลือกสินค้า</h2>
                                                <button onClick={() => {setEditingModifier(null); setModForm({name:'', selectionType:'single', applyTo:'all', targetIds:[], targetCategoryIds:[], isRequired: false, options:[{name:'', price:0, cost:0, isDefault:false}]}); setShowModifierModal(true);}} className="btn-teal text-white px-6 py-2 rounded-xl font-bold active-scale">+ เพิ่มกลุ่มตัวเลือก</button>
                                            </div>
                                            <div className="grid gap-4">
                                                {modifiers.map(m => (
                                                    <div key={m.id} className="p-6 border rounded-[2rem] bg-slate-50">
                                                        <div className="flex justify-between font-bold mb-3">
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-lg text-slate-800">{m.name}</span>
                                                                {m.isRequired && <span className="bg-red-100 text-red-500 text-[10px] px-2 py-0.5 rounded-full">บังคับ</span>}
                                                            </div>
                                                            <div className="flex gap-2">
                                                                <button onClick={() => {setEditingModifier(m); setModForm(m); setShowModifierModal(true);}} className="text-teal font-bold bg-white border border-teal-100 px-4 py-1.5 rounded-xl text-sm shadow-sm">แก้ไข</button>
                                                                <button onClick={async () => {if(confirm('ลบกลุ่มตัวเลือก?')) {await db.modifierGroups.delete(m.id); refreshData();}}} className="text-red-400 font-bold bg-white border border-red-100 px-4 py-1.5 rounded-xl text-sm shadow-sm">ลบ</button>
                                                            </div>
                                                        </div>
                                                        <div className="flex flex-wrap gap-2">
                                                            {m.options.map((o, i) => <span key={i} className="bg-white px-3 py-1.5 rounded-xl text-xs border border-slate-200 text-slate-500">{o.name} (+{o.price})</span>)}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

               {/* ==========================================
                        PART 6: MODALS
                    ========================================== */}
                    
                    {/* MODAL: IMAGE 5 (Ordering) */}
                    {selectedItem && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white w-full max-w-4xl rounded-[2.5rem] overflow-hidden shadow-2xl animate-in zoom-in-95 duration-200">
                                <div className="p-4 border-b flex justify-between items-center">
                                    <span className="font-bold text-slate-700">ยืนยันจำนวนสินค้า</span>
                                    <button onClick={() => setSelectedItem(null)} className="text-red-500 bg-red-50 w-8 h-8 rounded-full flex items-center justify-center">✕</button>
                                </div>
                                <div className="flex flex-col md:flex-row">
                                    <div className="flex-1 p-8 space-y-8 border-r">
                                        <div className="flex gap-6 items-center bg-slate-50 p-6 rounded-[2rem]">
                                            <div className="w-24 h-24 bg-white rounded-2xl shadow-sm flex items-center justify-center text-4xl">🥤</div>
                                            <div>
                                                <h3 className="text-2xl font-bold">{selectedItem.name}</h3>
                                                <p className="text-slate-400">ราคา {selectedItem.price} บาท</p>
                                            </div>
                                        </div>
                                        <div className="flex justify-between items-center">
                                            <span className="font-bold text-lg">จำนวน</span>
                                            <div className="flex items-center gap-6">
                                                <button onClick={() => setQty(Math.max(1, qty-1))} className="w-12 h-12 rounded-2xl bg-red-50 text-red-500 text-2xl font-bold active-scale">-</button>
                                                <span className="text-3xl font-black w-8 text-center">{qty}</span>
                                                <button onClick={() => setQty(qty+1)} className="w-12 h-12 rounded-2xl bg-blue-50 text-blue-500 text-2xl font-bold active-scale">+</button>
                                            </div>
                                        </div>
                                        <div className="pt-4 border-t flex justify-between text-2xl font-black">
                                            <span>ราคารวม</span>
                                            <span className="text-red-500">{currentItemTotal} บาท</span>
                                        </div>
                                    </div>
                                    <div className="w-full md:w-[400px] p-8 bg-slate-50/30 space-y-8 overflow-y-auto max-h-[400px]">
                                        <div>
                                            <p className="font-bold mb-4">ไซส์ <span className="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full">จำเป็น</span></p>
                                            <div className="grid grid-cols-3 gap-2">
                                                {['S', 'M', 'L'].map(s => (
                                                    <button key={s} onClick={() => setSize(s)}
                                                        className={`py-4 rounded-2xl font-bold border-2 transition-all ${size===s?'btn-teal text-white border-transparent':'bg-white border-slate-100 text-slate-400'}`}>
                                                        {s} <div className="text-[10px] font-normal">{s==='S'?'':s==='M'?'+5':'+10'}</div>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        {/* กรองตัวเลือกตาม สินค้า หรือ หมวดหมู่ */}
                                        {modifiers.filter(m => 
                                            m.applyTo === 'all' || 
                                            (m.applyTo === 'products' && m.targetIds.includes(selectedItem.id)) ||
                                            (m.applyTo === 'categories' && m.targetCategoryIds?.includes(Number(selectedItem.categoryId)))
                                        ).map(group => (
                                            <div key={group.id}>
                                                <p className="font-bold mb-4">
                                                    {group.name} 
                                                    {group.isRequired && <span className="ml-2 bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full">จำเป็น</span>}
                                                </p>
                                                <div className="flex flex-wrap gap-2">
                                                    {group.options.map((opt, idx) => {
                                                        const isSel = activeToppings.find(x => x.name === opt.name && x.groupId === group.id);
                                                        return (
                                                            <button key={idx} onClick={() => {
                                                                if (group.selectionType === 'single') {
                                                                    const filtered = activeToppings.filter(x => x.groupId !== group.id);
                                                                    setActiveToppings([...filtered, {...opt, groupId: group.id}]);
                                                                } else {
                                                                    const next = isSel ? activeToppings.filter(x => !(x.name === opt.name && x.groupId === group.id)) : [...activeToppings, {...opt, groupId: group.id}];
                                                                    setActiveToppings(next);
                                                                }
                                                            }} className={`px-4 py-2 rounded-full border-2 text-sm transition-all ${isSel?'border-teal-500 bg-teal-50 text-teal-600 font-bold':'bg-white border-slate-100 text-slate-400'}`}>
                                                                {opt.name} {opt.price > 0 ? `+${opt.price}` : ''}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="p-6 bg-white border-t">
                                    <button 
                                        onClick={handleAddToCart} 
                                        disabled={!isSelectionValid}
                                        className={`w-full py-5 rounded-2xl font-bold text-xl active-scale flex items-center justify-center gap-2 ${isSelectionValid ? 'btn-teal text-white shadow-lg' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                                    >
                                        🛒 {isSelectionValid ? 'เพิ่มลงตะกร้า' : 'กรุณาเลือกตัวเลือกที่จำเป็น'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

             {/* MODAL: IMAGE 8 (เพิ่ม/แก้ไขกลุ่มตัวเลือก - อัปเดตตามรูปที่ 9) */}
                  {/* MODAL: IMAGE 8 (เพิ่ม/แก้ไขกลุ่มตัวเลือก - FULL VERSION) */}
                    {showModifierModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[110] p-4">
                            <div className="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-300 flex flex-col max-h-[95vh]">
                                {/* Header */}

                                        <button onClick={() => setModForm({...modForm, isRequired: !modForm.isRequired})}

                                    </div>

                                            <div className="flex flex-wrap gap-2 mt-4 p-1">

                                                    return (
                                                        <button key={c.id} 
                                                            onClick={() => {
                                                                const ids = modForm.targetCategoryIds || [];
                                                                const next = isSel ? ids.filter(id => id !== c.id) : [...ids, c.id];
                                                                setModForm({...modForm, targetCategoryIds: next});
                                                            }}
                                                            className={`px-6 py-2 rounded-full text-sm font-bold border-2 transition-all ${isSel ? 'border-teal-500 bg-teal-50 text-teal-600' : 'border-slate-100 text-slate-400 bg-white'}`}
                                                        >
                                                            {c.name}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        )}

                                        {modForm.applyTo === 'products' && (

                                                        <input type="checkbox" checked={modForm.targetIds.includes(p.id)} 
                                                            onChange={e => {
                                                                const ids = e.target.checked ? [...modForm.targetIds, p.id] : modForm.targetIds.filter(id => id !== p.id);
                                                                setModForm({...modForm, targetIds: ids});
                                                            }} className="w-6 h-6 accent-teal-600 rounded-lg" />
                                                        <span className="text-sm font-medium text-slate-700 group-hover:text-teal-600">{p.name}</span>
                                                    </label>

                                            </div>

                                                        value={opt.name} onChange={e => {
                                                            const newOpts = [...modForm.options];
                                                            newOpts[idx].name = e.target.value;
                                                            setModForm({...modForm, options: newOpts});
                                                        }} />
                                                    <input type="number" placeholder="0" className="w-16 bg-slate-50 p-3 rounded-2xl outline-none text-sm text-center border border-transparent focus:border-teal-500"
                                                        value={opt.price} onChange={e => {
                                                            const newOpts = [...modForm.options];
                                                            newOpts[idx].price = Number(e.target.value);
                                                            setModForm({...modForm, options: newOpts});
                                                        }} />
                                                    <input type="number" placeholder="0" className="w-16 bg-slate-50 p-3 rounded-2xl outline-none text-sm text-center border border-transparent focus:border-teal-500"
                                                        value={opt.cost} onChange={e => {
                                                            const newOpts = [...modForm.options];
                                                            newOpts[idx].cost = Number(e.target.value);
                                                            setModForm({...modForm, options: newOpts});
                                                        }} />
                                                    <button onClick={() => {
                                                        const newOpts = [...modForm.options];
                                                        newOpts[idx].isDefault = !newOpts[idx].isDefault;
                                                        setModForm({...modForm, options: newOpts});
                                                    }} className={`text-xl transition-colors ${opt.isDefault ? 'text-yellow-400' : 'text-slate-200'}`}>★</button>
                                                    <button onClick={() => {
                                                        const newOpts = modForm.options.filter((_, i) => i !== idx);
                                                        setModForm({...modForm, options: newOpts});
                                                    }} className="text-slate-300 hover:text-red-500 transition-colors">🗑</button>
                                                </div>
                                            ))}
                                            <button onClick={() => setModForm({...modForm, options: [...modForm.options, {name:'', price:0, cost:0, isDefault:false}]})}
                                                className="w-full border-2 border-dashed border-teal-500 text-teal-600 py-3 rounded-2xl text-sm font-bold active-scale mt-2">+ เพิ่มตัวเลือก</button>
                                        </div>
                                    </div>
                                </div>

                                    <button onClick={handleSaveModifierGroup} className="w-full btn-teal text-white py-5 rounded-2xl font-bold text-xl active-scale shadow-lg flex items-center justify-center gap-2">
                                        💾 บันทึก
                                    </button>
                                </div>
                            </div>
                        </div>

                                <div className="p-5 border-b flex justify-between items-center">
                                    <span className="font-bold text-teal-600 text-xl">{editingProduct ? 'แก้ไขสินค้า' : 'เพิ่มสินค้า'}</span>

                                </div>

                                        </div>
                                        <div className="flex-1 space-y-4">

                                                <input type="number" placeholder="ราคาขาย *" className="w-full bg-slate-50 p-3 rounded-2xl outline-none focus:ring-2 focus:ring-teal-500"
                                                    value={form.price} onChange={e => setForm({...form, price: e.target.value})} />

                                                        <div key={c.id} className="relative group">
                                                            <button onClick={() => setForm({...form, categoryId: c.id})}
                                                                className={`px-6 py-2 rounded-full text-sm font-bold transition-all ${form.categoryId===c.id?'btn-teal text-white':'bg-white text-slate-400 border'}`}>
                                                                {c.name}
                                                            </button>

                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                    </div>

                                <div className="p-6">
                                    <button onClick={handleSaveProduct} className="w-full btn-teal text-white py-5 rounded-2xl font-bold text-xl active-scale flex items-center justify-center gap-3 shadow-lg">

                                    </button>
                                </div>
                            </div>
                        </div>

                                                <button key={m} onClick={() => setPaymentMethod(m)} className={`p-4 rounded-2xl border-2 transition-all ${paymentMethod===m?'border-teal-500 bg-teal-50 text-teal-600 font-bold':'border-slate-100 text-slate-400'}`}>
                                                    {m.toUpperCase()}
                                                </button>
                                            ))}

                                            <div className="bg-slate-50 p-4 rounded-2xl border-2 border-teal-100 flex justify-between items-center">

                                        </div>

                                        <p className="text-xs font-bold text-slate-400 mb-4 uppercase tracking-wider">รับเงินด่วน</p>
                                        <div className="grid grid-cols-3 gap-2">
                                            <button onClick={() => setCashReceived(cartTotal)} className="h-16 bg-green-100 text-green-700 font-bold rounded-xl">พอดี</button>

                                                <button key={v} onClick={() => setCashReceived(prev => Number(prev) + v)} className="h-16 bg-white border rounded-xl font-bold active-scale shadow-sm">{v}</button>
                                            ))}
                                            <button onClick={() => setCashReceived(0)} className="h-16 bg-red-50 text-red-500 font-bold rounded-xl">ล้าง</button>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-6 border-t">
                                    <button onClick={handleConfirmPayment} className="w-full btn-teal text-white py-5 rounded-2xl font-bold text-xl active-scale shadow-lg">ยืนยันชำระเงิน</button>
                                </div>
                            </div>
                        </div>
                    )}
