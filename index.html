<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เลื่องชื่อลือชา POS Pro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --p-teal: #1A5F7A; --s-teal: #159895; --bg-cream: #FDFBF7; }
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; touch-action: manipulation; }
        .btn-touch { transition: all 0.1s; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .btn-touch:active { transform: scale(0.95); opacity: 0.8; }
        .tab-active { background-color: var(--p-teal) !important; color: white !important; }
        .opt-selected { background-color: var(--s-teal) !important; color: white !important; border-color: var(--s-teal) !important; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .anim-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="pb-20">

    <!-- HEADER -->
    <header class="bg-[#1A5F7A] px-6 py-3 flex justify-between items-center text-white shadow-md sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <button class="text-2xl">☰</button>
            <h1 class="font-bold text-lg">เลื่องชื่อลือชา (สาขา เดอะมอลล์)</h1>
        </div>
        <div class="flex items-center gap-4 text-xl">
            <span>🔍</span><span>ⓘ</span>
        </div>
    </header>

    <!-- SUB HEADER / STATS -->
    <div class="bg-[#2D4356] text-white px-6 py-2 flex justify-between items-center text-sm">
        <div class="flex items-center gap-2">ยอดวันนี้ <span id="rep-total-top" class="text-lg font-bold">0</span> บาท · 0 บิล</div>
        <div class="bg-green-500 w-2 h-2 rounded-full"></div>
    </div>

    <div id="main-content" class="flex flex-col lg:flex-row h-[calc(100vh-140px)]">
        
        <!-- LEFT: PRODUCT AREA -->
        <div class="flex-1 p-4 overflow-y-auto hide-scroll border-r">
            <!-- หมวดหมู่ -->
            <div class="mb-6">
                <div class="flex items-center gap-2 mb-3 font-bold text-gray-600"><span class="text-xl">㗊</span> หมวดหมู่</div>
                <div id="pos-cats" class="flex gap-2 overflow-x-auto pb-2 hide-scroll"></div>
            </div>

            <!-- รายการสินค้า -->
            <div class="flex items-center gap-2 mb-4 font-bold text-gray-600">📦 รายการสินค้า</div>
            <div id="pos-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- สินค้าจะเด้งที่นี่ -->
            </div>
        </div>

        <!-- RIGHT: CART AREA (Desktop) -->
        <div class="w-full lg:w-80 bg-white p-4 flex flex-col shadow-inner">
            <h2 class="font-bold text-gray-500 mb-4">ตะกร้าสินค้า</h2>
            <div id="cart-list" class="flex-1 overflow-y-auto space-y-4 text-sm text-gray-400">
                <div class="flex flex-col items-center justify-center py-20">
                    <div class="bg-gray-100 p-4 rounded-full mb-3">🛍️</div>
                    <p>ยังไม่มีสินค้าในตะกร้า</p>
                </div>
            </div>
            <div class="border-t pt-4">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-bold text-gray-600 uppercase text-xs">ยอดรวมทั้งหมด</span>
                    <span id="cart-total" class="text-2xl font-bold text-red-600">0 บาท</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="clearCart()" class="bg-red-100 text-red-600 py-4 rounded-xl font-bold btn-touch">พักบิล</button>
                    <button onclick="openPayment()" class="bg-teal-600 text-white py-4 rounded-xl font-bold shadow-lg btn-touch">ชำระเงิน</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: PRODUCT OPTIONS (เหมือนในรูปเป๊ะ) -->
    <div id="mod-modal" class="fixed inset-0 bg-black/60 hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row max-h-[90vh]">
            <!-- Left Info -->
            <div class="p-8 flex-1 border-r">
                <div class="flex justify-between items-start mb-6">
                    <h2 class="text-2xl font-bold">ยืนยันจำนวนสินค้า</h2>
                    <button onclick="closeMod()" class="text-2xl text-gray-300">✕</button>
                </div>
                
                <div class="flex gap-4 mb-8 bg-gray-50 p-4 rounded-2xl">
                    <img id="mod-img" class="w-24 h-24 rounded-2xl object-cover border-2 border-white shadow-sm">
                    <div>
                        <h3 id="mod-name" class="text-xl font-bold text-teal-800">ชื่อสินค้า</h3>
                        <p id="mod-price" class="font-bold text-red-600">ราคา 0 บาท</p>
                        <p id="mod-stock" class="text-xs text-gray-400 mt-1 italic">คงเหลือ 0 ชิ้น</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6 items-center">
                    <div>
                        <label class="block text-sm font-bold text-gray-400 mb-2 uppercase">จำนวน</label>
                        <div class="flex items-center gap-4">
                            <button onclick="changeQty(-1)" class="w-10 h-10 bg-red-100 text-red-600 rounded-xl font-bold btn-touch">-</button>
                            <input type="number" id="mod-qty" value="1" class="w-12 text-center text-xl font-bold outline-none bg-transparent">
                            <button onclick="changeQty(1)" class="w-10 h-10 bg-teal-100 text-teal-600 rounded-xl font-bold btn-touch">+</button>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold text-gray-400 uppercase">ราคารวม</p>
                        <p id="mod-total-display" class="text-3xl font-bold text-red-600">35 บาท</p>
                    </div>
                </div>
            </div>

            <!-- Right Options -->
            <div class="p-8 flex-1 bg-gray-50 overflow-y-auto">
                <h3 class="font-bold text-teal-600 mb-4 flex items-center gap-2">ตัวเลือกสินค้า</h3>
                
                <!-- กลุ่ม 1: ไซส์ (บังคับเลือก 1) -->
                <div class="mb-8">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="font-bold">ไซส์</span>
                        <span class="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full uppercase">จำเป็น</span>
                    </div>
                    <div id="size-options" class="grid grid-cols-3 gap-2"></div>
                </div>

                <!-- กลุ่ม 2: ท็อปปิ้ง (เลือกหลายอย่าง) -->
                <div>
                    <div class="flex items-center gap-2 mb-3">
                        <span class="font-bold">ท็อปปิ้ง</span>
                        <span class="text-gray-400 text-[10px] uppercase">ไม่บังคับ · เลือกได้หลายอย่าง</span>
                    </div>
                    <div id="topping-options" class="grid grid-cols-2 gap-2"></div>
                </div>

                <!-- ปุ่มยืนยัน -->
                <button onclick="confirmAddToCart()" class="w-full mt-10 bg-teal-600 text-white py-5 rounded-2xl font-bold shadow-xl btn-touch flex items-center justify-center gap-3">
                    🛒 เพิ่มลงตะกร้า
                </button>
            </div>
        </div>
    </div>

    <!-- TAB BAR (Bottom) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 z-50">
        <button onclick="showPage('sell')" class="flex flex-col items-center gap-1 text-teal-600 font-bold">
            <span class="text-xl">🛒</span><span class="text-[10px] uppercase">ขายสินค้า</span>
        </button>
        <button onclick="showPage('report')" class="flex flex-col items-center gap-1 text-gray-300">
            <span class="text-xl">📊</span><span class="text-[10px] uppercase">รายงาน</span>
        </button>
        <button onclick="showPage('stock')" class="flex flex-col items-center gap-1 text-gray-300">
            <span class="text-xl">📦</span><span class="text-[10px] uppercase">คลัง</span>
        </button>
    </nav>

    <script>
        const config = {
            apiKey: "AIzaSyAvqnQ-j9nDKuXfmDe7Jr28cJcydnKxcjM",
            authDomain: "leungcheuluecha.firebaseapp.com",
            databaseURL: "https://leungcheuluecha-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "leungcheuluecha"
        };
        firebase.initializeApp(config);
        const db = firebase.database();

        let products = [], cart = [], curCat = "ทั้งหมด";
        let selP = null, selSize = null, selToppings = [], selQty = 1;

        // SYNC
        db.ref('products').on('value', snap => {
            products = snap.val() || [];
            renderPOS();
        });

        function renderPOS() {
            const grid = document.getElementById('pos-grid');
            const cats = ["ทั้งหมด", ...new Set(products.map(p => p.category || "ทั่วไป"))];
            document.getElementById('pos-cats').innerHTML = cats.map(c => `<button onclick="setCat('${c}')" class="px-5 py-2 rounded-full font-bold text-xs border whitespace-nowrap uppercase btn-touch ${curCat===c?'tab-active':'bg-white text-gray-400'}">${c}</button>`).join('');
            
            const filtered = products.filter(p => (curCat==="ทั้งหมด" || (p.category||"ทั่วไป")===curCat));
            grid.innerHTML = filtered.map(p => {
                const idx = products.indexOf(p);
                return `
                <div onclick="openMod(${idx})" class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden btn-touch card-active">
                    <div class="relative">
                        <img src="${p.img || 'https://via.placeholder.com/200'}" class="w-full h-32 object-cover">
                        <span class="absolute top-2 left-2 bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">${p.price}.-</span>
                    </div>
                    <div class="p-3 text-center bg-[#1A5F7A] text-white font-bold text-xs">${p.name}</div>
                </div>`;
            }).join('');
        }

        function setCat(c) { curCat = c; renderPOS(); }

        // --- MODIFIER LOGIC ---
        function openMod(idx) {
            selP = { ...products[idx], pid: idx };
            selQty = 1; selSize = null; selToppings = [];
            
            document.getElementById('mod-name').innerText = selP.name;
            document.getElementById('mod-price').innerText = `ราคา ${selP.price} บาท`;
            document.getElementById('mod-img').src = selP.img || '';
            document.getElementById('mod-stock').innerText = `คงเหลือ ${selP.stock || 0} ชิ้น`;
            document.getElementById('mod-qty').value = selQty;

            // Render Size (S, M, L)
            const sizes = [{n:'S', p:0}, {n:'M', p:5}, {n:'L', p:10}];
            document.getElementById('size-options').innerHTML = sizes.map(s => `
                <div onclick="setSize('${s.n}', ${s.p})" id="sz-${s.n}" class="border-2 rounded-2xl p-4 text-center btn-touch bg-white">
                    <p class="font-bold">${s.n}</p>
                    <p class="text-[9px] text-gray-400">+${s.p}</p>
                </div>`).join('');

            // Render Toppings
            const toppings = [{n:'วิปครีม', p:20}, {n:'ครีมชีส', p:20}, {n:'ชีสขูด', p:20}, {n:'ช็อค+ชีสขูด', p:20}, {n:'ดับเบิ้ลช็อค+ชีส', p:40}];
            document.getElementById('topping-options').innerHTML = toppings.map((t, i) => `
                <div onclick="toggleTopping(${i}, '${t.n}', ${t.p})" id="top-${i}" class="border-2 rounded-2xl p-4 text-center btn-touch bg-white">
                    <p class="text-[10px] font-bold">${t.n}</p>
                    <p class="text-[9px] text-red-500 font-bold">+${t.p}</p>
                </div>`).join('');

            updateModPrice();
            document.getElementById('mod-modal').classList.remove('hidden');
        }

        function setSize(n, p) {
            selSize = { name: n, price: p };
            document.querySelectorAll('#size-options div').forEach(el => el.classList.remove('opt-selected'));
            document.getElementById('sz-'+n).classList.add('opt-selected');
            updateModPrice();
        }

        function toggleTopping(idx, n, p) {
            const i = selToppings.findIndex(x => x.name === n);
            if(i > -1) {
                selToppings.splice(i, 1);
                document.getElementById('top-'+idx).classList.remove('opt-selected');
            } else {
                selToppings.push({ name: n, price: p });
                document.getElementById('top-'+idx).classList.add('opt-selected');
            }
            updateModPrice();
        }

        function changeQty(v) { selQty = Math.max(1, selQty + v); document.getElementById('mod-qty').value = selQty; updateModPrice(); }

        function updateModPrice() {
            let total = parseFloat(selP.price);
            if(selSize) total += selSize.price;
            selToppings.forEach(t => total += t.price);
            document.getElementById('mod-total-display').innerText = `${total * selQty} บาท`;
        }

        function confirmAddToCart() {
            if(!selSize) return alert("กรุณาเลือกไซส์สินค้าก่อนเพิ่มลงตะกร้า");
            
            const totalSingle = parseFloat(selP.price) + selSize.price + selToppings.reduce((s, t) => s + t.price, 0);
            
            cart.push({
                ...selP,
                qty: selQty,
                size: selSize.name,
                toppings: selToppings.map(t => t.name),
                finalPrice: totalSingle * selQty
            });
            
            updateCartUI();
            closeMod();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            if(cart.length === 0) {
                list.innerHTML = `<div class="flex flex-col items-center justify-center py-20"><div class="bg-gray-100 p-4 rounded-full mb-3">🛍️</div><p>ยังไม่มีสินค้าในตะกร้า</p></div>`;
                document.getElementById('cart-total').innerText = "0 บาท";
                document.getElementById('cart-bar').classList.add('hidden');
                return;
            }

            list.innerHTML = cart.map((i, idx) => `
                <div class="bg-gray-50 p-4 rounded-2xl border flex justify-between items-center animate-fade">
                    <div>
                        <div class="font-bold text-teal-800">${i.name} (x${i.qty})</div>
                        <div class="text-[9px] text-gray-400 uppercase">${i.size} | ${i.toppings.join(', ') || 'ไม่มีท็อปปิ้ง'}</div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-red-600">${i.finalPrice}.-</div>
                        <button onclick="removeCart(${idx})" class="text-[10px] text-gray-300 underline uppercase">ลบ</button>
                    </div>
                </div>`).join('');

            const total = cart.reduce((s, i) => s + i.finalPrice, 0);
            document.getElementById('cart-total').innerText = total + " บาท";
            document.getElementById('rep-total-top').innerText = total;
            document.getElementById('cart-bar').classList.remove('hidden');
            document.getElementById('cart-qty').innerText = cart.length;
        }

        function removeCart(i) { cart.splice(i, 1); updateCartUI(); }
        function clearCart() { cart = []; updateCartUI(); }
        function closeMod() { document.getElementById('mod-modal').classList.add('hidden'); }
        function openPayment() { alert("ไปหน้าจ่ายเงิน (KBANK QR)..."); }

        showPage('sell');
    </script>
</body>
</html>
