<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เลื่องชื่อลือชา POS Pro</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --p-blue: #007AFF; --bg-cream: #FDFBF7; --soft-blue: #E3F2FD; }
        body { font-family: 'Kanit', sans-serif; background-color: var(--bg-cream); color: #334155; touch-action: manipulation; }
        .btn-touch { transition: all 0.1s ease; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .btn-touch:active { transform: scale(0.96); background-color: var(--soft-blue); }
        .tab-active { color: var(--p-blue) !important; border-top: 4px solid var(--p-blue); font-weight: 600; }
        .pin-btn { background: white; border: 1px solid #e2e8f0; font-size: 1.5rem; font-weight: bold; height: 70px; border-radius: 1.5rem; }
        .pin-btn:active { background: #f1f5f9; transform: scale(0.9); }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-28">

    <!-- 1. AUTH SCREEN (PIN LOGIN) -->
    <div id="auth-screen" class="fixed inset-0 bg-white z-[500] flex flex-col items-center justify-center p-6">
        <h1 class="text-3xl font-bold text-blue-600 mb-2 italic">เลื่องชื่อลือชา</h1>
        <p class="text-gray-400 uppercase tracking-widest text-[10px] font-bold mb-10">Security Unlock</p>
        <div id="pin-dots" class="flex gap-5 mb-12">
            <div class="w-4 h-4 rounded-full border-2 border-blue-100 transition-colors"></div>
            <div class="w-4 h-4 rounded-full border-2 border-blue-100 transition-colors"></div>
            <div class="w-4 h-4 rounded-full border-2 border-blue-100 transition-colors"></div>
            <div class="w-4 h-4 rounded-full border-2 border-blue-100 transition-colors"></div>
        </div>
        <div class="grid grid-cols-3 gap-4 w-full max-w-[300px]">
            <button onclick="pressPin('1')" class="pin-btn">1</button>
            <button onclick="pressPin('2')" class="pin-btn">2</button>
            <button onclick="pressPin('3')" class="pin-btn">3</button>
            <button onclick="pressPin('4')" class="pin-btn">4</button>
            <button onclick="pressPin('5')" class="pin-btn">5</button>
            <button onclick="pressPin('6')" class="pin-btn">6</button>
            <button onclick="pressPin('7')" class="pin-btn">7</button>
            <button onclick="pressPin('8')" class="pin-btn">8</button>
            <button onclick="pressPin('9')" class="pin-btn">9</button>
            <button onclick="clearPin()" class="pin-btn text-red-500 text-sm">CLR</button>
            <button onclick="pressPin('0')" class="pin-btn">0</button>
            <button onclick="checkPin()" class="pin-btn text-blue-500 text-sm font-bold tracking-widest">OK</button>
        </div>
        <!-- EMERGENCY BYPASS -->
        <button onclick="forceUnlock()" class="mt-20 text-gray-200 text-[10px] uppercase font-bold hover:text-blue-400 transition-colors italic">Emergency Unlock</button>
    </div>

    <!-- 2. MAIN HEADER -->
    <header class="bg-white px-6 py-4 flex justify-between items-center sticky top-0 z-50 border-b border-blue-50 shadow-sm">
        <h1 class="text-xl font-bold text-[#004A99]">เลื่องชื่อลือชา</h1>
        <div id="db-status" class="text-[9px] px-2.5 py-1 rounded-full font-bold bg-yellow-100 text-yellow-700 uppercase italic">Connecting...</div>
    </header>

    <div id="main-view">
        <!-- POS PAGE -->
        <section id="page-sell" class="p-4 block">
            <div class="mb-4 flex gap-2">
                <input type="text" id="search" oninput="renderPOS()" placeholder="🔍 ค้นหาเมนู..." class="flex-1 p-4 rounded-2xl bg-white shadow-sm border-none outline-none">
            </div>
            <div id="pos-cats" class="flex gap-2 overflow-x-auto pb-4 hide-scroll"></div>
            <div id="pos-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-32">
                <div class="col-span-full py-20 text-center text-gray-300 italic">กำลังเชื่อมต่อข้อมูลคลาวด์...</div>
            </div>
        </section>

        <!-- KITCHEN PAGE -->
        <section id="page-kitchen" class="p-4 hid
