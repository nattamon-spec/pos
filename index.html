<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lue cha POS | Production Master v1.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-scale:active { transform: scale(0.95); transition: 0.1s; }
        .luecha-blue { background-color: #003399; }
        .luecha-orange { background-color: #FF6600; }
        .btn-teal { background-color: #2497a9; }
        .text-teal { color: #2497a9; }
        .border-teal { border-color: #2497a9; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 1. Database (ล็อคชื่อเดิมถาวร) ---
        const db = new Dexie("LueCha_POS_Production_DB");
        db.version(1).stores({
            categories: "++id, name",
            products: "++id, name, price, cost, deliveryPrices, categoryId",
            modifierGroups: "++id, name, options",
            orders: "++id, total, timestamp, paymentMethod, items, queue"
        });

        function App() {
            const [view, setView] = useState('pos');
            const [adminTab, setAdminTab] = useState('products');
            const [products, setProducts] = useState([]);
            const [categories, setCategories] = useState([]);
            const [modifiers, setModifiers] = useState([]);
            const [orders, setOrders] = useState([]);
            const [cart, setCart] = useState([]);

            // Modals
            const [selectedItem, setSelectedItem] = useState(null); 
            const [showProductModal, setShowProductModal] = useState(false); // ป๊อปอัพ Image 7
            const [editingProduct, setEditingProduct] = useState(null); // สำหรับโหมดแก้ไข

            // UI Toggle Sections (Image 7)
            const [openSection, setOpenSection] = useState('category'); // category, modifiers, delivery

            // Form State (Image 7)
            const [form, setForm] = useState({
                name: '', price: '', cost: '', categoryId: 1, deliveryPrices: {}
            });

            useEffect(() => {
                refreshData();
            }, []);

            const refreshData = async () => {
                setProducts(await db.products.toArray());
                setCategories(await db.categories.toArray());
                setModifiers(await db.modifierGroups.toArray());
                setOrders(await db.orders.toArray());
            };

            // --- Logic: บันทึก/แก้ไขสินค้า (Image 7) ---
            const handleSaveProduct = async () => {
                if(!form.name || !form.price) return alert("กรุณากรอกชื่อและราคา");
                const data = {
                    ...form,
                    price: Number(form.price),
                    cost: Number(form.cost || 0),
                    categoryId: Number(form.categoryId)
                };
                if (editingProduct) data.id = editingProduct.id; // ถ้ามี ID จะเป็นการ Update

                await db.products.put(data); // put จะทำทั้ง Add และ Update
                setShowProductModal(false);
                setEditingProduct(null);
                setForm({ name: '', price: '', cost: '', categoryId: 1, deliveryPrices: {} });
                refreshData();
            };

            const openEditProduct = (p) => {
                setEditingProduct(p);
                setForm(p);
                setShowProductModal(true);
            };

            // --- Logic: ชำระเงิน ---
            const cartTotal = useMemo(() => cart.reduce((s, i) => s + Number(i.totalPrice || i.price), 0), [cart]);

            return (
                <div className="h-screen flex flex-col overflow-hidden">
                    {/* Header */}
                    <header className="luecha-blue p-4 text-white flex justify-between items-center shadow-lg z-10">
                        <h1 className="font-bold text-xl">เลื่องชื่อลือชา POS</h1>
                        <div className="flex gap-2">
                            <button onClick={() => setView('pos')} className={`px-4 py-1.5 rounded-full text-sm ${view==='pos'?'luecha-orange':'opacity-50'}`}>หน้าขาย</button>
                            <button onClick={() => setView('admin')} className={`px-4 py-1.5 rounded-full text-sm ${view==='admin'?'luecha-orange':'opacity-50'}`}>จัดการร้าน</button>
                            <button onClick={() => setView('report')} className={`px-4 py-1.5 rounded-full text-sm ${view==='report'?'luecha-orange':'opacity-50'}`}>รายงาน</button>
                        </div>
                    </header>

                    {/* VIEW: POS */}
                    {view === 'pos' && (
                        <div className="flex-1 flex overflow-hidden bg-slate-100">
                            <div className="flex-1 p-4 grid grid-cols-2 md:grid-cols-4 gap-4 overflow-y-auto no-scrollbar">
                                {products.map(p => (
                                    <button key={p.id} onClick={() => setSelectedItem(p)}
                                        className="bg-white p-5 rounded-[2rem] shadow-sm active-scale flex flex-col items-center justify-center h-44 border-2 border-transparent hover:border-orange-500">
                                        <span className="font-bold text-slate-800 text-lg">{p.name}</span>
                                        <span className="text-blue-700 font-black text-2xl">{p.price}฿</span>
                                    </button>
                                ))}
                            </div>
                            <div className="w-80 md:w-96 bg-white shadow-2xl flex flex-col">
                                <div className="p-6 border-b font-bold text-slate-700">ตะกร้าสินค้า</div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {cart.map(item => (
                                        <div key={item.cartId} className="bg-slate-50 p-4 rounded-2xl relative border">
                                            <div className="flex justify-between font-bold">
                                                <span>{item.name}</span>
                                                <span>{item.totalPrice || item.price}฿</span>
                                            </div>
                                            <button onClick={() => setCart(cart.filter(i => i.cartId !== item.cartId))} className="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full text-xs">✕</button>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-6 bg-slate-50 border-t space-y-4">
                                    <div className="flex justify-between text-3xl font-black text-blue-900">
                                        <span>รวม</span>
                                        <span>{cartTotal}฿</span>
                                    </div>
                                    <button disabled={cart.length===0} className="w-full luecha-orange text-white py-5 rounded-3xl font-bold text-xl active-scale disabled:opacity-30">ชำระเงิน</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* VIEW: ADMIN */}
                    {view === 'admin' && (
                        <div className="flex-1 flex flex-col bg-white overflow-hidden">
                            <div className="flex border-b bg-slate-50 px-8 pt-4 gap-6">
                                <button onClick={() => setAdminTab('products')} className={`pb-3 font-bold border-b-4 ${adminTab==='products'?'border-blue-700 text-blue-700':'border-transparent text-slate-400'}`}>สินค้า</button>
                                <button onClick={() => setAdminTab('stock')} className={`pb-3 font-bold border-b-4 ${adminTab==='stock'?'border-blue-700 text-blue-700':'border-transparent text-slate-400'}`}>สต็อก</button>
                            </div>
                            <div className="flex-1 p-8 overflow-y-auto">
                                <div className="max-w-4xl mx-auto">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-2xl font-bold">รายการสินค้าทั้งหมด</h2>
                                        <button onClick={() => {setEditingProduct(null); setForm({name:'', price:'', cost:'', categoryId:1, deliveryPrices:{}}); setShowProductModal(true);}} className="btn-teal text-white px-6 py-2 rounded-xl font-bold">+ เพิ่มสินค้า</button>
                                    </div>
                                    <div className="grid gap-3">
                                        {products.map(p => (
                                            <div key={p.id} className="flex justify-between items-center p-5 bg-slate-50 rounded-3xl border">
                                                <span className="font-bold text-lg">{p.name}</span>
                                                <div className="flex items-center gap-4">
                                                    <span className="text-blue-600 font-bold">{p.price}฿</span>
                                                    <button onClick={() => openEditProduct(p)} className="text-teal font-bold bg-teal-50 px-4 py-1 rounded-lg">แก้ไข</button>
                                                    <button onClick={async () => {if(confirm('ลบ?')) {await db.products.delete(p.id); refreshData();}}} className="text-red-400">ลบ</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- MODAL: เพิ่ม/แก้ไขสินค้า (Image 7) --- */}
                    {showProductModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-300">
                                {/* Header */}
                                <div className="p-5 border-b flex justify-between items-center">
                                    <span className="font-bold text-teal-600 text-xl">{editingProduct ? 'แก้ไขสินค้า' : 'เพิ่มสินค้า'}</span>
                                    <div className="flex gap-2">
                                        <span className="text-slate-300">ⓘ</span>
                                        <button onClick={() => setShowProductModal(false)} className="text-red-500 bg-red-50 w-8 h-8 rounded-full flex items-center justify-center">✕</button>
                                    </div>
                                </div>

                                {/* Body */}
                                <div className="p-6 space-y-6 max-h-[70vh] overflow-y-auto no-scrollbar">
                                    {/* Top Info */}
                                    <div className="flex gap-6">
                                        <div className="w-28 h-28 bg-slate-50 border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center justify-center text-slate-300 cursor-pointer">
                                            <span className="text-3xl">?</span>
                                            <span className="text-[10px]">เลือกรูป</span>
                                        </div>
                                        <div className="flex-1 space-y-4">
                                            <div>
                                                <label className="text-xs font-bold text-slate-700">ชื่อสินค้า <span className="text-red-500">*</span></label>
                                                <input type="text" placeholder="เช่น กาแฟเย็น" className="w-full border-b-2 border-slate-100 py-2 outline-none focus:border-teal-500 transition-all"
                                                    value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                                            </div>
                                            <div className="flex gap-4">
                                                <div className="flex-1">
                                                    <label className="text-xs font-bold text-slate-700">ราคาขาย <span className="text-red-500">*</span></label>
                                                    <input type="number" placeholder="0" className="w-full bg-slate-50 p-3 rounded-2xl outline-none focus:ring-2 focus:ring-teal-500"
                                                        value={form.price} onChange={e => setForm({...form, price: e.target.value})} />
                                                </div>
                                                <div className="flex-1">
                                                    <label className="text-xs font-bold text-slate-700">ต้นทุน</label>
                                                    <input type="number" placeholder="0" className="w-full bg-slate-50 p-3 rounded-2xl outline-none focus:ring-2 focus:ring-teal-500"
                                                        value={form.cost} onChange={e => setForm({...form, cost: e.target.value})} />
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Accordion Sections */}
                                    <div className="space-y-3">
                                        {/* Category Section */}
                                        <div className="border rounded-2xl overflow-hidden">
                                            <button onClick={() => setOpenSection(openSection==='category'?'':'category')} className="w-full p-4 flex justify-between items-center bg-white">
                                                <div className="flex items-center gap-3 text-teal-600 font-bold">🏷️ หมวดหมู่</div>
                                                <span>{openSection==='category'?'▲':'▼'}</span>
                                            </button>
                                            {openSection === 'category' && (
                                                <div className="p-4 bg-slate-50 flex flex-wrap gap-2 border-t">
                                                    <button className="border-2 border-dashed border-teal-500 text-teal-600 px-4 py-2 rounded-full text-sm font-bold">+ เพิ่มหมวด</button>
                                                    {categories.map(c => (
                                                        <button key={c.id} onClick={() => setForm({...form, categoryId: c.id})}
                                                            className={`px-6 py-2 rounded-full text-sm font-bold transition-all ${form.categoryId===c.id?'btn-teal text-white':'bg-white text-slate-400 border'}`}>
                                                            {c.name}
                                                        </button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        {/* Modifiers Section */}
                                        <div className="border rounded-2xl overflow-hidden">
                                            <button onClick={() => setOpenSection(openSection==='modifiers'?'':'modifiers')} className="w-full p-4 flex justify-between items-center bg-white">
                                                <div className="flex items-center gap-3 text-teal-600 font-bold">📑 ตัวเลือกสินค้า <span className="text-xs font-normal text-slate-400">· 1 กลุ่ม</span></div>
                                                <span>{openSection==='modifiers'?'▲':'▼'}</span>
                                            </button>
                                            {openSection === 'modifiers' && (
                                                <div className="p-4 bg-slate-50 space-y-3 border-t">
                                                    <div className="bg-white p-4 rounded-2xl border flex justify-between items-center">
                                                        <div>
                                                            <p className="font-bold text-slate-700">ไซส์ ⭐</p>
                                                            <p className="text-[10px] text-slate-400">ทุกสินค้า · เลือกได้ 1 อย่าง · 3 ตัวเลือก</p>
                                                        </div>
                                                        <button className="text-slate-400">✎</button>
                                                    </div>
                                                    <button className="border-2 border-dashed border-teal-500 text-teal-600 px-4 py-2 rounded-full text-sm font-bold">+ เพิ่มกลุ่มตัวเลือก</button>
                                                </div>
                                            )}
                                        </div>

                                        {/* Delivery Section */}
                                        <div className="border rounded-2xl overflow-hidden">
                                            <button onClick={() => setOpenSection(openSection==='delivery'?'':'delivery')} className="w-full p-4 flex justify-between items-center bg-white">
                                                <div className="flex items-center gap-3 text-teal-600 font-bold">🛵 ราคาขายเดลิเวอรี่</div>
                                                <span>{openSection==='delivery'?'▲':'▼'}</span>
                                            </button>
                                            {openSection === 'delivery' && (
                                                <div className="p-4 bg-slate-50 space-y-4 border-t">
                                                    <p className="text-[10px] text-slate-400">เลือกแอปที่ขาย แล้วกรอก %GP เพื่อเริ่มตั้งราคา</p>
                                                    <div className="flex flex-wrap gap-2">
                                                        {['GrabFood', 'LINE MAN', 'ShopeeFood', 'Robinhood'].map(app => (
                                                            <button key={app} className="border-2 border-dashed border-teal-500 text-teal-600 px-4 py-2 rounded-full text-sm font-bold">+ {app}</button>
                                                        ))}
                                                        <button className="bg-slate-200 text-slate-500 px-4 py-2 rounded-full text-sm font-bold">+ แอปอื่น</button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Footer */}
                                <div className="p-6">
                                    <button onClick={handleSaveProduct} className="w-full btn-teal text-white py-5 rounded-2xl font-bold text-xl active-scale flex items-center justify-center gap-3">
                                        💾 บันทึก
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
