<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lue cha POS | เลื่องชื่อลือชา Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-scale:active { transform: scale(0.95); transition: 0.1s; }
        .luecha-blue { background-color: #003399; } /* สีน้ำเงินจากป้ายร้าน */
        .luecha-orange { background-color: #FF6600; } /* สีส้มจากโครงบูธ */
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 1. Database Schema (รักษาข้อมูลเดิม) ---
        const db = new Dexie("LueCha_Master_DB");
        db.version(2).stores({
            products: "++id, name, price, cost, category",
            orders: "++id, total, timestamp, staff, paymentMethod",
            ingredients: "++id, name, unit, stock, minStock"
        });

        // ข้อมูลเมนูจริงจากภาพ
        const LUECHA_MENU = [
            { id: 101, name: "ชาไทย (Thai Tea)", basePrice: 35, category: "Standard" },
            { id: 102, name: "ชาเขียว (Green Tea)", basePrice: 35, category: "Standard" },
            { id: 103, name: "โกโก้ (Cocoa)", basePrice: 35, category: "Standard" },
            { id: 104, name: "นมสด (Fresh Milk)", basePrice: 35, category: "Standard" },
            { id: 105, name: "นมสดโอริโอ้", basePrice: 35, category: "Standard" },
            { id: 106, name: "ชาพีช (Peach Tea)", basePrice: 35, category: "Standard" },
            { id: 201, name: "ชาไทยดับเบิ้ลชีส", basePrice: 69, category: "Special" },
            { id: 202, name: "โกโก้ช็อกขูด", basePrice: 50, category: "Special" },
            { id: 203, name: "ชาไทยครีมชีส", basePrice: 50, category: "Special" },
            { id: 204, name: "โอริโอ้ไอติม", basePrice: 55, category: "Special" }
        ];

        const TOPPINGS = [
            { name: "ครีมชีส", price: 20 }, { name: "ชีสขูด", price: 20 },
            { name: "บิสคอฟ", price: 20 }, { name: "วิปครีม", price: 20 },
            { name: "ช็อกขูด", price: 20 }, { name: "ชาคิวบ์", price: 20 }
        ];

        function App() {
            const [view, setView] = useState('pos');
            const [cart, setCart] = useState([]);
            const [orders, setOrders] = useState([]);
            const [selectedItem, setSelectedItem] = useState(null); // สำหรับ Modal เลือกขนาด/ท็อปปิ้ง
            
            useEffect(() => {
                const init = async () => {
                    const count = await db.products.count();
                    if (count === 0) await db.products.bulkAdd(LUECHA_MENU);
                    setOrders(await db.orders.toArray());
                };
                init();
            }, []);

            // --- Logic: การคำนวณราคาตามขนาด ---
            const getPriceBySize = (basePrice, size) => {
                if (size === 'M') return basePrice + 5;
                if (size === 'L') return basePrice + 10;
                return basePrice; // S
            };

            const addToCart = (product, size, selectedToppings) => {
                const toppingTotal = selectedToppings.reduce((s, t) => s + t.price, 0);
                const finalPrice = getPriceBySize(product.basePrice, size) + toppingTotal;
                
                const cartItem = {
                    ...product,
                    cartId: Date.now(),
                    size,
                    toppings: selectedToppings,
                    price: finalPrice
                };
                setCart([...cart, cartItem]);
                setSelectedItem(null);
            };

            const handleCheckout = async (method) => {
                const total = cart.reduce((s, i) => s + i.price, 0);
                await db.orders.add({ total, timestamp: new Date(), staff: 'พนักงานบูธ', paymentMethod: method });
                setCart([]);
                setOrders(await db.orders.toArray());
                alert("บันทึกออเดอร์สำเร็จ!");
            };

            return (
                <div className="h-screen flex flex-col overflow-hidden bg-slate-100">
                    {/* Header: Lue-Cha Brand Colors */}
                    <header className="luecha-blue p-4 text-white flex justify-between items-center shadow-lg">
                        <div className="flex items-center gap-3">
                            <div className="bg-white p-1 rounded-lg">
                                <span className="text-blue-900 font-black text-xl">เลื่องชื่อลือชา</span>
                            </div>
                            <span className="text-xs opacity-80">Booth POS v2.0</span>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setView('pos')} className={`px-4 py-1 rounded-full text-sm ${view==='pos'?'bg-orange-500':'opacity-50'}`}>หน้าขาย</button>
                            <button onClick={() => setView('report')} className={`px-4 py-1 rounded-full text-sm ${view==='report'?'bg-orange-500':'opacity-50'}`}>รายงาน</button>
                        </div>
                    </header>

                    {view === 'pos' ? (
                        <div className="flex-1 flex overflow-hidden">
                            {/* Menu Grid */}
                            <div className="flex-1 p-4 grid grid-cols-2 md:grid-cols-3 gap-4 overflow-y-auto no-scrollbar">
                                {LUECHA_MENU.map(p => (
                                    <button key={p.id} onClick={() => setSelectedItem(p)}
                                        className="bg-white p-4 rounded-[2rem] shadow-sm active-scale flex flex-col items-center justify-center h-44 border-2 border-transparent hover:border-orange-500 transition-all relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-full h-2 luecha-orange"></div>
                                        <span className="font-bold text-slate-800 text-center leading-tight mb-2">{p.name}</span>
                                        <span className="text-blue-700 font-black text-2xl">{p.basePrice}฿</span>
                                        <span className="text-[10px] text-slate-400 mt-1 uppercase">แตะเพื่อเลือกขนาด</span>
                                    </button>
                                ))}
                            </div>

                            {/* Cart Sidebar */}
                            <div className="w-80 md:w-96 bg-white shadow-2xl flex flex-col border-l border-slate-200">
                                <div className="p-6 border-b flex justify-between items-center">
                                    <span className="font-bold text-slate-700 text-lg">ออเดอร์ปัจจุบัน</span>
                                    <span className="luecha-orange text-white px-3 py-1 rounded-full text-xs">{cart.length}</span>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {cart.map(item => (
                                        <div key={item.cartId} className="bg-slate-50 p-3 rounded-2xl relative group">
                                            <div className="flex justify-between font-bold text-slate-800">
                                                <span>{item.name} ({item.size})</span>
                                                <span>{item.price}฿</span>
                                            </div>
                                            {item.toppings.length > 0 && (
                                                <div className="text-[10px] text-slate-500 mt-1">
                                                    + {item.toppings.map(t => t.name).join(', ')}
                                                </div>
                                            )}
                                            <button onClick={() => setCart(cart.filter(i => i.cartId !== item.cartId))} className="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full text-xs shadow-md">✕</button>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-6 bg-slate-50 border-t space-y-4">
                                    <div className="flex justify-between text-3xl font-black text-blue-900">
                                        <span>รวม</span>
                                        <span>{cart.reduce((s, i) => s + i.price, 0)}฿</span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button onClick={() => handleCheckout('qr')} disabled={cart.length===0} className="bg-blue-700 text-white py-4 rounded-2xl font-bold active-scale disabled:opacity-30">QR สแกน</button>
                                        <button onClick={() => handleCheckout('cash')} disabled={cart.length===0} className="luecha-orange text-white py-4 rounded-2xl font-bold active-scale disabled:opacity-30">เงินสด</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        /* Report View */
                        <div className="flex-1 p-8 overflow-y-auto bg-white">
                            <h2 className="text-3xl font-bold mb-8 text-blue-900">สรุปยอดขายบูธ</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                <div className="luecha-blue text-white p-8 rounded-[2.5rem] shadow-xl">
                                    <p className="opacity-70 mb-1">ยอดขายรวม</p>
                                    <p className="text-5xl font-black">{orders.reduce((s, o) => s + o.total, 0).toLocaleString()}฿</p>
                                </div>
                                <div className="bg-white border-4 border-orange-500 p-8 rounded-[2.5rem]">
                                    <p className="text-orange-500 mb-1 font-bold">จำนวนบิล</p>
                                    <p className="text-5xl font-black text-slate-800">{orders.length}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Beverage Customization (หัวใจของร้านเครื่องดื่ม) */}
                    {selectedItem && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-end md:items-center justify-center z-50 p-4">
                            <div className="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-200">
                                <div className="p-6 border-b flex justify-between items-center">
                                    <h3 className="text-xl font-bold text-slate-800">{selectedItem.name}</h3>
                                    <button onClick={() => setSelectedItem(null)} className="text-slate-400">ปิด</button>
                                </div>
                                
                                <div className="p-6 space-y-8">
                                    {/* Size Selection */}
                                    <div>
                                        <p className="text-sm font-bold text-slate-400 mb-3 uppercase tracking-wider">เลือกขนาดแก้ว</p>
                                        <div className="grid grid-cols-3 gap-3">
                                            {['S', 'M', 'L'].map(size => (
                                                <button key={size} onClick={() => setSelectedItem({...selectedItem, currentSize: size})}
                                                    className={`py-4 rounded-2xl font-bold text-lg border-2 transition-all ${selectedItem.currentSize === size ? 'border-orange-500 bg-orange-50 text-orange-600' : 'border-slate-100 text-slate-400'}`}>
                                                    {size}
                                                    <div className="text-[10px] font-normal">
                                                        {size==='S'?'16oz':size==='M'?'20oz':'22oz'}
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Topping Selection */}
                                    <div>
                                        <p className="text-sm font-bold text-slate-400 mb-3 uppercase tracking-wider">เพิ่มท็อปปิ้ง (+20฿)</p>
                                        <div className="grid grid-cols-2 gap-2">
                                            {TOPPINGS.map(t => {
                                                const isSelected = (selectedItem.selectedToppings || []).find(st => st.name === t.name);
                                                return (
                                                    <button key={t.name} 
                                                        onClick={() => {
                                                            const current = selectedItem.selectedToppings || [];
                                                            const next = isSelected ? current.filter(st => st.name !== t.name) : [...current, t];
                                                            setSelectedItem({...selectedItem, selectedToppings: next});
                                                        }}
                                                        className={`p-3 rounded-xl text-sm font-medium border-2 transition-all flex justify-between items-center ${isSelected ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-slate-50 text-slate-500'}`}>
                                                        {t.name}
                                                        {isSelected && <span>✓</span>}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <div className="p-6 bg-slate-50">
                                    <button 
                                        disabled={!selectedItem.currentSize}
                                        onClick={() => addToCart(selectedItem, selectedItem.currentSize, selectedItem.selectedToppings || [])}
                                        className="w-full luecha-orange text-white py-5 rounded-[1.5rem] font-bold text-xl shadow-lg active-scale disabled:opacity-30"
                                    >
                                        เพิ่มลงตะกร้า - {getPriceBySize(selectedItem.basePrice, selectedItem.currentSize) + (selectedItem.selectedToppings || []).reduce((s,t)=>s+t.price,0)}฿
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
