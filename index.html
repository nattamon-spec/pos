<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lue cha POS | Stable Foundation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-scale:active { transform: scale(0.95); transition: 0.1s; }
        .luecha-blue { background-color: #003399; }
        .luecha-orange { background-color: #FF6600; }
        .btn-teal { background-color: #2497a9; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // PART 1: DATABASE (โครงสร้างฐานข้อมูล)
        // ==========================================
        const db = new Dexie("LueCha_POS_Stable_DB");
        db.version(1).stores({
            products: "++id, name, price, cost, categoryId",
            categories: "++id, name",
            orders: "++id, total, timestamp, paymentMethod, items"
        });

        function App() {
            // ==========================================
            // PART 2: STATES (ตัวแปรควบคุมระบบ)
            // ==========================================
            const [view, setView] = useState('pos');
            const [products, setProducts] = useState([]);
            const [categories, setCategories] = useState([]);
            const [orders, setOrders] = useState([]);
            const [cart, setCart] = useState([]);

            // Modal States
            const [selectedItem, setSelectedItem] = useState(null); // Image 5
            const [showProductModal, setShowProductModal] = useState(false); // Image 7
            const [editingProduct, setEditingProduct] = useState(null);
            const [showPayment, setShowPayment] = useState(false); // Image 4

            // Selection States (Image 5)
            const [qty, setQty] = useState(1);
            const [size, setSize] = useState('S');
            const [toppings, setToppings] = useState([]);

            // Form States (Image 7)
            const [form, setForm] = useState({ name: '', price: '', cost: '', categoryId: 1 });
            const [openSection, setOpenSection] = useState('category');

            // Payment States
            const [cashReceived, setCashReceived] = useState(0);
            const [paymentMethod, setPaymentMethod] = useState('cash');

            // ==========================================
            // PART 3: INITIALIZATION (โหลดข้อมูลเริ่มต้น)
            // ==========================================
            useEffect(() => {
                const init = async () => {
                    if (await db.categories.count() === 0) await db.categories.add({ name: "เครื่องดื่ม" });
                    refreshData();
                };
                init();
            }, []);

            const refreshData = async () => {
                setProducts(await db.products.toArray());
                setCategories(await db.categories.toArray());
                setOrders(await db.orders.toArray());
            };

            // ==========================================
            // PART 4: LOGIC (ระบบคำนวณ)
            // ==========================================
            const currentItemTotal = useMemo(() => {
                if (!selectedItem) return 0;
                let base = Number(selectedItem.price);
                if (size === 'M') base += 5;
                if (size === 'L') base += 10;
                const toppingSum = toppings.reduce((s, t) => s + Number(t.price), 0);
                return (base + toppingSum) * Number(qty);
            }, [selectedItem, size, toppings, qty]);

            const cartTotal = useMemo(() => cart.reduce((s, i) => s + Number(i.totalPrice), 0), [cart]);
            const changeAmount = useMemo(() => Math.max(0, Number(cashReceived) - cartTotal), [cashReceived, cartTotal]);

            const handleAddToCart = () => {
                const item = { ...selectedItem, cartId: Date.now(), qty, size, toppings, totalPrice: currentItemTotal };
                setCart([...cart, item]);
                setSelectedItem(null);
            };

            const handleSaveProduct = async () => {
                const data = { ...form, price: Number(form.price), cost: Number(form.cost || 0), categoryId: Number(form.categoryId) };
                if (editingProduct) data.id = editingProduct.id;
                await db.products.put(data);
                setShowProductModal(false);
                setEditingProduct(null);
                setForm({ name: '', price: '', cost: '', categoryId: 1 });
                refreshData();
            };

            const handleConfirmPayment = async () => {
                await db.orders.add({ total: cartTotal, timestamp: new Date(), paymentMethod, items: cart });
                setCart([]); setShowPayment(false); setCashReceived(0);
                refreshData();
                alert("ชำระเงินสำเร็จ!");
            };

            // ==========================================
            // PART 5: UI RENDER (ส่วนแสดงผล)
            // ==========================================
            return (
                <div className="h-screen flex flex-col overflow-hidden bg-slate-50">
                    {/* Header */}
                    <header className="luecha-blue p-4 text-white flex justify-between items-center shadow-lg z-10">
                        <h1 className="font-bold text-xl">เลื่องชื่อลือชา POS</h1>
                        <div className="flex gap-2">
                            <button onClick={() => setView('pos')} className={`px-4 py-1.5 rounded-full text-sm ${view==='pos'?'luecha-orange':'opacity-50'}`}>หน้าขาย</button>
                            <button onClick={() => setView('admin')} className={`px-4 py-1.5 rounded-full text-sm ${view==='admin'?'luecha-orange':'opacity-50'}`}>จัดการร้าน</button>
                            <button onClick={() => setView('report')} className={`px-4 py-1.5 rounded-full text-sm ${view==='report'?'luecha-orange':'opacity-50'}`}>รายงาน</button>
                        </div>
                    </header>

                    {/* VIEW: POS */}
                    {view === 'pos' && (
                        <div className="flex-1 flex overflow-hidden">
                            <div className="flex-1 p-4 grid grid-cols-2 md:grid-cols-4 gap-4 overflow-y-auto no-scrollbar">
                                {products.map(p => (
                                    <button key={p.id} onClick={() => {setSelectedItem(p); setQty(1); setSize('S'); setToppings([]);}}
                                        className="bg-white p-5 rounded-[2rem] shadow-sm active-scale flex flex-col items-center justify-center h-44 border-2 border-transparent hover:border-orange-500 transition-all">
                                        <span className="font-bold text-slate-800 text-lg">{p.name}</span>
                                        <span className="text-blue-700 font-black text-2xl">{p.price}฿</span>
                                    </button>
                                ))}
                            </div>
                            <div className="w-80 md:w-96 bg-white shadow-2xl flex flex-col">
                                <div className="p-6 border-b font-bold text-slate-700">ตะกร้าสินค้า</div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {cart.map(item => (
                                        <div key={item.cartId} className="bg-slate-50 p-4 rounded-2xl relative border">
                                            <div className="flex justify-between font-bold">
                                                <span>{item.name} x{item.qty} ({item.size})</span>
                                                <span>{item.totalPrice}฿</span>
                                            </div>
                                            <button onClick={() => setCart(cart.filter(i => i.cartId !== item.cartId))} className="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full text-xs">✕</button>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-6 bg-slate-50 border-t space-y-4">
                                    <div className="flex justify-between text-3xl font-black text-blue-900">
                                        <span>รวม</span>
                                        <span>{cartTotal}฿</span>
                                    </div>
                                    <button onClick={() => setShowPayment(true)} disabled={cart.length===0} className="w-full luecha-orange text-white py-5 rounded-3xl font-bold text-xl active-scale disabled:opacity-30">ชำระเงิน</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* VIEW: ADMIN */}
                    {view === 'admin' && (
                        <div className="flex-1 p-8 overflow-y-auto bg-white">
                            <div className="max-w-4xl mx-auto">
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="text-2xl font-bold">รายการสินค้า</h2>
                                    <button onClick={() => {setEditingProduct(null); setForm({name:'', price:'', cost:'', categoryId:1}); setShowProductModal(true);}} className="btn-teal text-white px-6 py-2 rounded-xl font-bold">+ เพิ่มสินค้า</button>
                                </div>
                                <div className="grid gap-3">
                                    {products.map(p => (
                                        <div key={p.id} className="flex justify-between items-center p-5 bg-slate-50 rounded-3xl border">
                                            <span className="font-bold text-lg">{p.name}</span>
                                            <div className="flex items-center gap-4">
                                                <span className="text-blue-600 font-bold">{p.price}฿</span>
                                                <button onClick={() => {setEditingProduct(p); setForm(p); setShowProductModal(true);}} className="text-teal font-bold bg-teal-50 px-4 py-1 rounded-lg">แก้ไข</button>
                                                <button onClick={async () => {if(confirm('ลบ?')) {await db.products.delete(p.id); refreshData();}}} className="text-red-400">ลบ</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* VIEW: REPORT */}
                    {view === 'report' && (
                        <div className="flex-1 p-8 overflow-y-auto bg-white">
                            <div className="max-w-4xl mx-auto">
                                <h2 className="text-3xl font-bold mb-8">รายงานยอดขาย</h2>
                                <div className="grid grid-cols-2 gap-6 mb-8">
                                    <div className="luecha-blue p-8 rounded-[2.5rem] text-white">
                                        <p className="opacity-70">ยอดขายรวม</p>
                                        <p className="text-5xl font-black">{orders.reduce((s, o) => s + Number(o.total), 0).toLocaleString()}฿</p>
                                    </div>
                                    <div className="bg-slate-100 p-8 rounded-[2.5rem]">
                                        <p className="text-slate-500">จำนวนบิล</p>
                                        <p className="text-5xl font-black">{orders.length}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==========================================
                        PART 6: MODALS (ป๊อปอัพต่างๆ)
                    ========================================== */}
                    
                    {/* MODAL: IMAGE 5 (เลือกสินค้า) */}
                    {selectedItem && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white w-full max-w-4xl rounded-[2.5rem] overflow-hidden shadow-2xl animate-in zoom-in-95 duration-200">
                                <div className="p-4 border-b flex justify-between items-center">
                                    <span className="font-bold text-slate-700">ยืนยันจำนวนสินค้า</span>
                                    <button onClick={() => setSelectedItem(null)} className="text-red-500 bg-red-50 w-8 h-8 rounded-full flex items-center justify-center">✕</button>
                                </div>
                                <div className="flex flex-col md:flex-row">
                                    <div className="flex-1 p-8 space-y-8 border-r">
                                        <div className="flex gap-6 items-center bg-slate-50 p-6 rounded-[2rem]">
                                            <div className="w-24 h-24 bg-white rounded-2xl shadow-sm flex items-center justify-center text-4xl">🥤</div>
                                            <div>
                                                <h3 className="text-2xl font-bold">{selectedItem.name}</h3>
                                                <p className="text-slate-400">ราคา {selectedItem.price} บาท</p>
                                            </div>
                                        </div>
                                        <div className="flex justify-between items-center">
                                            <span className="font-bold text-lg">จำนวน</span>
                                            <div className="flex items-center gap-6">
                                                <button onClick={() => setQty(Math.max(1, qty-1))} className="w-12 h-12 rounded-2xl bg-red-50 text-red-500 text-2xl font-bold active-scale">-</button>
                                                <span className="text-3xl font-black w-8 text-center">{qty}</span>
                                                <button onClick={() => setQty(qty+1)} className="w-12 h-12 rounded-2xl bg-blue-50 text-blue-500 text-2xl font-bold active-scale">+</button>
                                            </div>
                                        </div>
                                        <div className="pt-4 border-t flex justify-between text-2xl font-black">
                                            <span>ราคารวม</span>
                                            <span className="text-red-500">{currentItemTotal} บาท</span>
                                        </div>
                                    </div>
                                    <div className="w-full md:w-[400px] p-8 bg-slate-50/30 space-y-8">
                                        <div>
                                            <p className="font-bold mb-4">ไซส์ <span className="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full">จำเป็น</span></p>
                                            <div className="grid grid-cols-3 gap-2">
                                                {['S', 'M', 'L'].map(s => (
                                                    <button key={s} onClick={() => setSize(s)}
                                                        className={`py-4 rounded-2xl font-bold border-2 transition-all ${size===s?'btn-teal text-white border-transparent':'bg-white border-slate-100 text-slate-400'}`}>
                                                        {s} <div className="text-[10px] font-normal">{s==='S'?'':s==='M'?'+5':'+10'}</div>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <div>
                                            <p className="font-bold mb-4">ท็อปปิ้ง <span className="bg-slate-200 text-slate-500 text-[10px] px-2 py-0.5 rounded-full font-normal">ไม่บังคับ</span></p>
                                            <div className="flex flex-wrap gap-2">
                                                {[{name:'วิปครีม',price:20},{name:'ชีสขูด',price:20}].map(t => {
                                                    const isSel = toppings.find(x => x.name === t.name);
                                                    return (
                                                        <button key={t.name} onClick={() => {
                                                            const next = isSel ? toppings.filter(x => x.name !== t.name) : [...toppings, t];
                                                            setToppings(next);
                                                        }} className={`px-4 py-2 rounded-full border-2 text-sm transition-all ${isSel?'border-teal-500 bg-teal-50 text-teal-600 font-bold':'bg-white border-slate-100 text-slate-400'}`}>
                                                            {t.name} +{t.price}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-6 bg-white border-t">
                                    <button onClick={handleAddToCart} className="w-full btn-teal text-white py-5 rounded-2xl font-bold text-xl active-scale">🛒 เพิ่มลงตะกร้า</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: IMAGE 7 (เพิ่ม/แก้ไขสินค้า) */}
                    {showProductModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-300">
                                <div className="p-5 border-b flex justify-between items-center">
                                    <span className="font-bold text-teal-600 text-xl">{editingProduct ? 'แก้ไขสินค้า' : 'เพิ่มสินค้า'}</span>
                                    <button onClick={() => setShowProductModal(false)} className="text-red-500 bg-red-50 w-8 h-8 rounded-full flex items-center justify-center">✕</button>
                                </div>
                                <div className="p-6 space-y-6 max-h-[70vh] overflow-y-auto no-scrollbar">
                                    <div className="flex gap-6">
                                        <div className="w-28 h-28 bg-slate-50 border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center justify-center text-slate-300">
                                            <span className="text-3xl">?</span>
                                            <span className="text-[10px]">เลือกรูป</span>
                                        </div>
                                        <div className="flex-1 space-y-4">
                                            <input type="text" placeholder="ชื่อสินค้า *" className="w-full border-b-2 border-slate-100 py-2 outline-none focus:border-teal-500 transition-all"
                                                value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                                            <div className="flex gap-4">
                                                <input type="number" placeholder="ราคาขาย *" className="w-full bg-slate-50 p-3 rounded-2xl outline-none focus:ring-2 focus:ring-teal-500"
                                                    value={form.price} onChange={e => setForm({...form, price: e.target.value})} />
                                                <input type="number" placeholder="ต้นทุน" className="w-full bg-slate-50 p-3 rounded-2xl outline-none focus:ring-2 focus:ring-teal-500"
                                                    value={form.cost} onChange={e => setForm({...form, cost: e.target.value})} />
                                            </div>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        <div className="border rounded-2xl overflow-hidden">
                                            <button onClick={() => setOpenSection(openSection==='category'?'':'category')} className="w-full p-4 flex justify-between items-center bg-white">
                                                <div className="flex items-center gap-3 text-teal-600 font-bold">🏷️ หมวดหมู่</div>
                                                <span>{openSection==='category'?'▲':'▼'}</span>
                                            </button>
                                            {openSection === 'category' && (
                                                <div className="p-4 bg-slate-50 flex flex-wrap gap-2 border-t">
                                                    {categories.map(c => (
                                                        <button key={c.id} onClick={() => setForm({...form, categoryId: c.id})}
                                                            className={`px-6 py-2 rounded-full text-sm font-bold transition-all ${form.categoryId===c.id?'btn-teal text-white':'bg-white text-slate-400 border'}`}>
                                                            {c.name}
                                                        </button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                <div className="p-6">
                                    <button onClick={handleSaveProduct} className="w-full btn-teal text-white py-5 rounded-2xl font-bold text-xl active-scale flex items-center justify-center gap-3 shadow-lg">
                                        💾 บันทึก
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: IMAGE 4 (ชำระเงิน) */}
                    {showPayment && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white w-full max-w-4xl rounded-[2.5rem] overflow-hidden shadow-2xl flex flex-col">
                                <div className="p-4 border-b flex justify-between items-center">
                                    <span className="font-bold text-slate-700">ชำระเงิน</span>
                                    <button onClick={() => setShowPayment(false)} className="text-2xl">✕</button>
                                </div>
                                <div className="flex flex-col md:flex-row">
                                    <div className="flex-1 p-8 space-y-6 border-r">
                                        <div className="btn-teal text-white p-8 rounded-3xl text-center shadow-inner">
                                            <p className="text-sm opacity-70">ยอดรวม</p>
                                            <p className="text-6xl font-black">{cartTotal}</p>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2">
                                            {['cash', 'transfer', 'delivery'].map(m => (
                                                <button key={m} onClick={() => setPaymentMethod(m)} className={`p-4 rounded-2xl border-2 transition-all ${paymentMethod===m?'border-teal-500 bg-teal-50 text-teal-600 font-bold':'border-slate-100 text-slate-400'}`}>
                                                    {m.toUpperCase()}
                                                </button>
                                            ))}
                                        </div>
                                        <div className="space-y-2">
                                            <div className="bg-slate-50 p-4 rounded-2xl border-2 border-teal-100 flex justify-between items-center">
                                                <span className="text-slate-400">รับมา</span>
                                                <input type="number" className="bg-transparent text-3xl font-black text-right outline-none w-1/2 text-teal-600" 
                                                    value={cashReceived || ''} onChange={e => setCashReceived(Number(e.target.value))} placeholder="0" />
                                            </div>
                                            <div className="flex justify-between p-4 text-2xl font-black">
                                                <span className="text-slate-400 tracking-tight">เงินทอน</span>
                                                <span className="text-red-500">{changeAmount} บาท</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="w-full md:w-96 p-8 bg-slate-50">
                                        <p className="text-xs font-bold text-slate-400 mb-4 uppercase tracking-wider">รับเงินด่วน</p>
                                        <div className="grid grid-cols-3 gap-2">
                                            <button onClick={() => setCashReceived(cartTotal)} className="h-16 bg-green-100 text-green-700 font-bold rounded-xl">พอดี</button>
                                            {[20, 50, 100, 500, 1000].map(v => (
                                                <button key={v} onClick={() => setCashReceived(prev => Number(prev) + v)} className="h-16 bg-white border rounded-xl font-bold active-scale shadow-sm">{v}</button>
                                            ))}
                                            <button onClick={() => setCashReceived(0)} className="h-16 bg-red-50 text-red-500 font-bold rounded-xl">ล้าง</button>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-6 border-t">
                                    <button onClick={handleConfirmPayment} className="w-full btn-teal text-white py-5 rounded-2xl font-bold text-xl active-scale shadow-lg">ยืนยันชำระเงิน</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
