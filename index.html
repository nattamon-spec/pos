<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lue cha POS | Final Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-scale:active { transform: scale(0.95); transition: 0.1s; }
        .luecha-blue { background-color: #003399; }
        .luecha-orange { background-color: #FF6600; }
        .teal-theme { background-color: #2497a9; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 1. Database Setup (Fixed Schema) ---
        const db = new Dexie("LueCha_Final_DB");
        db.version(1).stores({
            products: "++id, name, price, cost, category",
            ingredients: "++id, name, unit, stock, minStock",
            orders: "++id, total, timestamp, staff, paymentMethod"
        });

        // ข้อมูลเมนูคงที่จากรูปภาพ
        const INITIAL_PRODUCTS = [
            { name: "ชาไทย (Thai Tea)", price: 35, cost: 15, category: "เครื่องดื่ม" },
            { name: "ชาเขียว (Green Tea)", price: 35, cost: 15, category: "เครื่องดื่ม" },
            { name: "โกโก้ (Cocoa)", price: 35, cost: 18, category: "เครื่องดื่ม" },
            { name: "นมสด (Fresh Milk)", price: 35, cost: 12, category: "เครื่องดื่ม" },
            { name: "ชาไทยดับเบิ้ลชีส", price: 69, cost: 30, category: "Special" },
            { name: "โกโก้ช็อกขูด", price: 50, cost: 25, category: "Special" }
        ];

        const TOPPINGS = [
            { name: "ครีมชีส", price: 20 }, { name: "ชีสขูด", price: 20 },
            { name: "บิสคอฟ", price: 20 }, { name: "วิปครีม", price: 20 },
            { name: "ช็อกขูด", price: 20 }, { name: "ชาคิวบ์", price: 20 }
        ];

        function App() {
            const [view, setView] = useState('pos');
            const [cart, setCart] = useState([]);
            const [products, setProducts] = useState([]);
            const [ingredients, setIngredients] = useState([]);
            const [orders, setOrders] = useState([]);
            
            // UI States
            const [selectedItem, setSelectedItem] = useState(null);
            const [showPayment, setShowPayment] = useState(false);
            const [showAddProduct, setShowAddProduct] = useState(false);
            const [showAddIngredient, setShowAddIngredient] = useState(false);

            // Payment States
            const [paymentMethod, setPaymentMethod] = useState('cash');
            const [cashReceived, setCashReceived] = useState(0);
            const [queueNumber, setQueueNumber] = useState(1);

            // Form States
            const [newProd, setNewProd] = useState({ name: '', price: '', cost: '', category: 'เครื่องดื่ม' });
            const [newIng, setNewIng] = useState({ name: '', unit: 'กรัม', stock: '', minStock: '' });

            useEffect(() => {
                const init = async () => {
                    if (await db.products.count() === 0) await db.products.bulkAdd(INITIAL_PRODUCTS);
                    refreshData();
                };
                init();
            }, []);

            const refreshData = async () => {
                setProducts(await db.products.toArray());
                setIngredients(await db.ingredients.toArray());
                setOrders(await db.orders.toArray());
            };

            // --- Math Logic (Fixed) ---
            const totalAmount = useMemo(() => {
                return cart.reduce((sum, item) => Number(sum) + Number(item.price), 0);
            }, [cart]);

            const changeAmount = useMemo(() => {
                const change = Number(cashReceived) - Number(totalAmount);
                return change > 0 ? change : 0;
            }, [cashReceived, totalAmount]);

            const handleQuickCash = (val) => {
                if (val === 'exact') setCashReceived(Number(totalAmount));
                else setCashReceived(prev => Number(prev) + Number(val));
            };

            // --- Actions ---
            const addToCart = (product, size, toppings) => {
                let price = Number(product.price);
                if (size === 'M') price += 5;
                if (size === 'L') price += 10;
                const toppingPrice = toppings.reduce((s, t) => s + Number(t.price), 0);
                
                setCart([...cart, { 
                    ...product, 
                    cartId: Date.now(), 
                    size, 
                    toppings, 
                    price: price + toppingPrice 
                }]);
                setSelectedItem(null);
            };

            const confirmPayment = async () => {
                if (paymentMethod === 'cash' && Number(cashReceived) < totalAmount) return alert("เงินรับมาไม่พอ");
                await db.orders.add({
                    total: totalAmount,
                    timestamp: new Date(),
                    paymentMethod,
                    queue: queueNumber
                });
                setQueueNumber(prev => prev + 1);
                setCart([]);
                setCashReceived(0);
                setShowPayment(false);
                refreshData();
                alert("ชำระเงินสำเร็จ!");
            };

            return (
                <div className="h-screen flex flex-col overflow-hidden bg-slate-50">
                    {/* Header */}
                    <header className="luecha-blue p-4 text-white flex justify-between items-center shadow-lg z-10">
                        <h1 className="font-bold text-xl">เลื่องชื่อลือชา POS</h1>
                        <div className="flex gap-2">
                            <button onClick={() => setView('pos')} className={`px-4 py-1 rounded-full text-sm ${view==='pos'?'luecha-orange':'opacity-50'}`}>หน้าขาย</button>
                            <button onClick={() => setView('admin')} className={`px-4 py-1 rounded-full text-sm ${view==='admin'?'luecha-orange':'opacity-50'}`}>สต็อก/จัดการ</button>
                            <button onClick={() => setView('report')} className={`px-4 py-1 rounded-full text-sm ${view==='report'?'luecha-orange':'opacity-50'}`}>รายงาน</button>
                        </div>
                    </header>

                    {view === 'pos' && (
                        <div className="flex-1 flex overflow-hidden">
                            <div className="flex-1 p-4 grid grid-cols-2 md:grid-cols-4 gap-4 overflow-y-auto no-scrollbar">
                                {products.map(p => (
                                    <button key={p.id} onClick={() => setSelectedItem({...p, size:'S', toppings:[]})}
                                        className="bg-white p-4 rounded-[2rem] shadow-sm active-scale flex flex-col items-center justify-center h-40 border-2 border-transparent hover:border-orange-500">
                                        <span className="font-bold text-slate-800">{p.name}</span>
                                        <span className="text-blue-700 font-black text-xl">{p.price}฿</span>
                                    </button>
                                ))}
                            </div>
                            <div className="w-80 md:w-96 bg-white shadow-2xl flex flex-col">
                                <div className="p-6 border-b font-bold text-lg">ตะกร้าสินค้า</div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {cart.map(item => (
                                        <div key={item.cartId} className="bg-slate-50 p-3 rounded-2xl relative">
                                            <div className="flex justify-between font-bold">
                                                <span>{item.name} ({item.size})</span>
                                                <span>{item.price}฿</span>
                                            </div>
                                            <button onClick={() => setCart(cart.filter(i => i.cartId !== item.cartId))} className="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full text-xs">✕</button>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-6 bg-slate-50 border-t space-y-4">
                                    <div className="flex justify-between text-3xl font-black text-blue-900">
                                        <span>รวม</span>
                                        <span>{totalAmount}฿</span>
                                    </div>
                                    <button onClick={() => setShowPayment(true)} disabled={cart.length===0} className="w-full luecha-orange text-white py-5 rounded-3xl font-bold text-xl active-scale disabled:opacity-30">ชำระเงิน</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'admin' && (
                        <div className="flex-1 p-8 overflow-y-auto bg-white">
                            <div className="max-w-5xl mx-auto space-y-10">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-3xl font-bold">จัดการระบบ</h2>
                                    <div className="flex gap-2">
                                        <button onClick={() => setShowAddIngredient(true)} className="bg-slate-800 text-white px-6 py-2 rounded-xl text-sm">+ เพิ่มสต็อก</button>
                                        <button onClick={() => setShowAddProduct(true)} className="teal-theme text-white px-6 py-2 rounded-xl text-sm">+ เพิ่มสินค้า</button>
                                    </div>
                                </div>
                                
                                <section>
                                    <h3 className="font-bold text-slate-400 mb-4 uppercase">คลังวัตถุดิบ</h3>
                                    <div className="grid grid-cols-3 gap-4">
                                        {ingredients.map(ing => (
                                            <div key={ing.id} className="bg-slate-50 p-6 rounded-3xl border">
                                                <p className="text-sm text-slate-500">{ing.name}</p>
                                                <p className="text-2xl font-black">{ing.stock} {ing.unit}</p>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <section>
                                    <h3 className="font-bold text-slate-400 mb-4 uppercase">รายการสินค้า</h3>
                                    <div className="grid gap-2">
                                        {products.map(p => (
                                            <div key={p.id} className="flex justify-between p-4 border rounded-2xl">
                                                <span className="font-bold">{p.name}</span>
                                                <span className="text-blue-600 font-bold">{p.price}฿</span>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </div>
                        </div>
                    )}

                    {/* --- PAYMENT MODAL (Fixed Math & UI) --- */}
                    {showPayment && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center z-[60] p-4">
                            <div className="bg-white w-full max-w-4xl rounded-[2rem] overflow-hidden shadow-2xl flex flex-col">
                                <div className="p-4 border-b flex justify-between items-center">
                                    <span className="font-bold">ชำระเงิน</span>
                                    <button onClick={() => {setShowPayment(false); setCashReceived(0);}} className="text-2xl">✕</button>
                                </div>
                                <div className="flex flex-col md:flex-row flex-1 overflow-y-auto">
                                    <div className="flex-1 p-6 space-y-6 border-r">
                                        <div className="luecha-blue text-white p-8 rounded-3xl text-center">
                                            <p className="text-sm opacity-70">ยอดรวม</p>
                                            <p className="text-6xl font-black">{totalAmount}</p>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2">
                                            {['cash', 'transfer', 'delivery'].map(m => (
                                                <button key={m} onClick={() => setPaymentMethod(m)} className={`p-4 rounded-2xl border-2 ${paymentMethod===m?'border-blue-500 bg-blue-50':'border-slate-100'}`}>
                                                    <p className="text-xs font-bold uppercase">{m}</p>
                                                </button>
                                            ))}
                                        </div>
                                        <div className="space-y-2">
                                            <div className="bg-slate-50 p-4 rounded-2xl border-2 border-blue-100 flex justify-between items-center">
                                                <span className="text-slate-400">รับมา</span>
                                                <input type="number" className="bg-transparent text-3xl font-black text-right outline-none w-1/2" 
                                                    value={cashReceived || ''} onChange={e => setCashReceived(Number(e.target.value))} />
                                            </div>
                                            <div className="flex justify-between p-4">
                                                <span className="text-slate-400">เงินทอน</span>
                                                <span className="text-4xl font-black text-red-500">{changeAmount}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="w-full md:w-96 p-6 bg-slate-50">
                                        <p className="text-xs font-bold text-slate-400 mb-4">รับเงินด่วน</p>
                                        <div className="grid grid-cols-3 gap-2">
                                            <button onClick={() => handleQuickCash('exact')} className="h-16 bg-green-100 text-green-700 font-bold rounded-xl">พอดี</button>
                                            {[20, 50, 100, 500, 1000].map(v => (
                                                <button key={v} onClick={() => handleQuickCash(v)} className="h-16 bg-white border rounded-xl font-bold">{v}</button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <div className="p-4 border-t">
                                    <button onClick={confirmPayment} className="w-full luecha-orange text-white py-5 rounded-2xl font-bold text-xl active-scale">ยืนยันชำระเงิน</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- ADD PRODUCT MODAL --- */}
                    {showAddProduct && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[70] p-4">
                            <div className="bg-white w-full max-w-md rounded-3xl p-8">
                                <h2 className="text-2xl font-bold mb-6">เพิ่มสินค้าใหม่</h2>
                                <div className="space-y-4">
                                    <input type="text" placeholder="ชื่อสินค้า" className="w-full p-4 bg-slate-50 rounded-2xl outline-none" onChange={e => setNewProd({...newProd, name: e.target.value})} />
                                    <input type="number" placeholder="ราคาขาย" className="w-full p-4 bg-slate-50 rounded-2xl outline-none" onChange={e => setNewProd({...newProd, price: Number(e.target.value)})} />
                                    <input type="number" placeholder="ต้นทุน" className="w-full p-4 bg-slate-50 rounded-2xl outline-none" onChange={e => setNewProd({...newProd, cost: Number(e.target.value)})} />
                                    <button onClick={async () => {
                                        await db.products.add(newProd);
                                        setShowAddProduct(false);
                                        refreshData();
                                    }} className="w-full teal-theme text-white py-4 rounded-2xl font-bold">บันทึกสินค้า</button>
                                    <button onClick={() => setShowAddProduct(false)} className="w-full text-slate-400">ยกเลิก</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- MODAL: SIZE & TOPPING --- */}
                    {selectedItem && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[70] p-4">
                            <div className="bg-white w-full max-w-md rounded-3xl p-8">
                                <h3 className="text-xl font-bold mb-6">{selectedItem.name}</h3>
                                <div className="grid grid-cols-3 gap-2 mb-6">
                                    {['S', 'M', 'L'].map(s => (
                                        <button key={s} onClick={() => setSelectedItem({...selectedItem, size: s})} className={`py-3 rounded-xl border-2 ${selectedItem.size===s?'border-orange-500 bg-orange-50':'border-slate-100'}`}>{s}</button>
                                    ))}
                                </div>
                                <div className="grid grid-cols-2 gap-2 mb-8">
                                    {TOPPINGS.map(t => (
                                        <button key={t.name} onClick={() => {
                                            const has = selectedItem.toppings.find(x => x.name === t.name);
                                            const next = has ? selectedItem.toppings.filter(x => x.name !== t.name) : [...selectedItem.toppings, t];
                                            setSelectedItem({...selectedItem, toppings: next});
                                        }} className={`p-3 rounded-xl border text-sm ${selectedItem.toppings.find(x=>x.name===t.name)?'bg-blue-50 border-blue-500 text-blue-700':''}`}>{t.name} (+{t.price})</button>
                                    ))}
                                </div>
                                <button onClick={() => addToCart(selectedItem, selectedItem.size, selectedItem.toppings)} className="w-full luecha-orange text-white py-4 rounded-2xl font-bold">เพิ่มลงตะกร้า</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
